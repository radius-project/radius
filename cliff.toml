[remote.github]
owner = "radius-project"
repo = "radius"

[changelog]
header = """
# Changelog

All notable changes to Radius are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and Radius follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html) with the version policy documented in the [release process](docs/contributing/contributing-releases/README.md).\n
"""
body = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}

{% set breaking_commits = commits | filter(attribute="breaking", value=true) %}
{% if breaking_commits | length != 0 %}
### Breaking changes

{% for commit in breaking_commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{% endfor %}
{% endif %}
{% set normal_commits = commits | filter(attribute="breaking", value=false) %}
{% set unconventional_commits = commits | filter(attribute="conventional", value=false) %}
{% set normal_commits = normal_commits | concat(with=unconventional_commits) %}
{% for group, commits in normal_commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{% endfor %}
{% endfor %}
{% if github %}
{% if github.contributors | length != 0 %}
### Contributors

{% for contributor in github.contributors -%}
- @{{ contributor.username }}{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{% endif %}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New contributors

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{% endif %}
{% endif %}
"""
footer = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
{% if release.previous.version -%}
[Unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
render_always = true
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
  # Dependabot is configured in .github/dependabot.yml (synced from
  # radius-project/.github) with the `ci` and `chore` prefixes plus `include: scope`,
  # so dependency updates arrive as `ci(deps):` and `chore(deps):`. Match them
  # before the type-wide skip rules below, otherwise they are dropped silently.
  { message = "^(?:chore|ci)\\(deps\\)", group = "<!-- 4 -->Dependencies" },
  { message = "^feat(?:\\([^)]*\\))?!?:", group = "<!-- 1 -->Added" },
  { message = "^fix(?:\\([^)]*\\))?!?:", group = "<!-- 2 -->Fixed" },
  { message = "^perf(?:\\([^)]*\\))?!?:", group = "<!-- 3 -->Changed" },
  { message = "^refactor(?:\\([^)]*\\))?!?:", group = "<!-- 3 -->Changed" },
  { message = "^deps(?:\\([^)]*\\))?!?:", group = "<!-- 4 -->Dependencies" },
  { message = "^revert(?:\\([^)]*\\))?!?:", group = "<!-- 5 -->Reverted changes" },
  { message = "^docs(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^test(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^build(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^ci(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^chore(?:\\([^)]*\\))?!?:", skip = true },
  { message = ".*", group = "<!-- 6 -->Other changes", default_scope = "other" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc(?:\\.[0-9]+|[0-9]+))?$"
topo_order = true
topo_order_commits = true
sort_commits = "oldest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/radius-project/radius/issues/$1" },
]
