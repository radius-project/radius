namespace: Radius.Data
types:
  redisCaches:
    description: |
      The Radius.Data/redisCaches Resource Type deploys a Redis cache. To deploy a
      Redis cache, add a redisCaches resource to the application definition Bicep
      file. Unlike database types, no credential has to be supplied: the cache
      generates its own access key, so the platform-engineer recipe needs no
      injected credentials.
      ```bicep
      resource cache 'Radius.Data/redisCaches@2025-08-01-preview' = {
        name: 'redis'
        properties: {
          environment: environment
          application: myApplication.id
          size: 'S'
        }
      }
      ```

      To connect your container to the cache, create a connection from the
      Container resource to the cache as shown below.
      ```bicep
      resource frontend 'Radius.Compute/containers@2025-08-01-preview' = {
        name: 'frontend'
        properties: {
          application: myApplication.id
          environment: environment
          containers: {
            frontend: {
              image: 'frontend:1.25'
            }
          }
          connections: {
            redis: {
              source: cache.id
            }
          }
        }
      }
      ```

      On compatible Kubernetes Container Recipes, the connection injects environment
      variables into the container for the cache properties. The variables are
      named `CONNECTION_<CONNECTION-NAME>_<PROPERTY-NAME>`. In this example the
      connection name is `redis` so the environment variables will be:

      - CONNECTION_REDIS_HOST
      - CONNECTION_REDIS_PORT

      Recipe-generated secrets are materialized into a managed
      `Radius.Security/secrets` resource. With Radius control-plane support from
      `radius-project/radius#12709` and Kubernetes Container Recipe support from
      `resource-types-contrib#300` or later, the same `redis` connection injects each
      key returned in `result.secrets`: `CONNECTION_REDIS_URL`, and
      `CONNECTION_REDIS_ACCESSKEY` when the Recipe returns `accessKey`. `host` and
      `port` remain ordinary values.

      For custom, older, or mixed-version Kubernetes deployments, bind the key
      explicitly with `secretKeyRef`, using `cache.properties.secrets.name` as the
      `secretName`. Use `url` for a client that parses a connection URL, or
      `accessKey` for a client that takes host, port, and password separately:

      ```bicep
      env: {
        REDIS_ADDR: {
          value: '${cache.properties.host}:${cache.properties.port}'
        }
        REDIS_PASSWORD: {
          valueFrom: {
            secretKeyRef: {
              secretName: cache.properties.secrets.name
              key: 'accessKey'
            }
          }
        }
      }
      ```

      A recipe that provisions a cache requiring no credential does not map
      `accessKey`; bind it only against a recipe that declares it.

    apiVersions:
      '2025-08-01-preview':
        schema:
          type: object
          properties:
            environment:
              type: string
              description: "(Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`."
            application:
              type: string
              description: "(Optional) The Radius Application ID. `myApplication.id` for example."
            size:
              type: string
              enum: ['S', 'M', 'L']
              default: 'S'
              description: "(Optional) The size of the Redis cache. Defaults to `S` if not provided. The recipe maps the size onto a concrete cloud SKU."
            host:
              type: string
              description: "(Read Only) The host name used to connect to the cache. Mapped from the recipe module's output."
              readOnly: true
            port:
              type: integer
              description: "(Read Only) The TLS port number used to connect to the cache. Mapped from the recipe module's `port` output (Azure Managed Redis uses 10000)."
              readOnly: true
            secrets:
              type: object
              description: >-
                (Read-only) Recipe secrets. The reserved `name` sub-property references the managed
                Radius.Security/secrets resource Radius materializes from the Recipe's `result.secrets`;
                the other sub-properties declare secret keys whose values are written only into that
                managed secret (never onto this resource). Consumers bind a key into a container env var
                via `secretKeyRef`, using `<resource>.properties.secrets.name` as `secretName`.
              properties:
                name:
                  type: string
                  readOnly: true
                  description: (Reserved) Name of the managed Radius.Security/secrets resource. Use as `secretName` in a container `secretKeyRef`.
                url:
                  type: string
                  readOnly: true
                  description: "(Read Only) The full TLS connection URL (`rediss://:<access-key>@<host>:<port>`) used to connect to the cache, including the access key. Mapped from the recipe module's `primaryConnectionString` output; delivered via the managed secret."
                accessKey:
                  type: string
                  readOnly: true
                  description: "(Read Only) The access key on its own, for clients that take host, port, and password separately instead of parsing a URL — it is the password such a client authenticates with. Mapped from the recipe module's `primaryAccessKey` output; delivered via the managed secret. Declared by recipes that provision an authenticated cache — a recipe provisioning a cache that needs no credential (such as the in-cluster Kubernetes recipe) does not map this key."
          required: [environment]
