apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: radius-bicep
spec:
  generate:
    command: [/usr/local/bin/radius-generate.sh]
  parameters:
    static:
      - name: bicepFile
        required: true
      - name: resourceGroup
        required: true
      - name: paramsFile
