apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: radius-bicep
spec:
  generate:
    command: [/usr/local/bin/radius-generate.sh]
  parameters:
    static:
      - name: bicepFiles
        title: Bicep files, space-separated, in deploy order (e.g. "env/env.bicep app/app.bicep")
        required: true
      - name: resourceGroup
        required: true
