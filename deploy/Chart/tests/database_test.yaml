suite: test database (postgresql) provider configuration
templates:
  - database/configmaps.yaml
  - database/configmap-initdb.yaml
  - database/statefulset.yaml
  - database/service.yaml
  - database/serviceaccount.yaml
  - ucp/configmaps.yaml
  - ucp/deployment.yaml
  - rp/configmaps.yaml
  - rp/deployment.yaml
  - dynamic-rp/configmaps.yaml
  - dynamic-rp/deployment.yaml
tests:
  # --- database.enabled=false (default) ---
  - it: should not render the database secret when database is disabled
    set:
      database.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: database/configmaps.yaml

  - it: should not render the initdb configmap when database is disabled
    set:
      database.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: database/configmap-initdb.yaml

  - it: should use the apiserver provider for UCP when database is disabled
    set:
      database.enabled: false
    asserts:
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'provider: "apiserver"'
        template: ucp/configmaps.yaml

  - it: should use the apiserver provider for applications-rp when database is disabled
    set:
      database.enabled: false
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'provider: "apiserver"'
        template: rp/configmaps.yaml

  - it: should use the apiserver provider for dynamic-rp when database is disabled
    set:
      database.enabled: false
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'provider: "apiserver"'
        template: dynamic-rp/configmaps.yaml

  # --- database.enabled=true ---
  - it: should render the database secret with a literal radius database name
    set:
      database.enabled: true
    asserts:
      - isKind:
          of: Secret
        template: database/configmaps.yaml
      - equal:
          path: stringData.POSTGRES_DB
          value: "radius"
        template: database/configmaps.yaml

  - it: should render the initdb configmap when database is enabled
    set:
      database.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
        template: database/configmap-initdb.yaml
      - equal:
          path: metadata.name
          value: database-initdb
        template: database/configmap-initdb.yaml

  - it: should grant the per-RP users privileges on the resources table
    set:
      database.enabled: true
    asserts:
      # Guards against the "permission denied for table resources" startup crash: the table is
      # created by the superuser, so the per-RP user must be granted access.
      - matchRegex:
          path: data["init-db.sh"]
          pattern: 'GRANT ALL PRIVILEGES ON TABLE resources TO "\$RESOURCE_PROVIDER"'
        template: database/configmap-initdb.yaml
      - matchRegex:
          path: data["init-db.sh"]
          pattern: 'GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "\$RESOURCE_PROVIDER"'
        template: database/configmap-initdb.yaml

  - it: should use a pullable postgres image reference
    set:
      database.enabled: true
    asserts:
      # Guards against pointing at a registry-mirror tag that does not exist (ImagePullBackOff).
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/library/postgres:16-alpine"
        template: database/statefulset.yaml

  - it: should mount the initdb scripts into the database statefulset
    set:
      database.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: initdb-scripts
            configMap:
              name: database-initdb
        template: database/statefulset.yaml

  - it: should use the postgresql provider for UCP when database is enabled
    set:
      database.enabled: true
    asserts:
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'provider: "postgresql"'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'postgresql://ucp:\$\{POSTGRES_PASSWORD\}@database\.'
        template: ucp/configmaps.yaml

  - it: should use the postgresql provider for applications-rp when database is enabled
    set:
      database.enabled: true
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'postgresql://applications_rp:\$\{POSTGRES_PASSWORD\}@database\.'
        template: rp/configmaps.yaml

  - it: should use the postgresql provider for dynamic-rp when database is enabled
    set:
      database.enabled: true
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'postgresql://dynamic_rp:\$\{POSTGRES_PASSWORD\}@database\.'
        template: dynamic-rp/configmaps.yaml

  - it: should inject POSTGRES_PASSWORD into UCP when database is enabled
    set:
      database.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database-secret
                key: POSTGRES_PASSWORD
        template: ucp/deployment.yaml

  - it: should inject POSTGRES_PASSWORD into applications-rp when database is enabled
    set:
      database.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database-secret
                key: POSTGRES_PASSWORD
        template: rp/deployment.yaml

  - it: should inject POSTGRES_PASSWORD into dynamic-rp when database is enabled
    set:
      database.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database-secret
                key: POSTGRES_PASSWORD
        template: dynamic-rp/deployment.yaml

  - it: should not inject POSTGRES_PASSWORD into dynamic-rp when database is disabled
    set:
      database.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database-secret
                key: POSTGRES_PASSWORD
        template: dynamic-rp/deployment.yaml

  # --- database.external.host set ---
  - it: should not render in-cluster database resources when an external host is set
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
    asserts:
      - hasDocuments:
          count: 0
        template: database/configmaps.yaml
      - hasDocuments:
          count: 0
        template: database/configmap-initdb.yaml
      - hasDocuments:
          count: 0
        template: database/statefulset.yaml
      - hasDocuments:
          count: 0
        template: database/service.yaml
      - hasDocuments:
          count: 0
        template: database/serviceaccount.yaml

  - it: should connect each resource provider to the external host
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.port: 6432
      database.external.existingSecret: radius-db
    asserts:
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'url: "postgresql://ucp:\$\{POSTGRES_PASSWORD\}@pg\.example\.com:6432/ucp\?sslmode=verify-full"'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'url: "postgresql://applications_rp:\$\{POSTGRES_PASSWORD\}@pg\.example\.com:6432/applications_rp\?sslmode=verify-full"'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'url: "postgresql://dynamic_rp:\$\{POSTGRES_PASSWORD\}@pg\.example\.com:6432/dynamic_rp\?sslmode=verify-full"'
        template: dynamic-rp/configmaps.yaml

  - it: should read POSTGRES_PASSWORD from the existing secret when an external host is set
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: radius-db
                key: POSTGRES_PASSWORD
        template: ucp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: radius-db
                key: POSTGRES_PASSWORD
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: radius-db
                key: POSTGRES_PASSWORD
        template: dynamic-rp/deployment.yaml

  - it: should require an existing secret when an external host is set
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
    asserts:
      - failedTemplate:
          errorMessage: database.external.existingSecret is required when database.external.host is set

  - it: should require database.enabled when an external host is set
    template: database/statefulset.yaml
    set:
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
    asserts:
      - failedTemplate:
          errorMessage: database.external.host requires database.enabled=true

  - it: should roll each resource provider when the external connection changes
    templates:
      - ucp/deployment.yaml
      - rp/deployment.yaml
      - dynamic-rp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/database-config"]

  - it: should not add a rollout checksum for the in-cluster database
    templates:
      - ucp/deployment.yaml
      - rp/deployment.yaml
      - dynamic-rp/deployment.yaml
    set:
      database.enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/database-config"]

  - it: should derive the ucp rollout checksum from its database settings
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: 78a985f86b5306a323005412f41035b77f08c8c7d5d71d6437ef233d762d7729

  # Releases upgraded with --reuse-values from a chart without database.external have no such map.
  - it: should render when database.external is absent
    set:
      database.enabled: true
      database.external: null
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: '@database\.NAMESPACE:5432/ucp\?sslmode=disable'
        template: ucp/configmaps.yaml

  - it: should render a numeric-looking secret name as a string
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: 123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "123"
                key: POSTGRES_PASSWORD
        template: ucp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "123"
                key: POSTGRES_PASSWORD
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "123"
                key: POSTGRES_PASSWORD
        template: dynamic-rp/deployment.yaml

  # --- database.external.authMode=azure ---
  - it: should sign each resource provider in as the shared Entra user with workload identity
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-wi
      database.external.azure.clientId: 00000000-0000-0000-0000-000000000001
      global.azureWorkloadIdentity.enabled: true
    asserts:
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'url: "postgresql://radius-wi@pg\.example\.com:5432/ucp\?sslmode=verify-full"\n\s+authMode: azure\n\s+azure:\n\s+credential: "workloadIdentity"\n\s+clientId: "00000000-0000-0000-0000-000000000001"\n'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'url: "postgresql://radius-wi@pg\.example\.com:5432/applications_rp\?sslmode=verify-full"\n\s+authMode: azure\n\s+azure:\n\s+credential: "workloadIdentity"\n\s+clientId: "00000000-0000-0000-0000-000000000001"\n'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'url: "postgresql://radius-wi@pg\.example\.com:5432/dynamic_rp\?sslmode=verify-full"\n\s+authMode: azure\n\s+azure:\n\s+credential: "workloadIdentity"\n\s+clientId: "00000000-0000-0000-0000-000000000001"\n'
        template: dynamic-rp/configmaps.yaml

  - it: should not inject POSTGRES_PASSWORD with authMode azure
    templates:
      - ucp/deployment.yaml
      - rp/deployment.yaml
      - dynamic-rp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-wi
      database.external.azure.credential: managedIdentity
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
          any: true
      - exists:
          path: spec.template.metadata.annotations["checksum/database-config"]

  - it: should use the system-assigned managed identity when clientId is empty
    template: ucp/configmaps.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
    asserts:
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'credential: "managedIdentity"'
      - notMatchRegex:
          path: data["ucp-config.yaml"]
          pattern: clientId

  # Pins the checksums for one identity; the next test changes only clientId and expects new ones.
  - it: should derive the Entra rollout checksums from the sign-in settings
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
      database.external.azure.clientId: 00000000-0000-0000-0000-000000000001
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: c1cfa4210f61b07bc93c538544b738cc41614230b472ff71ee214d764b87da93
        template: ucp/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: 8ccb9afe687967ececb24c29fe785b7255bf5bd6df7776eb2f9280458dfe757a
        template: rp/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: 6dd88879d904a97829618f7ae20af658827102c1d21dfeff9d44e188469f1448
        template: dynamic-rp/deployment.yaml

  - it: should roll each resource provider when the Entra client ID changes
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
      database.external.azure.clientId: 00000000-0000-0000-0000-000000000002
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: c1cfa4210f61b07bc93c538544b738cc41614230b472ff71ee214d764b87da93
        template: ucp/deployment.yaml
      - notEqual:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: 8ccb9afe687967ececb24c29fe785b7255bf5bd6df7776eb2f9280458dfe757a
        template: rp/deployment.yaml
      - notEqual:
          path: spec.template.metadata.annotations["checksum/database-config"]
          value: 6dd88879d904a97829618f7ae20af658827102c1d21dfeff9d44e188469f1448
        template: dynamic-rp/deployment.yaml

  - it: should reject authMode azure without the Entra user
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.credential: managedIdentity
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.user is required when database.external.authMode=azure

  - it: should reject an Entra user that needs escaping in the URL
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius@example.com
      database.external.azure.credential: managedIdentity
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.user may contain only letters, digits, '.', '_', and '-'

  - it: should reject authMode azure with a password secret
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
    asserts:
      - failedTemplate:
          errorMessage: database.external.existingSecret is not used with database.external.authMode=azure; unset it

  - it: should reject authMode azure without verify-full
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.sslmode: require
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
    asserts:
      - failedTemplate:
          errorMessage: database.external.authMode=azure requires database.external.sslmode=verify-full

  - it: should require a client ID for workload identity
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-wi
      global.azureWorkloadIdentity.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.clientId is required when database.external.azure.credential=workloadIdentity

  - it: should require global.azureWorkloadIdentity.enabled for workload identity
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-wi
      database.external.azure.clientId: 00000000-0000-0000-0000-000000000001
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.credential=workloadIdentity requires global.azureWorkloadIdentity.enabled=true

  - it: should reject an unknown credential
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-wi
      database.external.azure.credential: clientSecret
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.credential must be workloadIdentity or managedIdentity, got "clientSecret"

  - it: should reject an unknown authMode
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
      database.external.authMode: token
    asserts:
      - failedTemplate:
          errorMessage: database.external.authMode must be password or azure, got "token"

  - it: should reject authMode azure without an external host
    template: database/statefulset.yaml
    set:
      database.enabled: true
      database.external.authMode: azure
    asserts:
      - failedTemplate:
          errorMessage: database.external.authMode and database.external.azure apply only to an external server; set database.external.host

  - it: should treat an empty authMode as password
    set:
      database.external.authMode: ""
    asserts:
      - notFailedTemplate: {}

  - it: should reject a client ID that is not a GUID
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.authMode: azure
      database.external.azure.user: radius-mi
      database.external.azure.credential: managedIdentity
      database.external.azure.clientId: 0
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.clientId must be a GUID, got "0"

  - it: should reject Entra settings with authMode password
    template: ucp/deployment.yaml
    set:
      database.enabled: true
      database.external.host: pg.example.com
      database.external.existingSecret: radius-db
      database.external.azure.user: radius-mi
    asserts:
      - failedTemplate:
          errorMessage: database.external.azure.user and database.external.azure.clientId are used only with database.external.authMode=azure

  - it: should reject Entra settings without an external host
    template: database/statefulset.yaml
    set:
      database.external.azure.clientId: 00000000-0000-0000-0000-000000000001
    asserts:
      - failedTemplate:
          errorMessage: database.external.authMode and database.external.azure apply only to an external server; set database.external.host
