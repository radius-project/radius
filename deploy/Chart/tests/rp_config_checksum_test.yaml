suite: test applications RP authorization config checksum
templates:
  - rp/deployment.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: preserves the off checksum by default
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: preserves the off checksum when global.rbac is missing
    set:
      global.rbac: null
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: ignores pod security level changes when authorization is off
    set:
      global.rbac.podSecurityLevel: restricted
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: hashes dryRun with the default baseline level
    set:
      global.rbac.dryRun: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: c6c7a3d4eec928e4d53872ea530a469ca949e96dccfbbd25ffc0dda5f2ddcce8

  - it: changes the dryRun checksum for a level-only upgrade to restricted
    set:
      global.rbac.dryRun: true
      global.rbac.podSecurityLevel: restricted
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b152849f77a83187573350d46b8071ce8bc83a8346a5f96bc34a23221e31ffa7

  - it: hashes enforce with the default baseline level
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 60f02f133f24bfc5887b56ff66a8f9da69f1a48a28ac72f2a15319fe01ea39e3

  - it: changes the enforce checksum for a level-only upgrade to restricted
    set:
      global.rbac.enabled: true
      global.rbac.podSecurityLevel: restricted
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 880378b36b6ff2b99d806c338bafd2061b67d61835322855f4bde68a32c99dd7

  - it: hashes an empty level as baseline
    set:
      global.rbac.enabled: true
      global.rbac.podSecurityLevel: ""
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 60f02f133f24bfc5887b56ff66a8f9da69f1a48a28ac72f2a15319fe01ea39e3

  - it: keeps the checksum when prometheus is disabled
    set:
      global.prometheus.enabled: false
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]

  - it: keeps the prometheus annotations alongside the checksum
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: changes the checksum when the protected root CA Secret changes
    set:
      global.rbac.enabled: true
      global.rootCA.secretName: custom-ca
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 2eb81dbd563bd903be7f605dac2a257373926d338e5eb7733287594076959d1e

  - it: changes the checksum when the protected target kubeconfig Secret changes
    set:
      global.rbac.enabled: true
      global.targetCluster.secretName: custom-kubeconfig
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 3474dc290306c441ca5e2e43662fa7bf0bb8f5cfaf0018afcefb0d958f9340bf

  - it: changes the checksum when the control-plane namespace changes
    release:
      namespace: custom-radius
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 6585ed059c5f40d391bdabfa55f80d55832e3e616569bb8a93fb03d842a5a188

  - it: ignores protected Secret changes when authorization is off
    set:
      global.rootCA.secretName: custom-ca
      global.targetCluster.secretName: custom-kubeconfig
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467
