suite: test dedicated operator CA trust mounts
templates:
  - ucp/deployment.yaml
  - rp/deployment.yaml
  - dynamic-rp/deployment.yaml
  - controller/deployment.yaml
  - de/deployment.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: projects only UCP's leaf key and the dedicated public CA
    template: ucp/deployment.yaml
    set: &caSecretValues
      global.rbac.enabled: true
      global.rbac.certificates.mode: caSecret
      global.rbac.certificates.caSecret: operator-signing-ca
      global.rbac.certificates.caBundle: |
        -----BEGIN CERTIFICATE-----
        dGVzdA==
        -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: &ucpProjection
            name: mtls
            projected:
              sources:
                - secret:
                    name: ucp-mtls
                    items: &leafItems
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                - configMap: &caProjection
                    name: radius-mtls-ca
                    items:
                      - key: ca.crt
                        path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mtls
            mountPath: /var/run/radius/mtls
            readOnly: true

  - it: also projects explicit dedicated public trust for an external issuer
    template: ucp/deployment.yaml
    set:
      <<: *caSecretValues
      global.rbac.certificates.mode: issuerRef
      global.rbac.certificates.caSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: *ucpProjection

  - it: projects only Applications RP's leaf key and the dedicated public CA
    template: rp/deployment.yaml
    set: *caSecretValues
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mtls
            projected:
              sources:
                - secret:
                    name: applications-rp-mtls
                    items: *leafItems
                - configMap: *caProjection

  - it: projects only Dynamic RP's leaf key and the dedicated public CA in dryRun
    template: dynamic-rp/deployment.yaml
    set:
      <<: *caSecretValues
      global.rbac.enabled: false
      global.rbac.dryRun: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mtls
            projected:
              sources:
                - secret:
                    name: dynamic-rp-mtls
                    items: *leafItems
                - configMap: *caProjection

  - it: projects only the controller's leaf key and the dedicated public CA
    template: controller/deployment.yaml
    set: *caSecretValues
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mtls
            projected:
              sources:
                - secret:
                    name: controller-mtls
                    items: *leafItems
                - configMap: *caProjection

  - it: projects only the opted-in engine's leaf key and the dedicated public CA
    template: de/deployment.yaml
    set:
      <<: *caSecretValues
      de.ucpMTLS.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mtls
            projected:
              sources:
                - secret:
                    name: bicep-de-mtls
                    items: *leafItems
                - configMap: *caProjection

  - it: does not mount credentials in the legacy engine
    template: de/deployment.yaml
    set: *caSecretValues
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true

  - it: keeps Off behavior even with incomplete operator CA settings
    template: ucp/deployment.yaml
    set:
      global.rbac.certificates.mode: caSecret
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
