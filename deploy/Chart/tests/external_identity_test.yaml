suite: external component identity
templates:
  - global/external-identity.yaml
  - global/certificates.yaml
  - ucp/deployment.yaml
  - ucp/configmaps.yaml
  - ucp/apiservice.yaml
  - rp/deployment.yaml
  - rp/configmaps.yaml
  - controller/deployment.yaml
  - dynamic-rp/deployment.yaml
  - de/deployment.yaml
release:
  namespace: radius-system
  upgrade: true
kubernetesProvider:
  scheme:
    "apiregistration.k8s.io/v1/APIService":
      gvr:
        group: apiregistration.k8s.io
        version: v1
        resource: apiservices
      namespaced: false
  objects:
    - apiVersion: apiregistration.k8s.io/v1
      kind: APIService
      metadata:
        name: v1alpha3.api.ucp.dev
set:
  global.rbac.enabled: true
  global.rbac.mtls.provider: external
  de.externalIdentity.enabled: true
  de.image: local-engine
  de.tag: local-test
tests:
  - it: retains admission settings and both UCP rollout boundaries with external identity
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^authorization:\n  mode: "enforce"\n  podSecurityLevel: "baseline"\n  controlPlaneNamespace: "radius-system"\n  controlPlaneSecrets: \["database-secret","radius-encryption-key","radius-aws-fingerprint-key","ucp-cert","root-ca-cert","target-kubeconfig"\]\n  mtlsProvider: external\n  component: "applications-rp"\n  tokenDirectory: /var/run/radius/tokens\n  namespace: "radius-system"$'
        template: rp/configmaps.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'certificateDirectory:'
        template: rp/configmaps.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: d94bc8951227ac91ba80268c682d8b52dfc1b7abc5ba17ea78a4f9e1a585a025
        template: rp/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 965254db00ef5041c4f54dca431fc0cba6ba3db287941141f1504b30d58f9b9f
        template: ucp/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/caller-authentication"]
          value: 512514d4e251f3ac7c6a13ad371d2929e99c2120d056e705706ea4b7e3f9d243
        template: ucp/deployment.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'kubernetesCallerAuthentication:\n  kubernetesIssuer: "kubernetes:local"'
        template: ucp/configmaps.yaml
  - it: includes restricted admission policy in external dryRun rollout
    set:
      global.rbac.enabled: false
      global.rbac.dryRun: true
      global.rbac.podSecurityLevel: restricted
    asserts:
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'mode: "dryRun"\n  podSecurityLevel: "restricted"'
        template: rp/configmaps.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 21c5b31d6edda5fe4bbbe64ca9e862acff4813d3f39ed16de0b4fc869a1630a8
        template: rp/deployment.yaml
  - it: excludes dormant admission settings from the external Off rollout
    set:
      global.rbac.enabled: false
      global.rbac.podSecurityLevel: restricted
      global.rootCA.secretName: custom-ca
      global.targetCluster.secretName: custom-kubeconfig
    asserts:
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'authorization:|podSecurityLevel:|controlPlaneSecrets:'
        template: rp/configmaps.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: af5948c8f779604d10fbf57ed3b5899f2ec9bd966b5e5f3a494c661fa84dca1a
        template: rp/deployment.yaml
  - it: still rejects invalid pod security levels with dormant external identity
    set:
      global.rbac.enabled: false
      global.rbac.podSecurityLevel: privileged
    template: rp/configmaps.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'global.rbac.podSecurityLevel must be "baseline" or "restricted", got "privileged"'
  - it: projects only exact receiver tokens into the caller container
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
            projected:
              sources:
                - serviceAccountToken:
                    audience: applications-rp.radius-system.svc
                    expirationSeconds: 600
                    path: applications-rp
                - serviceAccountToken:
                    audience: dynamic-rp.radius-system.svc
                    expirationSeconds: 600
                    path: dynamic-rp
                - serviceAccountToken:
                    audience: bicep-de.radius-system.svc
                    expirationSeconds: 600
                    path: bicep-de
        template: ucp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
            projected:
              sources:
                - serviceAccountToken:
                    audience: ucp.radius-system.svc
                    expirationSeconds: 600
                    path: ucp
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
            projected:
              sources:
                - serviceAccountToken:
                    audience: ucp.radius-system.svc
                    expirationSeconds: 600
                    path: ucp
        template: controller/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
            projected:
              sources:
                - serviceAccountToken:
                    audience: ucp.radius-system.svc
                    expirationSeconds: 600
                    path: ucp
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
            projected:
              sources:
                - serviceAccountToken:
                    audience: ucp.radius-system.svc
                    expirationSeconds: 600
                    path: ucp
        template: de/deployment.yaml
  - it: keeps aggregation TLS and uses separate token-authenticated HTTP
    asserts:
      - hasDocuments:
          count: 3
        template: global/certificates.yaml
      - hasDocuments:
          count: 2
        template: ucp/apiservice.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'tlsCertificateDirectory: /var/tls/cert'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: 'mtlsProvider: external\n  component: "ucp"\n  tokenDirectory: /var/run/radius/tokens'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'endpoint: "http://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3"'
        template: rp/configmaps.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_INTERNAL_AUTH_UCP_TOKEN_FILE
            value: /var/run/radius/tokens/ucp
        template: de/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: http://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3
        template: de/deployment.yaml
  - it: grants only fixed offline discovery reads
    template: global/external-identity.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules
          value:
            - nonResourceURLs:
                - /.well-known/openid-configuration
                - /openid/v1/jwks
              verbs: ["get"]
  - it: preserves a dormant external provider in Off without tokens or internal routing
    set:
      global.rbac.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: global/external-identity.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
          any: true
        template: ucp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
          any: true
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
          any: true
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
          any: true
        template: controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: component-tokens
          any: true
        template: de/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: component-tokens
          any: true
        template: de/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: internal
          any: true
        template: ucp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_INTERNAL_AUTH_MODE
            value: "off"
        template: de/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.radius-system:443/apis/api.ucp.dev/v1alpha3
        template: de/deployment.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'kind: kubernetes'
        template: rp/configmaps.yaml
  - it: refuses the default unpaired engine
    set:
      de.externalIdentity.enabled: false
    template: global/external-identity.yaml
    asserts:
      - failedTemplate:
          errorMessage: external provider requires de.externalIdentity.enabled=true and an explicit de.image/de.tag for a paired token-capable engine; the published default image is not supported
  - it: supports independent CA Secret aggregation without component Certificates
    set:
      global.rbac.certificates.mode: caSecret
      global.rbac.certificates.caSecret: operator-ca
      global.rbac.certificates.caBundle: |
        -----BEGIN CERTIFICATE-----
        Y2E=
        -----END CERTIFICATE-----
    template: global/certificates.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: Issuer
        documentIndex: 1
      - equal:
          path: spec.ca.secretName
          value: operator-ca
        documentIndex: 1
  - it: rejects mixing managed engine TLS with external identity
    set:
      de.ucpMTLS.enabled: true
    template: global/external-identity.yaml
    asserts:
      - failedTemplate:
          errorMessage: external provider cannot use de.ucpMTLS.enabled
  - it: supports dry run without changing its authorization mode
    set:
      global.rbac.enabled: false
      global.rbac.dryRun: true
    template: de/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_INTERNAL_AUTH_MODE
            value: dryRun
