suite: test client connections to UCP
templates:
  - controller/deployment.yaml
  - controller/configmaps.yaml
  - rp/configmaps.yaml
  - dynamic-rp/configmaps.yaml
  - ucp/configmaps.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: connects to UCP through Kubernetes and mounts no controller CA bundle by default
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: radius-ca
          any: true
        template: controller/deployment.yaml
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: '(?m)^ucp:\n  kind: kubernetes$'
        template: controller/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^ucp:\n  kind: kubernetes$'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^ucp:\n  kind: kubernetes$'
        template: dynamic-rp/configmaps.yaml

  - it: connects to UCP's internal port in dryRun mode
    set:
      global.rbac.dryRun: true
    asserts: &direct
      # The controller serves no internal endpoint, so it mounts only the Radius CA bundle to
      # verify UCP's SPIFFE server certificate, never the CA private key.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: radius-ca
            secret:
              secretName: radius-ca
              items:
                - key: ca.crt
                  path: ca.crt
        template: controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: radius-ca
            mountPath: /var/run/radius/ca
            readOnly: true
        template: controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: controller/deployment.yaml
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: '(?m)^authorization:\n  mode: "\w+"\n  tlsProvider: "radius"\n  certificateDirectory: "/var/run/radius/spiffe"\n  caDirectory: "/var/run/radius/ca"\n  tokenDirectory: "/var/run/radius/tokens"\n  trustDomain: "radius.internal"\n  namespace: "radius-system"$'
        template: controller/configmaps.yaml
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: '(?m)^ucp:\n  kind: direct\n  direct:\n    endpoint: "https://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3"$'
        template: controller/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^ucp:\n  kind: direct\n  direct:\n    endpoint: "https://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3"$'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^ucp:\n  kind: direct\n  direct:\n    endpoint: "https://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3"$'
        template: dynamic-rp/configmaps.yaml
      # UCP's connection to itself is unchanged.
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: '(?m)^ucp:\n  kind: kubernetes$'
        template: ucp/configmaps.yaml

  - it: connects to UCP's internal port in enforce mode
    set:
      global.rbac.enabled: true
    asserts: *direct

  - it: uses the release namespace in the UCP endpoint
    release:
      namespace: radius-test
    set:
      global.rbac.enabled: true
    asserts:
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: 'endpoint: "https://ucp.radius-test.svc:9444/apis/api.ucp.dev/v1alpha3"'
        template: controller/configmaps.yaml
