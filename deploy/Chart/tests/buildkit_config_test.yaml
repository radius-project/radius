suite: test BuildKit configuration
templates:
  - dynamic-rp/buildkit-config.yaml
  - dynamic-rp/deployment.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: omits BuildKit configuration when the sidecar is disabled
    set:
      dynamicrp.buildkit.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: dynamic-rp/buildkit-config.yaml
      - notExists:
          path: spec.template.metadata.annotations["checksum/buildkit-config"]
        template: dynamic-rp/deployment.yaml

  - it: limits BuildKit to one parallel OCI worker step by default
    set:
      dynamicrp.buildkit.enabled: true
    asserts:
      - equal:
          path: data["buildkitd.toml"]
          value: |-
            [worker.oci]
              max-parallelism = 1
            # The in-cluster registry is reached over plain HTTP through the loopback
            # proxy in dynamic-rp.
            [registry."localhost:31500"]
              http = true
        template: dynamic-rp/buildkit-config.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/buildkit-config"]
          value: 9d5ddbbc07243abd33a9846eadd426ce6b795da33f35ff974ca868378bf833ad
        template: dynamic-rp/deployment.yaml
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - --config
            - /etc/radius/buildkit/buildkitd.toml
            - --addr
            - tcp://127.0.0.1:1234
            - --oci-worker-no-process-sandbox
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: buildkit-config
            mountPath: /etc/radius/buildkit
            readOnly: true
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: buildkit-config
            configMap:
              name: dynamic-rp-buildkit-config
        template: dynamic-rp/deployment.yaml

  - it: omits local build contexts when no claim is configured
    set:
      dynamicrp.buildkit.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: local-build-contexts
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: local-build-contexts
        template: dynamic-rp/deployment.yaml

  - it: mounts operator-provided local build contexts read-only
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.localContexts.existingClaim: build-contexts
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: local-build-contexts
            mountPath: /var/radius/build-contexts
            readOnly: true
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: local-build-contexts
            persistentVolumeClaim:
              claimName: build-contexts
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: local-build-contexts
        template: dynamic-rp/deployment.yaml

  - it: ignores the local context claim when BuildKit is disabled
    set:
      dynamicrp.buildkit.localContexts.existingClaim: build-contexts
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: local-build-contexts
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: local-build-contexts
        template: dynamic-rp/deployment.yaml

  - it: renders an operator-provided parallelism limit
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 3
    asserts:
      - equal:
          path: data["buildkitd.toml"]
          value: |-
            [worker.oci]
              max-parallelism = 3
            # The in-cluster registry is reached over plain HTTP through the loopback
            # proxy in dynamic-rp.
            [registry."localhost:31500"]
              http = true
        template: dynamic-rp/buildkit-config.yaml
      - equal:
          path: spec.template.metadata.annotations["checksum/buildkit-config"]
          value: 84f0784249ce8527e4c0d097da0604d5a2aaec59479028b25429baf6674a155d
        template: dynamic-rp/deployment.yaml

  - it: rejects zero parallelism because BuildKit treats zero as unlimited
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 0
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: rejects negative parallelism
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: -1
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: rejects fractional parallelism
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 1.5
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: rejects string parallelism instead of coercing it
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: "1"
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: accepts the maximum portable integer value
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 2147483647
    asserts:
      - equal:
          path: data["buildkitd.toml"]
          value: |-
            [worker.oci]
              max-parallelism = 2147483647
            # The in-cluster registry is reached over plain HTTP through the loopback
            # proxy in dynamic-rp.
            [registry."localhost:31500"]
              http = true
        template: dynamic-rp/buildkit-config.yaml

  - it: rejects a value immediately above the portable integer range
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 2147483648
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: rejects values outside the portable integer range before conversion
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 9223372036854775808
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: rejects large fractional values before conversion
    set:
      dynamicrp.buildkit.enabled: true
      dynamicrp.buildkit.maxParallelism: 2147483646.5
    asserts:
      - failedTemplate:
          errorMessage: dynamicrp.buildkit.maxParallelism must be an integer between 1 and 2147483647
        template: dynamic-rp/deployment.yaml

  - it: omits the plain-HTTP registry entry when the in-cluster registry is disabled
    set:
      dynamicrp.buildkit.registry.enabled: false
    asserts:
      - equal:
          path: data["buildkitd.toml"]
          value: |-
            [worker.oci]
              max-parallelism = 1
        template: dynamic-rp/buildkit-config.yaml

  - it: uses the configured registry NodePort for the plain-HTTP registry entry
    set:
      dynamicrp.buildkit.registry.nodePort: 32000
    asserts:
      - matchRegex:
          path: data["buildkitd.toml"]
          pattern: '\[registry\."localhost:32000"\]\n\s+http = true'
        template: dynamic-rp/buildkit-config.yaml
