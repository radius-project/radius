suite: test authorization config checksum annotations
templates:
  - ucp/deployment.yaml
  - dynamic-rp/deployment.yaml
  - controller/deployment.yaml
release:
  name: radius
  namespace: radius-system
tests:
  # The checksum restarts pods when helm upgrade changes the authorization settings,
  # because services read them only at startup.
  - it: hashes the off mode by default
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: hashes the off mode when global.rbac is missing
    set:
      global.rbac: null
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: hashes the dryRun mode
    set:
      global.rbac.dryRun: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 024341e48a4b4c462f89d96ce9da94db066067e56c66a3f4c2a3c645349cbe5c

  - it: hashes the enforce mode
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: 746a456cff3676346ddc26f2cd59138cdf5ab59ba9ae03b2ee28d38278e0cc2b

  - it: changes the checksum when the trust domain changes
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.trustDomain: example.org
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: a35e5b152dae4add2a235a2beb0aac234a73e0d0f9d4b7f4811cf8df2e12a72c

  - it: changes the checksum when the CSI driver name changes
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.csiDriverName: spiffe.example.org
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: f5334951ca6275bce94912cc59621f721db658b2b5329a6a53fdd73e4ac65671

  - it: ignores the trust domain when authorization is off
    set:
      global.rbac.spiffe.trustDomain: example.org
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467

  - it: annotates the pod template when prometheus and buildkit are disabled
    set:
      global.prometheus.enabled: false
      dynamicrp.buildkit.enabled: false
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/authz-config"]
          value: b4dc66dde806261bdda8607d8707aa727d308cd80272381a5583f63899918467
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]

  - it: keeps the prometheus annotations alongside the checksum
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
