suite: test terraform init container path mismatch fix
templates:
  - rp/deployment.yaml
  - rp/configmaps.yaml
  - dynamic-rp/deployment.yaml
  - dynamic-rp/configmaps.yaml
tests:
  # By default Terraform is downloaded in-process in the background (terraform.preDownload)
  # rather than in an init container, so pods do not wait on the download to start.
  - it: rp downloads terraform in-process by default
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: rp/deployment.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload: true'
        template: rp/configmaps.yaml

  - it: dynamic-rp downloads terraform in-process by default
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: dynamic-rp/deployment.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload: true'
        template: dynamic-rp/configmaps.yaml

  - it: uses the init container instead of in-process download when downloadUrl is set
    set:
      global.terraform.downloadUrl: "https://example.com/terraform.zip"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'TERRAFORM_URL="https://example\.com/terraform\.zip"'
        template: rp/deployment.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'TERRAFORM_URL="https://example\.com/terraform\.zip"'
        template: dynamic-rp/deployment.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: rp/configmaps.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: dynamic-rp/configmaps.yaml

  - it: uses the init container instead of in-process download when useInitContainer is set
    set:
      global.terraform.useInitContainer: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
        template: rp/deployment.yaml
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
        template: dynamic-rp/deployment.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: rp/configmaps.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: dynamic-rp/configmaps.yaml

  - it: does not pre-download terraform when disabled
    set:
      global.terraform.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: rp/deployment.yaml
      - notExists:
          path: spec.template.spec.initContainers
        template: dynamic-rp/deployment.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: rp/configmaps.yaml
      - notMatchRegex:
          path: data["radius-self-host.yaml"]
          pattern: 'preDownload'
        template: dynamic-rp/configmaps.yaml

  # Regression test for https://github.com/radius-project/radius/pull/11880
  # The pre-mounted Terraform binary path written by the init container MUST
  # match the constants in pkg/recipes/terraform/install.go:
  #   defaultGlobalTerraformBinary = "/terraform/.terraform-global/terraform"
  #   defaultGlobalMarkerFile      = "/terraform/.terraform-global/.terraform-ready"
  # If these strings drift, ensureGlobalTerraformBinary falls through to
  # downloadAndInstallTerraform and the init container's work is wasted.
  - it: rp init container writes terraform binary to the global path expected by install.go
    set:
      global.terraform.useInitContainer: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'GLOBAL_DIR="/terraform/\.terraform-global"'
        template: rp/deployment.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'cp terraform "\$GLOBAL_DIR/terraform"'
        template: rp/deployment.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'touch "\$GLOBAL_DIR/\.terraform-ready"'
        template: rp/deployment.yaml

  - it: dynamic-rp init container writes terraform binary to the global path expected by install.go
    set:
      global.terraform.useInitContainer: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'GLOBAL_DIR="/terraform/\.terraform-global"'
        template: dynamic-rp/deployment.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'cp terraform "\$GLOBAL_DIR/terraform"'
        template: dynamic-rp/deployment.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'touch "\$GLOBAL_DIR/\.terraform-ready"'
        template: dynamic-rp/deployment.yaml

  - it: rp template fails when rp.terraform.path is overridden away from /terraform
    set:
      rp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'rp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: rp/deployment.yaml

  - it: dynamic-rp template fails when dynamicrp.terraform.path is overridden away from /terraform
    set:
      dynamicrp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'dynamicrp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/dynamic-rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: dynamic-rp/deployment.yaml

  - it: rp template still fails when rp.terraform.path is overridden, even with terraform pre-download disabled
    set:
      global.terraform.enabled: false
      rp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'rp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: rp/deployment.yaml

  - it: dynamic-rp template still fails when dynamicrp.terraform.path is overridden, even with terraform pre-download disabled
    set:
      global.terraform.enabled: false
      dynamicrp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'dynamicrp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/dynamic-rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: dynamic-rp/deployment.yaml

  # Regression test for the second half of #11880: the init container must
  # install the same version the runtime falls back to, or recipes behave
  # differently between cold and warm starts. The literal below is arbitrary
  # -- these cases only prove the chart value reaches the command. Drift
  # between values.yaml and pkg/recipes/terraform/version.go is covered by
  # TestTerraformVersionMatchesHelmChart, so keeping the pinned version out
  # of here lets the tool updater bump Terraform without editing this file.
  - it: rp init container installs the version from global.terraform.version
    set:
      global.terraform.useInitContainer: true
      global.terraform.version: "9.9.9"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'TERRAFORM_VERSION="9\.9\.9"'
        template: rp/deployment.yaml

  - it: dynamic-rp init container installs the version from global.terraform.version
    set:
      global.terraform.useInitContainer: true
      global.terraform.version: "9.9.9"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].command[2]
          pattern: 'TERRAFORM_VERSION="9\.9\.9"'
        template: dynamic-rp/deployment.yaml
