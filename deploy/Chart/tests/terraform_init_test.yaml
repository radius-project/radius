suite: test terraform init container
templates:
  - rp/deployment.yaml
  - rp/configmaps.yaml
  - dynamic-rp/deployment.yaml
  - dynamic-rp/configmaps.yaml
tests:
  # Terraform is downloaded by the dedicated terraform-init image in an init container, so the
  # download stays out of the resource provider containers and a failure blocks the pod.
  - it: downloads the pinned terraform release with the terraform-init image by default
    set:
      global.terraform.version: "9.9.9"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --version=9.9.9
            # Must match the global path in pkg/recipes/terraform/install.go.
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: terraform-init-tmp
            mountPath: /tmp
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].securityContext.readOnlyRootFilesystem
          value: true
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].securityContext.capabilities.drop
          value: [ALL]
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: terraform-init-tmp
            emptyDir:
              sizeLimit: 256Mi
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_VERSION
            value: "9.9.9"
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_PREMOUNTED_ONLY
            value: "true"
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: dynamic-rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --version=9.9.9
            # Must match the global path in pkg/recipes/terraform/install.go.
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: terraform-init-tmp
            mountPath: /tmp
        template: dynamic-rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].securityContext.readOnlyRootFilesystem
          value: true
        template: dynamic-rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].securityContext.capabilities.drop
          value: [ALL]
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: terraform-init-tmp
            emptyDir:
              sizeLimit: 256Mi
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_VERSION
            value: "9.9.9"
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_PREMOUNTED_ONLY
            value: "true"
        template: dynamic-rp/deployment.yaml

  - it: downloads from downloadUrl with the terraform-init image and disables the runtime download fallback
    set:
      global.terraform.downloadUrl: "https://example.com/terraform.zip"
      global.terraform.downloadChecksum: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --url=https://example.com/terraform.zip
            - --sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: terraform-init-tmp
            emptyDir:
              sizeLimit: 256Mi
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_PREMOUNTED_ONLY
            value: "true"
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_VERSION
            value: "1.16.5"
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: dynamic-rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --url=https://example.com/terraform.zip
            - --sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: terraform-init-tmp
            emptyDir:
              sizeLimit: 256Mi
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_PREMOUNTED_ONLY
            value: "true"
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_VERSION
            value: "1.16.5"
        template: dynamic-rp/deployment.yaml

  - it: omits the checksum argument when downloadChecksum is not set
    set:
      global.terraform.downloadUrl: "https://example.com/terraform.zip"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --url=https://example.com/terraform.zip
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].args
          value:
            - --url=https://example.com/terraform.zip
            - --dir=/terraform/.terraform-global
            - --legacy-dir=/terraform
        template: dynamic-rp/deployment.yaml

  - it: trusts the custom root CA for the terraform download
    set:
      global.rootCA.cert: "FAKECERT"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].env
          content:
            name: SSL_CERT_DIR
            value: /tmp/sslcerts
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: root-ca-vol
            mountPath: /tmp/sslcerts
            readOnly: true
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].env
          content:
            name: SSL_CERT_DIR
            value: /tmp/sslcerts
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: root-ca-vol
            mountPath: /tmp/sslcerts
            readOnly: true
        template: dynamic-rp/deployment.yaml

  - it: uses the appended CA bundle for the terraform download
    set:
      global.appendRootCA.cert: "FAKECERT"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: append-root-ca
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: ssl-certs
            mountPath: /etc/ssl/certs
            readOnly: true
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: append-root-ca
        template: dynamic-rp/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].volumeMounts
          content:
            name: ssl-certs
            mountPath: /etc/ssl/certs
            readOnly: true
        template: dynamic-rp/deployment.yaml

  # CI and custom builds set rp.image to a private registry, so the terraform-init image follows it.
  - it: derives the terraform-init image from rp.image and rp.tag
    set:
      rp.image: localhost:5000/applications-rp
      rp.tag: dev
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: localhost:5000/terraform-init:dev
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: localhost:5000/terraform-init:dev
        template: dynamic-rp/deployment.yaml

  - it: uses a tag embedded in rp.image
    set:
      rp.image: example.com/radius/applications-rp:pr-123
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: example.com/radius/terraform-init:pr-123
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: example.com/radius/terraform-init:pr-123
        template: dynamic-rp/deployment.yaml

  - it: uses global.imageRegistry and global.imageTag
    set:
      global.imageRegistry: myregistry.azurecr.io
      global.imageTag: "0.99"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: myregistry.azurecr.io/terraform-init:0.99
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: myregistry.azurecr.io/terraform-init:0.99
        template: dynamic-rp/deployment.yaml

  - it: honors an explicit terraform-init image override
    set:
      rp.image: localhost:5000/applications-rp
      global.terraform.image: example.com/mirror/terraform-init
      global.terraform.tag: pinned
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: example.com/mirror/terraform-init:pinned
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: example.com/mirror/terraform-init:pinned
        template: dynamic-rp/deployment.yaml

  # The pre-upgrade and readiness images may be pinned to an older version that cannot download
  # Terraform, so their overrides must not change the terraform-init image.
  - it: ignores the preupgrade and controlPlaneReadiness image overrides
    set:
      preupgrade.image: example.com/pre-upgrade
      preupgrade.tag: old
      controlPlaneReadiness.image: example.com/readiness
      controlPlaneReadiness.tag: old
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: rp/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='terraform-init')].image
          value: ghcr.io/radius-project/terraform-init:edge
        template: dynamic-rp/deployment.yaml

  # Rendering stops at the first failing template, so this is asserted once on rp.
  - it: fails when the terraform version is empty and downloadUrl is not set
    set:
      global.terraform.version: ""
    asserts:
      - failedTemplate:
          errorMessage: global.terraform.version is required when global.terraform.downloadUrl is empty
        template: rp/deployment.yaml

  - it: does not pre-download terraform when disabled
    set:
      global.terraform.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: rp/deployment.yaml
      - notExists:
          path: spec.template.spec.initContainers
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_TERRAFORM_VERSION
            value: "1.16.5"
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: terraform-init-tmp
            emptyDir:
              sizeLimit: 256Mi
        template: rp/deployment.yaml

  - it: rp template fails when rp.terraform.path is overridden away from /terraform
    set:
      rp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'rp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: rp/deployment.yaml

  - it: dynamic-rp template fails when dynamicrp.terraform.path is overridden away from /terraform
    set:
      dynamicrp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'dynamicrp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/dynamic-rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: dynamic-rp/deployment.yaml

  - it: rp template still fails when rp.terraform.path is overridden, even with terraform pre-download disabled
    set:
      global.terraform.enabled: false
      rp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'rp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: rp/deployment.yaml

  - it: dynamic-rp template still fails when dynamicrp.terraform.path is overridden, even with terraform pre-download disabled
    set:
      global.terraform.enabled: false
      dynamicrp.terraform.path: "/other"
    asserts:
      - failedTemplate:
          errorMessage: 'dynamicrp.terraform.path must be "/terraform" -- the runtime configmap (deploy/Chart/templates/dynamic-rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching.'
        template: dynamic-rp/deployment.yaml

