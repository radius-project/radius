suite: test service certificates
templates:
  - global/certificates.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: renders nothing when authorization is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when global.rbac is missing
    set:
      global.rbac: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the CA, issuers, and service certificates in dry run
    set:
      global.rbac.dryRun: true
    asserts:
      - hasDocuments:
          count: 8

  - it: renders the self-signed bootstrap issuer and Radius CA
    set:
      global.rbac.enabled: true
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.name
          value: radius-selfsigned-bootstrap
        documentIndex: 0
      - equal:
          path: spec.selfSigned
          value: {}
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.name
          value: radius-ca
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: radius-ca
        documentIndex: 1
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Never
        documentIndex: 1
      - equal:
          path: spec.issuerRef.name
          value: radius-selfsigned-bootstrap
        documentIndex: 1
      - isKind:
          of: Issuer
        documentIndex: 2
      - equal:
          path: metadata.name
          value: radius-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: radius-ca
        documentIndex: 2

  - it: renders a ucp certificate
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: ucp-cert
    asserts: &serviceCert
      - isKind:
          of: Certificate
      - equal:
          path: spec.duration
          value: 24h
      - equal:
          path: spec.renewBefore
          value: 8h
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
      - equal:
          path: spec.usages
          value:
            - digital signature
            - server auth
            - client auth
      - equal:
          path: spec.issuerRef
          value:
            group: cert-manager.io
            kind: Issuer
            name: radius-ca-issuer
      - notExists:
          path: spec.commonName

  - it: sets ucp secret and SANs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: ucp-cert
    asserts:
      - equal:
          path: spec.secretName
          value: ucp-mtls
      - equal:
          path: spec.dnsNames
          value: [ucp.radius-system.svc]

  - it: renders an applications-rp certificate
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: applications-rp-cert
    asserts: *serviceCert

  - it: sets applications-rp secret and SANs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: applications-rp-cert
    asserts:
      - equal:
          path: spec.secretName
          value: applications-rp-mtls
      - equal:
          path: spec.dnsNames
          value: [applications-rp.radius-system.svc]

  - it: renders a dynamic-rp certificate
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: dynamic-rp-cert
    asserts: *serviceCert

  - it: sets dynamic-rp secret and SANs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: dynamic-rp-cert
    asserts:
      - equal:
          path: spec.secretName
          value: dynamic-rp-mtls
      - equal:
          path: spec.dnsNames
          value: [dynamic-rp.radius-system.svc]

  - it: renders a controller certificate
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: controller-cert
    asserts: *serviceCert

  - it: sets controller secret and SANs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: controller-cert
    asserts:
      - equal:
          path: spec.secretName
          value: controller-mtls
      - equal:
          path: spec.dnsNames
          value: [controller.radius-system.svc]

  - it: renders a bicep-de certificate
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: bicep-de-cert
    asserts: *serviceCert

  - it: sets bicep-de secret and SANs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: bicep-de-cert
    asserts:
      - equal:
          path: spec.secretName
          value: bicep-de-mtls
      - equal:
          path: spec.dnsNames
          value: [bicep-de.radius-system.svc]

  - it: uses the release namespace in SANs
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: ucp-cert
    asserts:
      - equal:
          path: spec.dnsNames
          value: [ucp.custom-ns.svc]

  - it: gives the engine its own identity in the release namespace
    release:
      namespace: radius-test
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
    documentSelector:
      path: metadata.name
      value: bicep-de-cert
    asserts:
      - equal:
          path: metadata.namespace
          value: radius-test
      - equal:
          path: spec.secretName
          value: bicep-de-mtls
      - equal:
          path: spec.dnsNames
          value: [bicep-de.radius-test.svc]
      - equal:
          path: spec.issuerRef.name
          value: radius-ca-issuer

  - it: uses an operator CA without creating or owning its Secret or a bootstrap CA
    set: &caSecretValues
      global.rbac.enabled: true
      global.rbac.certificates.mode: caSecret
      global.rbac.certificates.caSecret: operator-signing-ca
      # Synthetic PEM body: rendering validates shape, not X.509 or signing-key matches.
      global.rbac.certificates.caBundle: |
        -----BEGIN CERTIFICATE-----
        dGVzdA==
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.name
          value: radius-mtls-ca
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 0
      - equal:
          path: data["ca.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            dGVzdA==
            -----END CERTIFICATE-----
        documentIndex: 0
      - isKind:
          of: Issuer
        documentIndex: 1
      - equal:
          path: spec.ca.secretName
          value: operator-signing-ca
        documentIndex: 1
      - isKind:
          of: Certificate
        documentIndex: 2
      - isKind:
          of: Certificate
        documentIndex: 3
      - isKind:
          of: Certificate
        documentIndex: 4
      - isKind:
          of: Certificate
        documentIndex: 5
      - isKind:
          of: Certificate
        documentIndex: 6
      - notExists:
          path: metadata.ownerReferences

  - it: preserves the leaf certificate contract with an operator CA
    set: *caSecretValues
    documentSelector:
      path: metadata.name
      value: ucp-cert
    asserts: *serviceCert

  - it: uses an operator CA in dryRun and a custom namespace
    release:
      namespace: custom-ns
    set:
      <<: *caSecretValues
      global.rbac.enabled: false
      global.rbac.dryRun: true
    documentSelector:
      path: metadata.name
      value: bicep-de-cert
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
      - equal:
          path: spec.dnsNames
          value: [bicep-de.custom-ns.svc]

  - it: fails when the signing Secret name is absent
    set:
      <<: *caSecretValues
      global.rbac.certificates.caSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace."

  - it: fails when the signing Secret name is not a string
    set:
      <<: *caSecretValues
      global.rbac.certificates.caSecret: true
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace."

  - it: fails when the signing Secret name is invalid
    set:
      <<: *caSecretValues
      global.rbac.certificates.caSecret: other/namespace
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace."

  - it: rejects the chart-managed CA Secret
    set:
      <<: *caSecretValues
      global.rbac.certificates.caSecret: radius-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret must not name a Radius-managed certificate Secret. Use a separate operator-owned signing Secret."

  - it: rejects a component private-key Secret as the signing Secret
    set:
      <<: *caSecretValues
      global.rbac.certificates.caSecret: ucp-mtls
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret must not name a Radius-managed certificate Secret. Use a separate operator-owned signing Secret."

  - it: requires explicit dedicated CA trust rather than using a leaf's organization chain
    set:
      <<: *caSecretValues
      global.rbac.certificates.caBundle: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: rejects a non-string trust bundle
    set:
      <<: *caSecretValues
      global.rbac.certificates.caBundle: true
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: rejects an organization chain in the trust bundle
    set:
      <<: *caSecretValues
      global.rbac.certificates.caBundle: |
        -----BEGIN CERTIFICATE-----
        dGVzdA==
        -----END CERTIFICATE-----
        -----BEGIN CERTIFICATE-----
        cm9vdA==
        -----END CERTIFICATE-----
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: rejects private keys in the public trust value
    set:
      <<: *caSecretValues
      global.rbac.certificates.caBundle: |
        -----BEGIN PRIVATE KEY-----
        dGVzdA==
        -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: rejects a certificate followed by a private key
    set:
      <<: *caSecretValues
      global.rbac.certificates.caBundle: |
        -----BEGIN CERTIFICATE-----
        dGVzdA==
        -----END CERTIFICATE-----
        -----BEGIN PRIVATE KEY-----
        dGVzdA==
        -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: rejects caSecret settings in selfSigned mode
    set:
      <<: *caSecretValues
      global.rbac.certificates.mode: selfSigned
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caSecret and caBundle require mode=caSecret."

  - it: fails closed for issuerRef until policy preflight is implemented
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: issuerRef
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=issuerRef requires verified certificate request policy protection: a running approver-policy controller, disabled default auto-approval, and an effective identity- and issuer-scoped policy. Install/upgrade preflight enforcement is not available yet; issuerRef remains disabled. Use selfSigned or caSecret."

  - it: does not accept a boolean assertion of issuer policy protection
    set:
      global.rbac.dryRun: true
      global.rbac.certificates.mode: issuerRef
      global.rbac.certificates.approverPolicyInstalled: true
      global.rbac.certificates.issuerRef.name: external-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=issuerRef requires verified certificate request policy protection: a running approver-policy controller, disabled default auto-approval, and an effective identity- and issuer-scoped policy. Install/upgrade preflight enforcement is not available yet; issuerRef remains disabled. Use selfSigned or caSecret."

  - it: fails for an unknown mode
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: bogus
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"bogus\" is not valid. Use selfSigned or caSecret."

  - it: fails for a false mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: false
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"false\" is not valid. Use selfSigned or caSecret."

  - it: fails for a zero mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: 0
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"0\" is not valid. Use selfSigned or caSecret."

  - it: fails for an empty mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"\" is not valid. Use selfSigned or caSecret."

  - it: ignores the certificate mode when authorization is off
    set:
      global.rbac.certificates.mode: caSecret
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores issuer policy prerequisites when authorization is off
    set:
      global.rbac.certificates.mode: issuerRef
    asserts:
      - hasDocuments:
          count: 0
