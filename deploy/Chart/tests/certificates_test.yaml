suite: test service certificates
templates:
  - global/certificates.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: renders nothing when authorization is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when global.rbac is missing
    set:
      global.rbac: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the CAs and issuers in dry run
    set:
      global.rbac.dryRun: true
    asserts:
      - hasDocuments:
          count: 5

  - it: renders the self-signed bootstrap issuer and Radius CA
    set:
      global.rbac.enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.name
          value: radius-selfsigned-bootstrap
        documentIndex: 0
      - equal:
          path: spec.selfSigned
          value: {}
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.name
          value: radius-ca
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: radius-ca
        documentIndex: 1
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Never
        documentIndex: 1
      - equal:
          path: spec.issuerRef.name
          value: radius-selfsigned-bootstrap
        documentIndex: 1
      - isKind:
          of: Issuer
        documentIndex: 2
      - equal:
          path: metadata.name
          value: radius-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: radius-ca
        documentIndex: 2

  - it: renders a separate API server CA and issuer
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: Certificate
        documentIndex: 3
      - equal:
          path: metadata.name
          value: radius-apiserver-ca
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 3
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: radius-apiserver-ca
        documentIndex: 3
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Never
        documentIndex: 3
      - equal:
          path: spec.secretTemplate.annotations
          value:
            cert-manager.io/allow-direct-injection: "true"
        documentIndex: 3
      - equal:
          path: spec.issuerRef
          value:
            group: cert-manager.io
            kind: Issuer
            name: radius-selfsigned-bootstrap
        documentIndex: 3
      - isKind:
          of: Issuer
        documentIndex: 4
      - equal:
          path: metadata.name
          value: radius-apiserver-issuer
        documentIndex: 4
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 4
      - equal:
          path: spec.ca.secretName
          value: radius-apiserver-ca
        documentIndex: 4

  - it: uses the release namespace for the API server CA and issuer
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 4

  - it: renders no per-component client certificates
    set:
      global.rbac.enabled: true
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: '-cert$'
      - notMatchRegex:
          path: spec.secretName
          pattern: '-mtls$'

  - it: gives the engine its own identity in the release namespace
    release:
      namespace: radius-test
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
    documentSelector:
      path: metadata.name
      value: bicep-de-cert
    asserts:
      - equal:
          path: metadata.namespace
          value: radius-test
      - equal:
          path: spec.secretName
          value: bicep-de-mtls
      - equal:
          path: spec.dnsNames
          value: [bicep-de.radius-test.svc]
      - equal:
          path: spec.issuerRef.name
          value: radius-ca-issuer

  - it: fails for caSecret mode
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: caSecret
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=caSecret is not supported yet. Use selfSigned."

  - it: fails for issuerRef mode
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: issuerRef
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=issuerRef is not supported yet. Use selfSigned."

  - it: fails for an unknown mode
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: bogus
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"bogus\" is not valid. Use selfSigned."

  - it: fails for a false mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: false
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"false\" is not valid. Use selfSigned."

  - it: fails for a zero mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: 0
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"0\" is not valid. Use selfSigned."

  - it: fails for an empty mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"\" is not valid. Use selfSigned."

  - it: ignores the certificate mode when authorization is off
    set:
      global.rbac.certificates.mode: caSecret
    asserts:
      - hasDocuments:
          count: 0
