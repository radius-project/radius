suite: test service certificates
templates:
  - global/certificates.yaml
release:
  name: radius
  namespace: radius-system
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
tests:
  - it: renders nothing when authorization is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when global.rbac is missing
    set:
      global.rbac: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the CAs, issuers, and SPIFFE server certificates in dry run
    set:
      global.rbac.dryRun: true
    asserts:
      - hasDocuments:
          count: 8

  - it: omits the component CA and issuer but retains aggregation issuers for external dryRun
    set:
      global.rbac.dryRun: true
      global.rbac.tls.provider: external
    asserts: &externalCAs
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: radius-selfsigned-bootstrap
        documentIndex: 0
      - equal:
          path: spec.selfSigned
          value: {}
        documentIndex: 0
      - equal:
          path: metadata.name
          value: radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.issuerRef.name
          value: radius-selfsigned-bootstrap
        documentIndex: 1
      - equal:
          path: metadata.name
          value: radius-apiserver-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: radius-apiserver-ca
        documentIndex: 2

  - it: retains only aggregation CAs and issuers for external enforce
    set:
      global.rbac.enabled: true
      global.rbac.tls.provider: external
    asserts: *externalCAs

  - it: renders the self-signed bootstrap issuer and Radius CA
    set:
      global.rbac.enabled: true
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.name
          value: radius-selfsigned-bootstrap
        documentIndex: 0
      - equal:
          path: spec.selfSigned
          value: {}
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.name
          value: radius-ca
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: radius-ca
        documentIndex: 1
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Never
        documentIndex: 1
      - equal:
          path: spec.issuerRef.name
          value: radius-selfsigned-bootstrap
        documentIndex: 1
      - isKind:
          of: Issuer
        documentIndex: 2
      - equal:
          path: metadata.name
          value: radius-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: radius-ca
        documentIndex: 2

  - it: renders a separate API server CA and issuer
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: Certificate
        documentIndex: 6
      - equal:
          path: metadata.name
          value: radius-apiserver-ca
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 6
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 6
      - equal:
          path: spec.secretName
          value: radius-apiserver-ca
        documentIndex: 6
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Never
        documentIndex: 6
      - equal:
          path: spec.secretTemplate.annotations
          value:
            cert-manager.io/allow-direct-injection: "true"
        documentIndex: 6
      - equal:
          path: spec.issuerRef
          value:
            group: cert-manager.io
            kind: Issuer
            name: radius-selfsigned-bootstrap
        documentIndex: 6
      - isKind:
          of: Issuer
        documentIndex: 7
      - equal:
          path: metadata.name
          value: radius-apiserver-issuer
        documentIndex: 7
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 7
      - equal:
          path: spec.ca.secretName
          value: radius-apiserver-ca
        documentIndex: 7

  - it: uses the release namespace for the API server CA and issuer
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 7

  - it: renders no per-component client certificates
    set:
      global.rbac.enabled: true
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: '-cert$'
      - notMatchRegex:
          path: spec.secretName
          pattern: '-mtls$'

  - it: fails for caSecret without explicit public trust
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: caSecret
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: fails for issuerRef without explicit public trust
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: issuerRef
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain."

  - it: fails for an unknown mode
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: bogus
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"bogus\" is not valid. Use selfSigned, caSecret or issuerRef."

  - it: renders a SPIFFE server certificate for each receiver
    set:
      global.rbac.enabled: true
    asserts:
      - containsDocument:
          kind: Certificate
          apiVersion: cert-manager.io/v1
          name: ucp-spiffe
          namespace: radius-system
          any: true
      - containsDocument:
          kind: Certificate
          apiVersion: cert-manager.io/v1
          name: applications-rp-spiffe
          namespace: radius-system
          any: true
      - containsDocument:
          kind: Certificate
          apiVersion: cert-manager.io/v1
          name: dynamic-rp-spiffe
          namespace: radius-system
          any: true

  - it: issues the ucp SPIFFE server certificate with only its SPIFFE ID and server auth
    set:
      global.rbac.enabled: true
    documentSelector:
      path: metadata.name
      value: ucp-spiffe
    asserts:
      - equal:
          path: spec
          value:
            secretName: ucp-spiffe
            duration: 24h
            renewBefore: 8h
            privateKey:
              algorithm: ECDSA
              size: 256
              rotationPolicy: Always
            usages:
              - digital signature
              - server auth
            uris:
              - spiffe://radius.internal/ns/radius-system/sa/ucp
            issuerRef:
              group: cert-manager.io
              kind: Issuer
              name: radius-ca-issuer

  - it: uses the receiver's ServiceAccount and the configured trust domain in the SPIFFE ID
    set:
      global.rbac.dryRun: true
      global.rbac.spiffe.trustDomain: example.org
    documentSelector:
      path: metadata.name
      value: dynamic-rp-spiffe
    asserts:
      - equal:
          path: spec.uris
          value: [spiffe://example.org/ns/radius-system/sa/dynamic-rp]
      - equal:
          path: spec.secretName
          value: dynamic-rp-spiffe
      - notExists:
          path: spec.dnsNames

  - it: fails for a trust domain with a path segment
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.trustDomain: example.org/team
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.spiffe.trustDomain must be a SPIFFE trust domain name (lowercase letters, digits, '.', '-', '_'; at most 255 characters), got \"example.org/team\""

  - it: fails for a trust domain with uppercase letters or a scheme in dryRun
    set:
      global.rbac.dryRun: true
      global.rbac.spiffe.trustDomain: spiffe://Example.org
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.spiffe.trustDomain must be a SPIFFE trust domain name (lowercase letters, digits, '.', '-', '_'; at most 255 characters), got \"spiffe://Example.org\""

  - it: fails for a trust domain longer than 255 characters
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.trustDomain: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate: {}

  - it: fails for an explicitly empty trust domain instead of using the default
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.trustDomain: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.spiffe.trustDomain must be a SPIFFE trust domain name (lowercase letters, digits, '.', '-', '_'; at most 255 characters), got \"\""

  - it: fails for a numeric trust domain in dryRun
    set:
      global.rbac.dryRun: true
      global.rbac.spiffe.trustDomain: 42
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.spiffe.trustDomain must be a string, got float64"

  - it: fails for a false trust domain instead of using the default
    set:
      global.rbac.enabled: true
      global.rbac.spiffe.trustDomain: false
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.spiffe.trustDomain must be a string, got bool"

  - it: does not validate the trust domain when the mode is off
    set:
      global.rbac.spiffe.trustDomain: example.org/team
    asserts:
      - notFailedTemplate: {}

  - it: issues no certificate to the bootstrap issuer except the two CAs
    set:
      global.rbac.enabled: true
    documentSelector:
      path: spec.issuerRef.name
      value: radius-selfsigned-bootstrap
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^radius-(apiserver-)?ca$

  - it: fails for a false mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: false
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"false\" is not valid. Use selfSigned, caSecret or issuerRef."

  - it: fails for a zero mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: 0
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"0\" is not valid. Use selfSigned, caSecret or issuerRef."

  - it: fails for an empty mode instead of defaulting
    set:
      global.rbac.enabled: true
      global.rbac.certificates.mode: ""
    asserts:
      - failedTemplate:
          errorMessage: "global.rbac.certificates.mode=\"\" is not valid. Use selfSigned, caSecret or issuerRef."

  - it: ignores the certificate mode when authorization is off
    set:
      global.rbac.certificates.mode: caSecret
    asserts:
      - hasDocuments:
          count: 0

  - it: issues a URI-only server certificate for the opted-in engine
    set:
      global.rbac.enabled: true
      de.internalAuth.enabled: true
    documentSelector:
      path: metadata.name
      value: bicep-de-spiffe
    asserts:
      - equal:
          path: spec
          value:
            secretName: bicep-de-spiffe
            duration: 24h
            renewBefore: 8h
            privateKey:
              algorithm: ECDSA
              size: 256
              rotationPolicy: Always
            usages:
              - digital signature
              - server auth
            uris:
              - spiffe://radius.internal/ns/radius-system/sa/bicep-de
            issuerRef:
              group: cert-manager.io
              kind: Issuer
              name: radius-ca-issuer

  - it: fails when global.rootCA.secretName names a receiver's SPIFFE Secret
    set:
      global.rbac.enabled: true
      global.rootCA.cert: test-ca
      global.rootCA.secretName: ucp-spiffe
    asserts:
      - failedTemplate:
          errorMessage: "global.rootCA.secretName must not be \"ucp-spiffe\": cert-manager writes ucp's SPIFFE server certificate and key to that Secret"

  - it: fails when global.targetCluster.secretName names a receiver's SPIFFE Secret in dryRun
    set:
      global.rbac.dryRun: true
      global.targetCluster.enabled: true
      global.targetCluster.secretName: dynamic-rp-spiffe
    asserts:
      - failedTemplate:
          errorMessage: "global.targetCluster.secretName must not be \"dynamic-rp-spiffe\": cert-manager writes dynamic-rp's SPIFFE server certificate and key to that Secret"

  - it: fails when a global.imagePullSecrets name is a receiver's SPIFFE Secret in enforce mode
    set:
      global.rbac.enabled: true
      global.imagePullSecrets:
        - name: registry
        - name: ucp-spiffe
    asserts:
      - failedTemplate:
          errorMessage: "global.imagePullSecrets[1].name must not be \"ucp-spiffe\": cert-manager writes ucp's SPIFFE server certificate and key to that Secret, and cannot add them to an existing registry Secret"

  - it: allows a global.imagePullSecrets name matching a receiver's SPIFFE Secret when authorization is off
    set:
      global.imagePullSecrets:
        - name: registry
        - name: ucp-spiffe
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: allows global.imagePullSecrets that are not receiver SPIFFE Secrets in dryRun
    set:
      global.rbac.dryRun: true
      global.imagePullSecrets:
        - name: registry
        - name: spiffe
    asserts:
      - notFailedTemplate: {}

  - it: fails when global.rootCA.secretName is radius-ca with enabled
    set:
      global.rbac.enabled: true
      global.rootCA.cert: test-ca
      global.rootCA.secretName: radius-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.rootCA.secretName must not be \"radius-ca\": cert-manager writes the Radius CA certificate and signing key to that Secret"

  - it: fails when global.rootCA.secretName is radius-apiserver-ca with enabled
    set:
      global.rbac.enabled: true
      global.rootCA.cert: test-ca
      global.rootCA.secretName: radius-apiserver-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.rootCA.secretName must not be \"radius-apiserver-ca\": cert-manager writes the UCP API server CA certificate and signing key to that Secret"

  - it: fails when global.rootCA.secretName is ucp-apiserver-tls with enabled
    set:
      global.rbac.enabled: true
      global.rootCA.cert: test-ca
      global.rootCA.secretName: ucp-apiserver-tls
    asserts:
      - failedTemplate:
          errorMessage: "global.rootCA.secretName must not be \"ucp-apiserver-tls\": cert-manager writes UCP's API server certificate and key to that Secret"

  - it: fails when global.targetCluster.secretName is radius-ca with enabled
    set:
      global.rbac.enabled: true
      global.targetCluster.enabled: true
      global.targetCluster.secretName: radius-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.targetCluster.secretName must not be \"radius-ca\": cert-manager writes the Radius CA certificate and signing key to that Secret"

  - it: fails when global.targetCluster.secretName is radius-apiserver-ca with enabled
    set:
      global.rbac.enabled: true
      global.targetCluster.enabled: true
      global.targetCluster.secretName: radius-apiserver-ca
    asserts:
      - failedTemplate:
          errorMessage: "global.targetCluster.secretName must not be \"radius-apiserver-ca\": cert-manager writes the UCP API server CA certificate and signing key to that Secret"

  - it: fails when global.targetCluster.secretName is ucp-apiserver-tls with enabled
    set:
      global.rbac.enabled: true
      global.targetCluster.enabled: true
      global.targetCluster.secretName: ucp-apiserver-tls
    asserts:
      - failedTemplate:
          errorMessage: "global.targetCluster.secretName must not be \"ucp-apiserver-tls\": cert-manager writes UCP's API server certificate and key to that Secret"

  - it: ignores inactive shared Secret names that match a reserved authorization Secret
    set:
      global.rbac.enabled: true
      global.rootCA.secretName: radius-apiserver-ca
      global.targetCluster.secretName: ucp-apiserver-tls
    asserts:
      - hasDocuments:
          count: 8

  - it: does not validate reserved authorization Secret names when authorization is off
    set:
      global.rootCA.cert: test-ca
      global.rootCA.secretName: radius-apiserver-ca
      global.targetCluster.enabled: true
      global.targetCluster.secretName: ucp-apiserver-tls
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores inactive shared Secret names that match a receiver's SPIFFE Secret
    set:
      global.rbac.enabled: true
      global.rootCA.secretName: ucp-spiffe
      global.targetCluster.secretName: applications-rp-spiffe
    asserts:
      - hasDocuments:
          count: 8

  - it: renders no receiver Certificate and does not validate shared Secret names when authorization is off
    set:
      global.rootCA.cert: test-ca
      global.rootCA.secretName: ucp-spiffe
      global.targetCluster.enabled: true
      global.targetCluster.secretName: ucp-spiffe
    asserts:
      - hasDocuments:
          count: 0
