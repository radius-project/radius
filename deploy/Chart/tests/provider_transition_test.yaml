suite: test provider boundaries and receipt identity
templates:
  - ucp/deployment.yaml
  - rp/deployment.yaml
  - dynamic-rp/deployment.yaml
  - controller/deployment.yaml
  - de/deployment.yaml
  - ucp/configmaps.yaml
  - global/provider-transition.yaml
tests:
  - it: rejects deferred configuration generation
    set:
      global.rbac.providerGeneration: "0123456789abcdef0123456789abcdef"
    asserts:
      - failedTemplate:
          errorMessage: providerGeneration and providerReplicas belong to deferred provider execution and are unsupported; all five workloads, including the trust-only controller, require verified coverage.
        template: global/provider-transition.yaml
  - it: rejects deferred replica manipulation
    set:
      global.rbac.providerReplicas:
        ucp: 1
        applications-rp: 1
        dynamic-rp: 1
        bicep-de: 1
    asserts:
      - failedTemplate:
          errorMessage: providerGeneration and providerReplicas belong to deferred provider execution and are unsupported; all five workloads, including the trust-only controller, require verified coverage.
        template: global/provider-transition.yaml
  - it: projects pod identity for both managed receipt participants
    set:
      global.rbac.enabled: true
      de.internalAuth.enabled: true
      de.tag: source-test-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        template: rp/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_INTERNAL_AUTH_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        template: de/deployment.yaml
  - it: projects external receipt identity without a controller listener identity
    set:
      global.rbac.dryRun: true
      global.rbac.tls.provider: external
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        template: ucp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUS_POD_UID
          any: true
        template: controller/deployment.yaml
