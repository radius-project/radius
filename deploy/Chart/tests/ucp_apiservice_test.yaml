suite: test UCP aggregated API certificate
templates:
  - ucp/apiservice.yaml
  - ucp/deployment.yaml
release:
  name: radius
  namespace: radius-system
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
tests:
  - it: generates the ucp-cert Secret and caBundle when authorization is off
    template: ucp/apiservice.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ucp-cert
        documentIndex: 0
      - isKind:
          of: APIService
        documentIndex: 1
      - isNotNullOrEmpty:
          path: spec.caBundle
        documentIndex: 1
      - notExists:
          path: metadata.annotations
        documentIndex: 1

  - it: mounts the ucp-cert Secret when authorization is off
    template: ucp/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              secretName: ucp-cert

  - it: issues ucp-cert from the API server issuer in dryRun
    template: ucp/apiservice.yaml
    set:
      global.rbac.dryRun: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Certificate
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ucp-cert
        documentIndex: 0
      - equal:
          path: spec.issuerRef
          value:
            group: cert-manager.io
            kind: Issuer
            name: radius-apiserver-issuer
        documentIndex: 0

  - it: issues ucp-cert from the API server issuer in enforce
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: Certificate
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 0
      - equal:
          path: spec.secretName
          value: ucp-apiserver-tls
        documentIndex: 0
      - equal:
          path: spec.dnsNames
          value: [ucp.radius-system.svc]
        documentIndex: 0
      - equal:
          path: spec.usages
          value:
            - digital signature
            - server auth
        documentIndex: 0
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
        documentIndex: 0
      - equal:
          path: spec.issuerRef.name
          value: radius-apiserver-issuer
        documentIndex: 0
      - equal:
          path: spec.duration
          value: 24h
        documentIndex: 0
      - equal:
          path: spec.renewBefore
          value: 8h
        documentIndex: 0

  - it: injects the CA bundle from radius-apiserver-ca, never from ucp-cert, on a fresh install
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: APIService
        documentIndex: 1
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        documentIndex: 1
      - notExists:
          path: spec.caBundle
        documentIndex: 1

  - it: renders the caBundle from radius-apiserver-ca once cert-manager issued it
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
          data:
            ca.crt: YXBpc2VydmVyLWNh
            tls.crt: YXBpc2VydmVyLWNh
            tls.key: a2V5
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: YXBpc2VydmVyLWNh
        documentIndex: 1

  - it: injects and renders the caBundle from the trust Secret during the upgrade overlap
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
          data:
            ca.crt: dHJ1c3QtY2E=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
          data:
            ca.crt: YXBpc2VydmVyLWNh
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-trust
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: dHJ1c3QtY2E=
        documentIndex: 1

  - it: does not copy the ca.crt of UCP's certificate Secrets into the caBundle
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ucp-apiserver-tls
            namespace: radius-system
          data:
            ca.crt: b3JnLXJvb3Q=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ucp-cert
            namespace: radius-system
          data:
            ca.crt: dWNwLWNh
    asserts:
      - notExists:
          path: spec.caBundle
        documentIndex: 1

  - it: uses the release namespace for the certificate, SAN, and injection
    template: ucp/apiservice.yaml
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: spec.dnsNames
          value: [ucp.custom-ns.svc]
        documentIndex: 0
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: custom-ns/radius-apiserver-ca
        documentIndex: 1

  - it: mounts the cert-manager Secret when authorization is on
    template: ucp/deployment.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              secretName: ucp-apiserver-tls
