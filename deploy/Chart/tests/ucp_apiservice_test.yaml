suite: test UCP aggregated API certificate
templates:
  - ucp/apiservice.yaml
  - ucp/deployment.yaml
  - de/deployment.yaml
release:
  name: radius
  namespace: radius-system
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    "apiregistration.k8s.io/v1/APIService":
      gvr:
        group: apiregistration.k8s.io
        version: v1
        resource: apiservices
      namespaced: false
tests:
  - it: generates the ucp-cert Secret and caBundle when authorization is off
    template: ucp/apiservice.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ucp-cert
        documentIndex: 0
      - isKind:
          of: APIService
        documentIndex: 1
      - isNotNullOrEmpty:
          path: spec.caBundle
        documentIndex: 1
      - notExists:
          path: metadata.annotations
        documentIndex: 1

  - it: mounts the ucp-cert Secret when authorization is off
    template: ucp/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              secretName: ucp-cert

  - it: issues ucp-cert from the API server issuer in dryRun
    template: ucp/apiservice.yaml
    set:
      global.rbac.dryRun: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Certificate
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ucp-cert
        documentIndex: 0
      - equal:
          path: spec.issuerRef
          value:
            group: cert-manager.io
            kind: Issuer
            name: radius-apiserver-issuer
        documentIndex: 0

  - it: issues ucp-cert from the API server issuer in enforce
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: Certificate
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: radius-system
        documentIndex: 0
      - equal:
          path: spec.secretName
          value: ucp-apiserver-tls
        documentIndex: 0
      - equal:
          path: spec.dnsNames
          value: [ucp.radius-system.svc]
        documentIndex: 0
      - equal:
          path: spec.secretTemplate.annotations
          value:
            radapp.io/release-name: radius
            radapp.io/release-namespace: radius-system
        documentIndex: 0
      - equal:
          path: spec.usages
          value:
            - digital signature
            - server auth
        documentIndex: 0
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
        documentIndex: 0
      - equal:
          path: spec.issuerRef.name
          value: radius-apiserver-issuer
        documentIndex: 0
      - equal:
          path: spec.duration
          value: 24h
        documentIndex: 0
      - equal:
          path: spec.renewBefore
          value: 8h
        documentIndex: 0

  - it: injects the CA bundle from radius-apiserver-ca, never from ucp-cert, on a fresh install
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - isKind:
          of: APIService
        documentIndex: 1
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        documentIndex: 1
      - notExists:
          path: spec.caBundle
        documentIndex: 1

  - it: renders the caBundle from radius-apiserver-ca once cert-manager issued it
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
            tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
            tls.key: a2V5
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
        documentIndex: 1

  - it: refuses a radius-apiserver-ca Secret marked for another release
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: other
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: b3RoZXI=
            tls.crt: b3RoZXI=
            tls.key: a2V5
    asserts:
      - failedTemplate:
          errorPattern: "Secret radius-system/radius-apiserver-ca is not marked for Helm release radius-system/radius"

  - it: refuses an unmarked radius-apiserver-ca Secret
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
          data:
            ca.crt: b3RoZXI=
            tls.crt: b3RoZXI=
            tls.key: a2V5
    asserts:
      - failedTemplate:
          errorPattern: "kubectl delete secret radius-apiserver-ca -n radius-system"

  - it: refuses a radius-apiserver-ca whose ca.crt holds a non-certificate block
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0KLS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkFBQUEKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=
    asserts:
      - failedTemplate:
          errorPattern: "ca.crt of Secret radius-system/radius-apiserver-ca holds something other than PEM certificates"

  - it: refuses a radius-apiserver-ca whose ca.crt holds trailing text
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0KdHJhaWxpbmcgdGV4dAo=
    asserts:
      - failedTemplate:
          errorPattern: "ca.crt of Secret radius-system/radius-apiserver-ca holds something other than PEM certificates"

  - it: injects and renders the caBundle from the trust Secret during the upgrade overlap
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          metadata:
            name: v1alpha3.api.ucp.dev
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-trust
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: 
        documentIndex: 1

  - it: fails when the overlap trust Secret holds something other than PEM certificates
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          metadata:
            name: v1alpha3.api.ucp.dev
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0KLS0tLS1CRUdJTiBOT1RFLS0tLS0KYjNSb1pYST0KLS0tLS1FTkQgTk9URS0tLS0tCg==
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - failedTemplate:
          errorPattern: "ca.crt of Secret radius-system/radius-apiserver-trust holds something other than PEM certificates"

  - it: ignores a leftover trust Secret on a fresh install without the APIService
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: dHJ1c3QtY2E=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
        documentIndex: 1

  - it: ignores a radius-apiserver-trust Secret that rad does not own
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
          data:
            ca.crt: dHJ1c3QtY2E=
            unrelated-data: Zml4dHVyZQ==
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
        documentIndex: 1

  - it: ignores a radius-apiserver-trust Secret marked for another release
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: other
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: dHJ1c3QtY2E=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
        documentIndex: 1

  - it: ignores an annotated radius-apiserver-trust Secret with an empty ca.crt
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-trust
            namespace: radius-system
            annotations:
              cert-manager.io/allow-direct-injection: "true"
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: ""
        - apiVersion: v1
          kind: Secret
          metadata:
            name: radius-apiserver-ca
            namespace: radius-system
            annotations:
              radapp.io/release-name: radius
              radapp.io/release-namespace: radius-system
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: radius-system/radius-apiserver-ca
        documentIndex: 1
      - equal:
          path: spec.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCllYQnBMV05oCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
        documentIndex: 1

  - it: does not copy the ca.crt of UCP's certificate Secrets into the caBundle
    template: ucp/apiservice.yaml
    set:
      global.rbac.enabled: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ucp-apiserver-tls
            namespace: radius-system
          data:
            ca.crt: b3JnLXJvb3Q=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ucp-cert
            namespace: radius-system
          data:
            ca.crt: dWNwLWNh
    asserts:
      - notExists:
          path: spec.caBundle
        documentIndex: 1

  - it: uses the release namespace for the certificate, SAN, and injection
    template: ucp/apiservice.yaml
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    asserts:
      - equal:
          path: spec.dnsNames
          value: [ucp.custom-ns.svc]
        documentIndex: 0
      - equal:
          path: spec.secretTemplate.annotations["radapp.io/release-namespace"]
          value: custom-ns
        documentIndex: 0
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: custom-ns/radius-apiserver-ca
        documentIndex: 1

  # The deployment engine calls UCP back at RADIUSBACKENDURL, so its host must be the ucp.<namespace>.svc SAN above.
  - it: points the deployment engine at the SAN of ucp-cert in the release namespace
    template: de/deployment.yaml
    release:
      namespace: custom-ns
    set:
      global.rbac.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.custom-ns.svc:443/apis/api.ucp.dev/v1alpha3

  # With authorization off, the URL earlier charts render is unchanged, a SAN of the Helm-generated certificate, so an
  # upgrade does not restart the deployment engine.
  - it: keeps the deployment engine URL of earlier charts when authorization is off
    template: de/deployment.yaml
    release:
      namespace: custom-ns
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.custom-ns:443/apis/api.ucp.dev/v1alpha3

  - it: mounts the cert-manager Secret when authorization is on
    template: ucp/deployment.yaml
    set:
      global.rbac.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              secretName: ucp-apiserver-tls
