suite: test controller without legacy Kubernetes onboarding
templates:
  - controller/*
release:
  name: radius
  namespace: radius-system
tests:
  - it: defaults to no Flux sources and uses a nonoverlapping rollout
    asserts:
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: 'controller:\s+flux:\s+enabled: false\s+sources: \[\]'
        template: controller/configmaps.yaml
      - equal:
          path: spec.strategy.type
          value: Recreate
        template: controller/deployment.yaml
      - notExists:
          path: spec.strategy.rollingUpdate
        template: controller/deployment.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/flux-config"]
          pattern: '^[a-f0-9]{64}$'
        template: controller/deployment.yaml

  - it: renders explicitly selected Flux identities
    set:
      controller.flux.enabled: true
      controller.flux.sources:
        - namespace: flux-system
          name: applications
          uid: source-uid
    templates:
      - controller/configmaps.yaml
    asserts:
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: 'flux:\s+enabled: true\s+sources:\s+- name: applications\s+namespace: flux-system\s+uid: source-uid'

  - it: rejects incomplete source identities even while disabled
    set:
      controller.flux.sources:
        - namespace: flux-system
          name: applications
    templates:
      - controller/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: controller.flux.sources uid must be a string

  - it: rejects duplicate source identities
    set:
      controller.flux.sources:
        - namespace: flux-system
          name: applications
          uid: source-a
        - namespace: flux-system
          name: applications
          uid: source-b
    templates:
      - controller/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: controller.flux.sources contains duplicate source flux-system/applications

  - it: rejects wildcard source identifiers
    set:
      controller.flux.sources:
        - namespace: flux-system
          name: applications
          uid: "*"
    templates:
      - controller/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: controller.flux.sources uid must be a nonempty exact UID

  - it: renders only the deployment, configuration, service account, and RBAC
    asserts:
      - hasDocuments:
          count: 1
        template: controller/deployment.yaml
      - hasDocuments:
          count: 1
        template: controller/configmaps.yaml
      - hasDocuments:
          count: 1
        template: controller/serviceaccount.yaml
      - hasDocuments:
          count: 2
        template: controller/rbac.yaml
      - notMatchRegex:
          path: kind
          pattern: ^(Service|Secret|ValidatingWebhookConfiguration)$

  - it: retains Bicep and health without webhook ports or certificates
    set:
      global.prometheus.enabled: false
    templates:
      - controller/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config-file
            - /etc/config/controller-config.yaml
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: BICEP
              value: /usr/local/bin/bicep
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 3000
              name: healthz
              protocol: TCP
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: bicep
              emptyDir: {}
            - name: bicepconfig
              emptyDir: {}
            - name: config-volume
              configMap:
                name: controller-config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: bicep
              mountPath: /usr/local/bin
            - name: bicepconfig
              mountPath: /bicepconfig.json
              subPath: bicepconfig.json
            - name: config-volume
              mountPath: /etc/config

  - it: retains the optional metrics port
    set:
      global.prometheus.enabled: true
      global.prometheus.port: 9090
    templates:
      - controller/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9090
              name: metrics
              protocol: TCP
            - containerPort: 3000
              name: healthz
              protocol: TCP

  - it: removes webhook server configuration
    templates:
      - controller/configmaps.yaml
    asserts:
      - notMatchRegex:
          path: data["controller-config.yaml"]
          pattern: '(?m)^server:'
      - matchRegex:
          path: data["controller-config.yaml"]
          pattern: 'workerServer:\s+port: 3000'

  - it: retains deployment and Flux permissions without legacy resource permissions
    templates:
      - controller/rbac.yaml
    documentIndex: 0
    asserts:
      - lengthEqual:
          path: rules
          count: 6
      - equal:
          path: rules[0].resources
          value:
            - namespaces
            - events
      - equal:
          path: rules[1].apiGroups
          value:
            - radapp.io
      - equal:
          path: rules[1].resources
          value:
            - deploymenttemplates
            - deploymenttemplates/status
            - deploymentresources
            - deploymentresources/status
      - equal:
          path: rules[2].apiGroups
          value:
            - api.ucp.dev
      - equal:
          path: rules[3].resources
          value:
            - gitrepositories
      - equal:
          path: rules[4].resources
          value:
            - gitrepositories/status
      - equal:
          path: rules[5].resources
          value:
            - customresourcedefinitions
