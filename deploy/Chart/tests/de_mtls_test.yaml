suite: test deployment engine opt-in UCP mTLS
templates:
  - de/deployment.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: preserves the published engine contract by default
    asserts: &legacy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.radius-system:443/apis/api.ucp.dev/v1alpha3
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mtls
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_ENABLED
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_CERTIFICATE_DIRECTORY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_NAMESPACE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_STARTUP_PROOF_ENABLED
          any: true

  - it: preserves legacy engine access in dryRun until a compatible image is selected
    set:
      global.rbac.dryRun: true
    asserts: *legacy

  - it: preserves legacy engine access in enforce until a compatible image is selected
    set:
      global.rbac.enabled: true
    asserts: *legacy

  - it: supports saved values without the opt-in setting
    set:
      de.ucpMTLS: null
      global.rbac.enabled: true
    asserts: *legacy

  - it: rejects opt-in without managed component certificates
    set:
      de.ucpMTLS.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.enabled requires global.rbac.dryRun=true or global.rbac.enabled=true

  - it: rejects a string instead of a boolean switch
    set:
      de.ucpMTLS.enabled: "false"
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.enabled must be a boolean

  - it: rejects a zero instead of a boolean switch
    set:
      de.ucpMTLS.enabled: 0
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.enabled must be a boolean

  - it: uses only the engine identity with the explicit dryRun opt-in
    set:
      global.rbac.dryRun: true
      de.ucpMTLS.enabled: true
      de.image: localhost:5000/deployment-engine
      de.tag: a7-local-test
    asserts: &mtls
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: appsettings-vol
              configMap:
                name: bicep-de-config
            - name: mtls
              secret:
                secretName: bicep-de-mtls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: appsettings-vol
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: mtls
              mountPath: /var/run/radius/mtls
              readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_CERTIFICATE_DIRECTORY
            value: /var/run/radius/mtls
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_NAMESPACE
            value: radius-system
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.radius-system.svc:9444/apis/api.ucp.dev/v1alpha3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARM_AUTH_METHOD
            value: UCPCredential
      - equal:
          path: spec.template.spec.containers[0].image
          value: localhost:5000/deployment-engine:a7-local-test

  - it: uses the same explicit opt-in contract in enforce
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
      de.image: localhost:5000/deployment-engine
      de.tag: a7-local-test
    asserts: *mtls

  - it: derives the peer namespace and canonical endpoint from the release
    release:
      namespace: radius-test
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADIUSBACKENDURL
            value: https://ucp.radius-test.svc:9444/apis/api.ucp.dev/v1alpha3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_NAMESPACE
            value: radius-test

  - it: passes only the agreed proof settings to an explicitly compatible engine
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
      de.ucpMTLS.startupProof.enabled: true
      de.ucpMTLS.startupProof.expectedTrustSHA256: "6134ae3055977f0d025f1c2ada38ebdcad54514560ee2819b32a4a33e03f3a9f"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_STARTUP_PROOF_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_EXPECTED_TRUST_SHA256
            value: "6134ae3055977f0d025f1c2ada38ebdcad54514560ee2819b32a4a33e03f3a9f"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UCP_MTLS_TRUST_GENERATION
          any: true

  - it: rejects proof without the mTLS transport
    set:
      de.ucpMTLS.startupProof.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.startupProof.enabled requires de.ucpMTLS.enabled=true and a compatible engine image

  - it: rejects malformed expected public trust
    set:
      global.rbac.enabled: true
      de.ucpMTLS.enabled: true
      de.ucpMTLS.startupProof.enabled: true
      de.ucpMTLS.startupProof.expectedTrustSHA256: NOT-A-DIGEST
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.startupProof.expectedTrustSHA256 must be a lowercase SHA-256 digest of the dedicated CA fingerprint set

  - it: rejects a dormant expected digest
    set:
      de.ucpMTLS.startupProof.expectedTrustSHA256: "6134ae3055977f0d025f1c2ada38ebdcad54514560ee2819b32a4a33e03f3a9f"
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.startupProof.expectedTrustSHA256 requires startupProof.enabled=true

  - it: rejects a nonboolean proof switch
    set:
      de.ucpMTLS.startupProof.enabled: "false"
    asserts:
      - failedTemplate:
          errorMessage: de.ucpMTLS.startupProof.enabled must be a boolean
