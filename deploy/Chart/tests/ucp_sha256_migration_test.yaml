suite: UCP SHA-256 migration RBAC
templates:
  - ucp/rbac.yaml
release:
  namespace: radius-system
tests:
  - it: should limit UCP to the migration status ConfigMap and the control-plane pods in its namespace
    documentSelector:
      path: $[?(@.kind == "Role" && @.metadata.name == "ucp-sha256-migration")].metadata.name
      value: ucp-sha256-migration
    asserts:
      - equal:
          path: metadata.name
          value: ucp-sha256-migration
      - equal:
          path: metadata.namespace
          value: radius-system
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - create
            - apiGroups:
                - ""
              resources:
                - configmaps
              resourceNames:
                - radius-sha256-migration
              verbs:
                - get
                - patch
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
            - apiGroups:
                - apps
              resources:
                - deployments
              resourceNames:
                - ucp
                - applications-rp
                - dynamic-rp
              verbs:
                - get
            - apiGroups:
                - apps
              resources:
                - replicasets
              verbs:
                - get

  - it: should bind the Role to the UCP service account
    documentSelector:
      path: $[?(@.kind == "RoleBinding" && @.metadata.name == "ucp-sha256-migration")].metadata.name
      value: ucp-sha256-migration
    asserts:
      - equal:
          path: metadata.namespace
          value: radius-system
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: ucp-sha256-migration
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: ucp
              namespace: radius-system
