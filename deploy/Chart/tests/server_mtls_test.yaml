suite: test server authorization config and ports
templates:
  - ucp/deployment.yaml
  - ucp/service.yaml
  - ucp/configmaps.yaml
  - rp/deployment.yaml
  - rp/configmaps.yaml
  - dynamic-rp/deployment.yaml
  - dynamic-rp/configmaps.yaml
release:
  name: radius
  namespace: radius-system
tests:
  - it: does not configure authorization or open the UCP internal port by default
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: ucp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: dynamic-rp/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: internal
          any: true
        template: ucp/deployment.yaml
      - lengthEqual:
          path: spec.ports
          count: 1
        template: ucp/service.yaml
      - notMatchRegex:
          path: data["ucp-config.yaml"]
          pattern: internalPort
        template: ucp/configmaps.yaml

  - it: configures each server's SPIFFE certificate and tokens in dryRun mode
    set:
      global.rbac.dryRun: true
    asserts: &configured
      # Servers present the csi-driver-spiffe certificate and no longer mount a client
      # certificate Secret.
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: ucp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: rp/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mtls
          any: true
        template: dynamic-rp/deployment.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: '(?m)^authorization:\n  mode: "\w+"\n  certificateDirectory: "/var/run/radius/spiffe"\n  tokenDirectory: "/var/run/radius/tokens"\n  trustDomain: "radius.internal"\n  namespace: "radius-system"$'
        template: ucp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^authorization:\n  mode: "\w+"\n  podSecurityLevel: "baseline"\n  controlPlaneNamespace: "radius-system"\n  controlPlaneSecrets: \["database-secret","radius-encryption-key","radius-aws-fingerprint-key","ucp-cert","root-ca-cert","target-kubeconfig"\]\n  certificateDirectory: "/var/run/radius/spiffe"\n  tokenDirectory: "/var/run/radius/tokens"\n  trustDomain: "radius.internal"\n  namespace: "radius-system"$'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^authorization:\n  mode: "\w+"\n  certificateDirectory: "/var/run/radius/spiffe"\n  tokenDirectory: "/var/run/radius/tokens"\n  trustDomain: "radius.internal"\n  namespace: "radius-system"$'
        template: dynamic-rp/configmaps.yaml
      - matchRegex:
          path: data["ucp-config.yaml"]
          pattern: '(?m)^  port: 9443\n(.*\n)*  internalPort: 9444$'
        template: ucp/configmaps.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9444
            name: internal
            protocol: TCP
        template: ucp/deployment.yaml
      - contains:
          path: spec.ports
          content:
            port: 9444
            name: internal
            protocol: TCP
            targetPort: 9444
        template: ucp/service.yaml
      # The Kubernetes API aggregation port is unchanged.
      - contains:
          path: spec.ports
          content:
            port: 443
            name: https
            protocol: TCP
            targetPort: 9443
        template: ucp/service.yaml

  - it: configures each server's SPIFFE certificate and tokens in enforce mode
    set:
      global.rbac.enabled: true
    asserts: *configured

  # Kubelet and Prometheus cannot present ServiceAccount tokens for Radius audiences, so probes
  # and metrics must not use the ports that require tokens in enforce mode.
  - it: keeps probes and metrics off the token-authenticated ports in enforce mode
    set:
      global.rbac.enabled: true
      global.prometheus.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: ucp
        template: ucp/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
        template: ucp/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
        template: rp/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
        template: rp/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
        template: dynamic-rp/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
        template: dynamic-rp/deployment.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^metricsProvider:\n(.*\n)*    port: 9090\n(.*\n)*server:\n  host: "0.0.0.0"\n  port: 5443$'
        template: rp/configmaps.yaml
      - matchRegex:
          path: data["radius-self-host.yaml"]
          pattern: '(?m)^metricsProvider:\n(.*\n)*    port: 9092\n(.*\n)*server:\n  host: "0.0.0.0"\n  port: 8082$'
        template: dynamic-rp/configmaps.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: metrics
            protocol: TCP
        template: ucp/deployment.yaml
