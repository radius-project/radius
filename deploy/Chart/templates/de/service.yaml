apiVersion: v1
kind: Service
metadata:
  name: bicep-de
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bicep-de
    app.kubernetes.io/part-of: radius
spec:
  ports:
    - port: 6443
      name: {{ if and (eq (include "radius.de.internalAuth.enabled" .) "true") (eq (include "radius.authz.tls.provider" .) "radius") }}https{{ else }}http{{ end }}
      protocol: TCP
      targetPort: 6443
  selector:
    app.kubernetes.io/name: bicep-de
