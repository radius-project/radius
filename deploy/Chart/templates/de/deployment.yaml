{{- $rotation := include "radius.rotationSnapshot" (dict "root" . "apiVersion" "apps/v1" "kind" "Deployment" "name" "bicep-de") | mustFromJson }}
{{- $appversion := include "radius.versiontag" . }}
{{- $image := include "radius.image" (dict "image" .Values.de.image "tag" (.Values.de.tag | default .Values.global.imageTag | default $appversion) "global" .Values.global) }}
{{- $settings := .Values.de.ucpMTLS | default dict }}
{{- $mtls := false }}
{{- if hasKey $settings "enabled" }}
{{- $mtls = $settings.enabled }}
{{- end }}
{{- if not (kindIs "bool" $mtls) }}
{{- fail "de.ucpMTLS.enabled must be a boolean" }}
{{- end }}
{{- if and $mtls (eq (include "radius.authz.mode" .) "off") }}
{{- fail "de.ucpMTLS.enabled requires global.rbac.dryRun=true or global.rbac.enabled=true" }}
{{- end }}
{{- $proof := deepCopy ($settings.startupProof | default dict) }}
{{- if and $rotation.state $proof.enabled }}
{{- $_ := set $proof "expectedTrustSHA256" $rotation.state.plan.targetTrustSHA256 }}
{{- end }}
{{- $proofEnabled := false }}
{{- if hasKey $proof "enabled" }}
{{- $proofEnabled = $proof.enabled }}
{{- end }}
{{- if not (kindIs "bool" $proofEnabled) }}
{{- fail "de.ucpMTLS.startupProof.enabled must be a boolean" }}
{{- end }}
{{- if $proofEnabled }}
{{- if not $mtls }}
{{- fail "de.ucpMTLS.startupProof.enabled requires de.ucpMTLS.enabled=true and a compatible engine image" }}
{{- end }}
{{- if or (not (kindIs "string" $proof.expectedTrustSHA256)) (not (regexMatch `^[0-9a-f]{64}$` (toString $proof.expectedTrustSHA256))) }}
{{- fail "de.ucpMTLS.startupProof.expectedTrustSHA256 must be a lowercase SHA-256 digest of the dedicated CA fingerprint set" }}
{{- end }}
{{- else if $proof.expectedTrustSHA256 }}
{{- fail "de.ucpMTLS.startupProof.expectedTrustSHA256 requires startupProof.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bicep-de
  namespace: {{ .Release.Namespace }}
  {{- include "radius.rotationMetadata" $rotation | nindent 2 }}
  labels:
    control-plane: bicep-de
    app.kubernetes.io/name: bicep-de
    app.kubernetes.io/part-of: radius
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bicep-de
  template:
    metadata:
      labels:
        control-plane: bicep-de
        app.kubernetes.io/name: bicep-de
        app.kubernetes.io/part-of: radius
        {{- if eq .Values.global.azureWorkloadIdentity.enabled true }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if eq .Values.global.prometheus.enabled true }}
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "6443"
        prometheus.io/scrape: "true"
      {{- end }}
    spec:
      serviceAccountName: bicep-de
      {{- if .Values.global.appendRootCA.cert }}
      initContainers:
      - name: append-root-ca
        image: "{{ .Values.rp.image }}:{{ .Values.rp.tag | default $appversion }}"
        command:
        - sh
        - -c
        - |
          mkdir -p /etc/radius-ssl/certs
          cp /etc/ssl/certs/* /etc/radius-ssl/certs/
          cat >> /etc/radius-ssl/certs/ca-certificates.crt <<'CERTEOF'
        {{ .Values.global.appendRootCA.cert | nindent 10 }}
          CERTEOF
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/radius-ssl/certs
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 6 }}
      {{- end }}
      volumes:
        - name: appsettings-vol
          configMap:
            name: bicep-de-config
        {{- if $mtls }}
        {{- include "radius.authz.mtls.volume" (dict "root" . "component" "bicep-de") | nindent 8 }}
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          secret:
            secretName: {{ .Values.global.rootCA.secretName }}
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          emptyDir: {}
        {{- end }}
        {{- include "radius.targetCluster.volume" . | nindent 8 }}
      containers:
      - name: de
        image: {{ $image }}
        {{- if hasSuffix ":edge" $image }}
        imagePullPolicy: Always
        {{- end }}
        args:
        - --kubernetes=true
        volumeMounts:
        - name: appsettings-vol
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        {{- if $mtls }}
        {{- include "radius.authz.mtls.volumeMount" . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          mountPath: {{ .Values.global.rootCA.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}
        {{- include "radius.targetCluster.volumeMount" . | nindent 8 }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: SKIP_ARM
          value: "false"
        - name: ARM_AUTH_METHOD
          value: "UCPCredential"
        - name: ASPNETCORE_URLS
          value: http://+:6443
        - name: kubernetes
          value: "true"
        - name: RADIUSBACKENDURL
        {{- if $mtls }}
          value: https://ucp.{{ .Release.Namespace }}.svc:9444/apis/api.ucp.dev/v1alpha3
        - name: UCP_MTLS_ENABLED
          value: "true"
        - name: UCP_MTLS_CERTIFICATE_DIRECTORY
          value: {{ include "radius.authz.mtls.mountPath" . | quote }}
        - name: UCP_MTLS_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        {{- if $proofEnabled }}
        - name: UCP_MTLS_STARTUP_PROOF_ENABLED
          value: "true"
        - name: UCP_MTLS_EXPECTED_TRUST_SHA256
          value: {{ $proof.expectedTrustSHA256 | quote }}
        - name: UCP_MTLS_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        {{- end }}
        {{- else }}
          value: https://ucp.radius-system:443/apis/api.ucp.dev/v1alpha3
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.sslCertDirEnvVar }}
          value: {{ .Values.global.rootCA.mountPath }}
        {{- end}}
        {{- include "radius.targetCluster.env" . | nindent 8 }}
        ports:
        - containerPort: 6443
          name: bicep-de-api
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
        {{- if .Values.de.resources }}
        resources:{{ toYaml .Values.de.resources | nindent 10 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
