{{- $rotation := include "radius.rotationSnapshot" (dict "root" . "apiVersion" "apps/v1" "kind" "Deployment" "name" "bicep-de") | mustFromJson }}
{{- $appversion := include "radius.versiontag" . }}
{{- $image := include "radius.image" (dict "image" .Values.de.image "tag" (.Values.de.tag | default .Values.global.imageTag | default $appversion) "global" .Values.global) }}
{{- $auth := eq (include "radius.de.internalAuth.enabled" .) "true" }}
{{- $provider := include "radius.authz.tls.provider" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bicep-de
  namespace: {{ .Release.Namespace }}
  {{- include "radius.rotationMetadata" $rotation | nindent 2 }}
  labels:
    control-plane: bicep-de
    app.kubernetes.io/name: bicep-de
    app.kubernetes.io/part-of: radius
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bicep-de
  template:
    metadata:
      labels:
        control-plane: bicep-de
        app.kubernetes.io/name: bicep-de
        app.kubernetes.io/part-of: radius
        {{- if eq .Values.global.azureWorkloadIdentity.enabled true }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if $auth }}
      annotations:
        checksum/authz-config: {{ include "radius.authz.configChecksum" . }}
      {{- else if eq .Values.global.prometheus.enabled true }}
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "6443"
        prometheus.io/scrape: "true"
      {{- end }}
    spec:
      serviceAccountName: bicep-de
      {{- if and $auth (eq $provider "radius") }}
      securityContext:
        fsGroup: 65532
      {{- end }}
      {{- if .Values.global.appendRootCA.cert }}
      initContainers:
      - name: append-root-ca
        image: "{{ .Values.rp.image }}:{{ .Values.rp.tag | default $appversion }}"
        command:
        - sh
        - -c
        - |
          mkdir -p /etc/radius-ssl/certs
          cp /etc/ssl/certs/* /etc/radius-ssl/certs/
          cat >> /etc/radius-ssl/certs/ca-certificates.crt <<'CERTEOF'
        {{ .Values.global.appendRootCA.cert | nindent 10 }}
          CERTEOF
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/radius-ssl/certs
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 6 }}
      {{- end }}
      volumes:
        - name: appsettings-vol
          configMap:
            name: bicep-de-config
        {{- if $auth }}
        {{- with include "radius.authz.spiffe.volume" . | trim }}{{ . | nindent 8 }}{{- end }}
        {{- with include "radius.authz.caBundle.volume" . | trim }}{{ . | nindent 8 }}{{- end }}
        {{- include "radius.authz.tokens.volumes" (dict "root" . "receivers" (list "ucp")) | nindent 8 }}
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          secret:
            secretName: {{ .Values.global.rootCA.secretName }}
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          emptyDir: {}
        {{- end }}
        {{- include "radius.targetCluster.volume" . | nindent 8 }}
      containers:
      - name: de
        image: {{ $image }}
        {{- if hasSuffix ":edge" $image }}
        imagePullPolicy: Always
        {{- end }}
        args:
        - --kubernetes=true
        volumeMounts:
        - name: appsettings-vol
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        {{- if $auth }}
        {{- with include "radius.authz.spiffe.volumeMount" . | trim }}{{ . | nindent 8 }}{{- end }}
        {{- with include "radius.authz.caBundle.volumeMount" . | trim }}{{ . | nindent 8 }}{{- end }}
        {{- include "radius.authz.tokens.volumeMounts" (dict "root" . "receivers" (list "ucp")) | nindent 8 }}
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          mountPath: {{ .Values.global.rootCA.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}
        {{- include "radius.targetCluster.volumeMount" . | nindent 8 }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: SKIP_ARM
          value: "false"
        - name: ARM_AUTH_METHOD
          value: "UCPCredential"
        - name: ASPNETCORE_URLS
        {{- if and $auth (eq $provider "radius") }}
          value: https://+:6443
        {{- else }}
          value: http://+:6443
        {{- end }}
        - name: kubernetes
          value: "true"
        - name: RADIUSBACKENDURL
        {{- if $auth }}
          value: {{ if eq $provider "radius" }}https{{ else }}http{{ end }}://ucp.{{ .Release.Namespace }}.svc:9444/apis/api.ucp.dev/v1alpha3
        - name: RADIUS_INTERNAL_AUTH_MODE
          value: {{ include "radius.authz.mode" . | quote }}
        - name: RADIUS_INTERNAL_AUTH_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: RADIUS_INTERNAL_AUTH_UCP_TOKEN_FILE
          value: {{ printf "%s/ucp/token" (include "radius.authz.tokens.mountPath" .) | quote }}
        - name: RADIUS_INTERNAL_AUTH_API_SERVER
          value: https://kubernetes.default.svc:443
        - name: RADIUS_INTERNAL_AUTH_API_CA_FILE
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: RADIUS_INTERNAL_AUTH_API_TOKEN_FILE
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
        - name: RADIUS_INTERNAL_TLS_PROVIDER
          value: {{ $provider | quote }}
        {{- if eq $provider "radius" }}
        - name: RADIUS_INTERNAL_TLS_TRUST_DOMAIN
          value: {{ include "radius.authz.spiffe.trustDomain" . | quote }}
        - name: RADIUS_INTERNAL_TLS_CERTIFICATE_DIRECTORY
          value: {{ include "radius.authz.spiffe.mountPath" . | quote }}
        - name: RADIUS_INTERNAL_TLS_CA_DIRECTORY
          value: {{ include "radius.authz.caBundle.mountPath" . | quote }}
        {{- end }}
        {{- else }}
          value: https://ucp.radius-system:443/apis/api.ucp.dev/v1alpha3
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.sslCertDirEnvVar }}
          value: {{ .Values.global.rootCA.mountPath }}
        {{- end}}
        {{- include "radius.targetCluster.env" . | nindent 8 }}
        ports:
        - containerPort: 6443
          name: bicep-de-api
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
        {{- if .Values.de.resources }}
        resources:{{ toYaml .Values.de.resources | nindent 10 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
