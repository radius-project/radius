apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radius-controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: radius
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - events
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - radapp.io
  resources:
  - deploymenttemplates
  - deploymenttemplates/status
  - deploymentresources
  - deploymentresources/status
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - api.ucp.dev
  resources:
  - '*'
  verbs:
  - '*'
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories/status
  verbs:
  - get
- apiGroups:
  - "*"
  resources:
  - customresourcedefinitions
  verbs:
  - watch
  - list
  - get
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - deploymentresources.radapp.io
  verbs:
  - patch
# Templates may own arbitrary built-in and custom outputs; status provenance gates cleanup.
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radius-controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radius-controller
subjects:
- kind: ServiceAccount
  name: controller
  namespace: {{ .Release.Namespace }}
