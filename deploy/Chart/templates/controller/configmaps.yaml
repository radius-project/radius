apiVersion: v1
kind: ConfigMap
metadata:
  name: controller-config
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: radius
data:
  controller-config.yaml: |-
    databaseProvider:
      provider: "apiserver"
      apiserver:
        context: ""
        namespace: "radius-system"

    secretProvider:
      provider: kubernetes

    queueProvider:
      provider: "apiserver"
      name: "controller"
      apiserver:
        context: ""
        namespace: "radius-system"

    profilerProvider:
      enabled: true
      port: 6060

    {{- include "radius.authz.ucpConnection" . | nindent 4 }}

    metricsProvider:
      enabled: true
      serviceName: "controller"
      prometheus:
        path: "/metrics"
        port: 9090

    workerServer:
      port: 3000

    logging:
      level: "info"
      json: true

    {{- with include "radius.authz.serverConfig" . | trim }}{{ . | nindent 4 }}{{- end }}

    {{- if and .Values.global.zipkin .Values.global.zipkin.url }}
    tracerProvider:
      enabled: true
      serviceName: "controller"
      zipkin:
        url: {{ .Values.global.zipkin.url }}
    {{- end }}
