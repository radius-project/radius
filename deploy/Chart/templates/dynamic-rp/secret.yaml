{{- $secret := lookup "v1" "Secret" .Release.Namespace "radius-encryption-key" -}}
{{- $keyStore := "" -}}
{{- $annotations := dict -}}
{{- if $secret -}}
  {{- $keyStore = required "existing Secret radius-encryption-key has no keys.json; refusing to generate replacement encryption keys" (index ($secret.data | default dict) "keys.json") -}}
  {{- $existingAnnotations := $secret.metadata.annotations | default dict -}}
  {{- if hasKey $existingAnnotations "radius.dev/last-rotation" -}}
    {{- $_ := set $annotations "radius.dev/last-rotation" (index $existingAnnotations "radius.dev/last-rotation") -}}
  {{- end -}}
{{- else -}}
  {{- $now := now -}}
  {{- $createdAt := $now | date "2006-01-02T15:04:05Z07:00" -}}
  {{- $expiresAt := dateModify "2160h" $now | date "2006-01-02T15:04:05Z07:00" -}}
  {{- $keyStore = dict "currentVersion" 1 "keys" (dict "1" (dict "key" (randBytes 32) "version" 1 "createdAt" $createdAt "expiresAt" $expiresAt)) | toJson | b64enc -}}
  {{- $_ := set $annotations "radius.dev/last-rotation" $createdAt -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: radius-encryption-key
  namespace: {{ .Release.Namespace }}
  {{- if $secret }}
  {{- /* Fail the apply if the Secret changed after lookup, so a key rotated mid-upgrade is never overwritten. */}}
  resourceVersion: {{ $secret.metadata.resourceVersion | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: dynamic-rp
    app.kubernetes.io/part-of: radius
  {{- with $annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  keys.json: {{ $keyStore | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radius-encryption-key-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dynamic-rp
    app.kubernetes.io/part-of: radius
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - radius-encryption-key
  verbs:
  - get
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radius-encryption-key-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dynamic-rp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radius-encryption-key-role
subjects:
- kind: ServiceAccount
  name: dynamic-rp
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: ucp
  namespace: {{ .Release.Namespace }}
