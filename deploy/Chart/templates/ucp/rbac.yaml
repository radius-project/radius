apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ucp
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - update

  - apiGroups:
      - ucp.dev
    resources:
      - resources
      - queuemessages
    verbs:
      - create
      - delete
      - get
      - list
      - update

  - apiGroups:
      - api.ucp.dev
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ucp
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ucp
subjects:
  - kind: ServiceAccount
    name: ucp
    namespace: {{ .Release.Namespace }}
---
# UCP records the status of the automatic SHA-256 migration in one ConfigMap in its own namespace, and holds one Lease
# so that one UCP replica migrates at a time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ucp-sha256-migration
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  # A create request carries no object name to authorize, so it cannot be limited by resourceNames.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create

  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - radius-sha256-migration
    verbs:
      - get
      - patch

  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create

  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - radius-sha256-migration-ucp
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ucp-sha256-migration
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ucp-sha256-migration
subjects:
  - kind: ServiceAccount
    name: ucp
    namespace: {{ .Release.Namespace }}
