apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ucp
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - update

  - apiGroups:
      - ucp.dev
    resources:
      - resources
      - queuemessages
    verbs:
      - create
      - delete
      - get
      - list
      - update

  - apiGroups:
      - api.ucp.dev
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ucp
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ucp
subjects:
  - kind: ServiceAccount
    name: ucp
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radius-ucp-authentication-reader-{{ .Release.Namespace }}
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["extension-apiserver-authentication"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radius-ucp-authentication-reader-{{ .Release.Namespace }}
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radius-ucp-authentication-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: ucp
    namespace: {{ .Release.Namespace }}
---
# UCP records the status of the automatic SHA-256 migration in one ConfigMap in its own namespace, and waits for the
# pods of other Radius releases to stop before it moves values: it compares the revision of the ReplicaSet of each pod
# of a component with the revision of the Deployment of the component.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ucp-sha256-migration
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  # A create request carries no object name to authorize, so it cannot be limited by resourceNames.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create

  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - radius-sha256-migration
    verbs:
      - get
      - patch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list

  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - ucp
      - applications-rp
      - dynamic-rp
    verbs:
      - get

  # The names of ReplicaSets are generated, so their reads cannot be limited by resourceNames.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ucp-sha256-migration
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ucp-sha256-migration
subjects:
  - kind: ServiceAccount
    name: ucp
    namespace: {{ .Release.Namespace }}
