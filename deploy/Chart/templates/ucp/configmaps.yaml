apiVersion: v1
kind: ConfigMap
metadata:
  name: ucp-config
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
data:
  ucp-config.yaml: |-
    # Radius configuration file.
    # See https://github.com/radius-project/radius/blob/main/docs/contributing/contributing-code/contributing-code-control-plane/configSettings.md for more information.
    environment:
      name: self-hosted
      roleLocation: "global"
    server:
      port: 9443
      pathBase: /apis/api.ucp.dev/v1alpha3
      tlsCertificateDirectory: /var/tls/cert
      {{- if ne (include "radius.authz.mode" .) "off" }}
      internalPort: 9444
      {{- end }}
    databaseProvider:
    {{- if .Values.database.enabled }}
      provider: "postgresql"
      postgresql:
        url: "postgresql://ucp:${POSTGRES_PASSWORD}@database.{{ .Release.Namespace }}:5432/ucp?sslmode=disable"
    {{- else }}
      provider: "apiserver"
      apiserver:
        context: ""
        namespace: "radius-system"
    {{- end }}

    secretProvider:
      provider: kubernetes

    queueProvider:
      provider: "apiserver"
      name: "ucp"
      apiserver:
        context: ""
        namespace: "radius-system"

    profilerProvider:
      enabled: true
      port: 6060
    initialization:
      planes:
        - id: "/planes/radius/local"
          properties:
            resourceProviders:
              Applications.Core: "http://applications-rp.radius-system:5443"
              Radius.Core: "http://applications-rp.radius-system:5443"
              Applications.Dapr: "http://applications-rp.radius-system:5443"
              Applications.Datastores: "http://applications-rp.radius-system:5443"
              Applications.Messaging: "http://applications-rp.radius-system:5443"
              Microsoft.Resources: "http://bicep-de.radius-system:6443"
            kind: "UCPNative"
        - id: "/planes/aws/aws"
          properties:
            kind: "AWS"
      manifestDirectory: "/manifest/built-in-providers"

    identity:
      authMethod: UCPCredential
    {{- if .Values.rbac.enabled }}
    {{- if eq (include "radius.authz.mode" .) "off" }}
    {{- fail "rbac.enabled requires internal authorization (global.rbac)" }}
    {{- end }}
    userAuthorization:
      enabled: true
      kubernetesIssuer: {{ required "rbac.kubernetesIssuer must identify this cluster" .Values.rbac.kubernetesIssuer | quote }}
      acceptIncompleteHistory: {{ .Values.rbac.acceptIncompleteHistory }}
    {{- end }}
    {{- with dig "workerServer" "dequeueInterval" "" .Values.ucp }}

    workerServer:
      dequeueInterval: {{ . | quote }}
    {{- end }}

    ucp:
      kind: kubernetes
    
    routing:
      defaultDownstreamEndpoint: "http://dynamic-rp.radius-system:8082"

    metricsProvider:
      enabled: true
      serviceName: "ucp"
      prometheus:
        path: "/metrics"
        port: 9090

    logging:
      level: "info"
      json: true

    {{- with include "radius.authz.serverConfig" . | trim }}{{ . | nindent 4 }}{{- end }}

    {{- if and .Values.global.zipkin .Values.global.zipkin.url }}
    tracerProvider:
      enabled: true
      serviceName: "ucp"
      zipkin: 
        url: {{ .Values.global.zipkin.url }}
    {{- end }}
