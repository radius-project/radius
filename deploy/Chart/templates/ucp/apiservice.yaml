{{- $authz := ne (include "radius.authz.mode" .) "off" }}
{{- $caBundle := "" }}
{{- if $authz }}
# cert-manager issues UCP's aggregated API certificate from radius-apiserver-issuer, and its CA
# injector copies that CA into the APIService caBundle. UCP reloads the certificate when it rotates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ucp-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ include "radius.ucp.apiServerSecretName" . }}
  # 90 days, renewed at two-thirds of its lifetime.
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  # The Kubernetes API server verifies the name of the Service the APIService points to.
  dnsNames:
    - ucp.{{ .Release.Namespace }}.svc
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-apiserver-issuer
{{- else }}
{{- $ca := genCA "ucp-ca" 3650 }}
{{- $cn := printf "ucp" }}
{{- $altName1 := printf "ucp.%s" .Release.Namespace }}
{{- $altName2 := printf "ucp.%s.svc" .Release.Namespace }}
{{- $altName3 := printf "ucp.%s.svc.cluster" .Release.Namespace }}
{{- $altName4 := printf "ucp.%s.svc.cluster.local" .Release.Namespace }}
{{- $cert := genSignedCert $cn nil (list $altName1 $altName2 $altName3 $altName4) 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: ucp-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
data:
  tls.crt: {{ include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "tls.crt" "defaultValue" $cert.Cert) }}
  tls.key: {{ include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "tls.key" "defaultValue" $cert.Key) }}
{{- $caBundle = include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "ca.crt" "defaultValue" $ca.Cert) }}
  ca.crt: {{ $caBundle }}
{{- end }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha3.api.ucp.dev
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
  {{- if $authz }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/ucp-cert
  {{- end }}
spec:
  group: api.ucp.dev
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: ucp
    namespace: {{ .Release.Namespace }}
  version: v1alpha3
  {{- if not $authz }}
  caBundle: {{ $caBundle }}
  {{- end }}
