{{- $authz := ne (include "radius.authz.mode" .) "off" }}
{{- $caBundle := "" }}
{{- $caSource := "radius-apiserver-trust" }}
{{- if $authz }}
# The APIService trusts the selected CA source, never this leaf Secret's ca.crt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ucp-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ include "radius.ucp.apiServerSecretName" . }}
  # Marks the Secret as this release's, so rad deletes it only for this release once this Certificate is gone.
  secretTemplate:
    annotations:
      {{- include "radius.ucp.issuedSecretAnnotations" . | nindent 6 }}
  # 24 hours, renewed at two-thirds of its lifetime.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  # The Kubernetes API server verifies the name of the Service the APIService points to.
  dnsNames:
    - ucp.{{ .Release.Namespace }}.svc
  issuerRef:
    {{- include "radius.authz.certificates.issuer" (dict "root" . "plane" "aggregation") | fromJson | toYaml | nindent 4 }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "aggregation") | fromJson }}
{{- $caSource = $source.name }}
{{- $caBundle = $source.bundle | b64enc }}
{{- if eq (include "radius.authz.certificates.mode" .) "selfSigned" }}
{{- $trust := lookup "v1" "Secret" .Release.Namespace "radius-apiserver-trust" }}
{{- $trustData := dig "data" dict $trust }}
{{- $trustAnnotations := dig "metadata" "annotations" dict $trust }}
{{- $trustOwned := and (lookup "apiregistration.k8s.io/v1" "APIService" "" "v1alpha3.api.ucp.dev") (eq (get $trustAnnotations "cert-manager.io/allow-direct-injection") "true") (eq (get $trustAnnotations "radapp.io/release-name") .Release.Name) (eq (get $trustAnnotations "radapp.io/release-namespace") .Release.Namespace) (eq (len $trustData) 1) (dig "ca.crt" "" $trustData) }}
{{- /* A transient overlap keeps the old serving CA trusted until UCP rolls out.
Mode-annotated public sources are lifecycle pins, never transient overlap. */}}
{{- if and $trustOwned (not (hasKey $trustAnnotations "radius.io/certificate-mode")) }}
{{- $caSource = "radius-apiserver-trust" }}
{{- $caBundle = index $trustData "ca.crt" }}
{{- end }}
{{- end }}
{{- else }}
{{- $ca := genCA "ucp-ca" 3650 }}
{{- $cn := printf "ucp" }}
{{- $altName1 := printf "ucp.%s" .Release.Namespace }}
{{- $altName2 := printf "ucp.%s.svc" .Release.Namespace }}
{{- $altName3 := printf "ucp.%s.svc.cluster" .Release.Namespace }}
{{- $altName4 := printf "ucp.%s.svc.cluster.local" .Release.Namespace }}
{{- $cert := genSignedCert $cn nil (list $altName1 $altName2 $altName3 $altName4) 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: ucp-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
data:
  tls.crt: {{ include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "tls.crt" "defaultValue" $cert.Cert) }}
  tls.key: {{ include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "tls.key" "defaultValue" $cert.Key) }}
{{- $caBundle = include "secrets.lookup" (dict "secret" "ucp-cert" "namespace" .Release.Namespace "key" "ca.crt" "defaultValue" $ca.Cert) }}
  ca.crt: {{ $caBundle }}
{{- end }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha3.api.ucp.dev
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
  {{- if $authz }}
  annotations:
    cert-manager.io/inject-ca-from-secret: {{ .Release.Namespace }}/{{ $caSource }}
  {{- end }}
spec:
  group: api.ucp.dev
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: ucp
    namespace: {{ .Release.Namespace }}
  version: v1alpha3
  {{- if $caBundle }}
  caBundle: {{ $caBundle }}
  {{- end }}
