apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ucp-inspection
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
rules:
  - apiGroups:
      - api.ucp.dev
    resources:
      - providers/whoAmI
    resourceNames:
      - Radius.Core
    verbs:
      - get
  # Kubernetes classifies this read-only POST as create, like an access review.
  # Do not grant planes/local: it also covers ordinary plane resource writes.
  - apiGroups:
      - api.ucp.dev
    resources:
      - providers/checkAccess
    resourceNames:
      - Radius.Core
    verbs:
      - create
