{{- $rotation := include "radius.rotationSnapshot" (dict "root" . "apiVersion" "v1" "kind" "Service" "name" "ucp") | mustFromJson }}
apiVersion: v1
kind: Service
metadata:
  name: ucp
  namespace: "{{ .Release.Namespace }}"
  {{- include "radius.rotationMetadata" $rotation | nindent 2 }}
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
spec:
  ports:
    - port: 443
      name: https
      protocol: TCP
      targetPort: 9443
    {{- if ne (include "radius.authz.mode" .) "off" }}
    # Internal component traffic uses mTLS on a separate port. The aggregation
    # endpoint above and its certificate are unchanged.
    - port: 9444
      name: internal
      protocol: TCP
      targetPort: 9444
    {{- end }}
  selector:
      {{- if $rotation.state }}
      {{- toYaml $rotation.state.plan.serviceSelector | nindent 6 }}
      {{- else }}
      app.kubernetes.io/name: ucp
      {{- end }}
