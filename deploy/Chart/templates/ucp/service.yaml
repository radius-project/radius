apiVersion: v1
kind: Service
metadata:
  name: ucp
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: ucp
    app.kubernetes.io/part-of: radius
spec:
  ports:
    - port: 443
      name: https
      protocol: TCP
      targetPort: 9443
    {{- if ne (include "radius.authz.mode" .) "off" }}
    # Internal component traffic uses mTLS on a separate port. The aggregation
    # endpoint above and its certificate are unchanged.
    - port: 9444
      name: internal
      protocol: TCP
      targetPort: 9444
    {{- end }}
  selector:
      app.kubernetes.io/name: ucp
