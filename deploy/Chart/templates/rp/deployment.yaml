{{- $appversion := include "radius.versiontag" . }}
{{- if ne .Values.rp.terraform.path "/terraform" }}
{{- fail "rp.terraform.path must be \"/terraform\" -- the runtime configmap (deploy/Chart/templates/rp/configmaps.yaml) and pkg/recipes/terraform/install.go both hard-code /terraform, so overriding the mount path produces an inconsistent deployment and silently breaks Terraform execution/caching." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: applications-rp
    app.kubernetes.io/name: applications-rp
    app.kubernetes.io/part-of: radius
  name: applications-rp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
     app.kubernetes.io/name: applications-rp
  template:
    metadata:
      labels:
        control-plane: applications-rp
        app.kubernetes.io/name: applications-rp
        app.kubernetes.io/part-of: radius
        {{- if eq .Values.global.azureWorkloadIdentity.enabled true }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if eq .Values.global.prometheus.enabled true }}
      annotations:
        prometheus.io/path: "{{ .Values.global.prometheus.path }}"
        prometheus.io/port: "{{ .Values.global.prometheus.port }}"
        prometheus.io/scrape: "{{ .Values.global.prometheus.enabled }}"
      {{- end }}
    spec:
      serviceAccountName: applications-rp
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 6 }}
      {{- end }}
      {{- $terraformInit := eq .Values.global.terraform.enabled true }}
      {{- if or $terraformInit .Values.global.appendRootCA.cert }}
      initContainers:
      {{- if .Values.global.appendRootCA.cert }}
      - name: append-root-ca
        image: "{{ .Values.rp.image }}:{{ .Values.rp.tag | default $appversion }}"
        command:
        - sh
        - -c
        - |
          mkdir -p /etc/radius-ssl/certs
          cp /etc/ssl/certs/* /etc/radius-ssl/certs/
          cat >> /etc/radius-ssl/certs/ca-certificates.crt <<'CERTEOF'
        {{ .Values.global.appendRootCA.cert | nindent 10 }}
          CERTEOF
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/radius-ssl/certs
      {{- end }}
      {{- if $terraformInit }}
      {{- include "radius.terraform.initContainer" (dict "root" . "path" .Values.rp.terraform.path) | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      - name: applications-rp
        image: "{{ include "radius.image" (dict "image" .Values.rp.image "tag" (.Values.rp.tag | default .Values.global.imageTag | default $appversion) "global" .Values.global) }}"
        args:
        - --config-file=/etc/config/radius-self-host.yaml
        env:
        {{- if .Values.database.enabled }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: POSTGRES_PASSWORD
        {{- end }}
        {{- include "radius.terraform.env" . | nindent 8 }}
        - name: SKIP_ARM
          value: 'false'
        - name: ARM_AUTH_METHOD
          value: 'UCPCredential'
        - name: RADIUS_ENV
          value: 'self-hosted'
        - name: K8S_CLUSTER
          value: 'true'
        {{- if .Values.rp.publicEndpointOverride}}
        - name: RADIUS_PUBLIC_ENDPOINT_OVERRIDE
          value: {{ .Values.rp.publicEndpointOverride }}
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.sslCertDirEnvVar }}
          value: {{ .Values.global.rootCA.mountPath }}
        {{- end}}
        {{- include "radius.targetCluster.env" . | nindent 8 }}
        ports:
        - containerPort: 5443
          name: applications-rp
          protocol: TCP
        - containerPort: 5444
          name: app-pr-rp
          protocol: TCP
        {{- if eq .Values.global.prometheus.enabled true }}
        - containerPort: {{ .Values.global.prometheus.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: applications-rp
          # Probe frequently so the pod becomes ready shortly after the API starts serving,
          # which shortens install time without hiding a slow or failed startup.
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 8
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        {{- if eq .Values.global.aws.irsa.enabled true }}
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
        {{- end }}
        - name: terraform
          mountPath: {{ .Values.rp.terraform.path }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          mountPath: {{ .Values.global.rootCA.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}
        {{- include "radius.targetCluster.volumeMount" . | nindent 8 }}
        {{- if .Values.rp.resources }}
        resources:{{ toYaml .Values.rp.resources | nindent 10 }}
        {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: applications-rp-config
        {{- if eq .Values.global.aws.irsa.enabled true }}
        - name: aws-iam-token
          projected:
            sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 86400
                audience: "sts.amazonaws.com"
        {{- end }}
        - name: terraform
          emptyDir: {}
        {{- if $terraformInit }}
        # Scratch space for the terraform-init container, since its root filesystem is read-only.
        - name: terraform-init-tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if .Values.global.rootCA.cert }}
        - name: {{ .Values.global.rootCA.volumeName }}
          secret:
            secretName: {{ .Values.global.rootCA.secretName }}
        {{- end }}
        {{- if .Values.global.appendRootCA.cert }}
        - name: ssl-certs
          emptyDir: {}
        {{- end }}
        {{- include "radius.targetCluster.volume" . | nindent 8 }}
