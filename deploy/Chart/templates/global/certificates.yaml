{{- include "radius.authz.validateSecretNames" . }}
{{- if ne (include "radius.authz.mode" .) "off" }}
{{- include "radius.authz.certificates.validate" . }}
{{- $certificates := .Values.global.rbac.certificates | default dict }}
{{- $mode := include "radius.authz.certificates.mode" . }}
{{- $ns := .Release.Namespace }}
{{- if eq $mode "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
{{- end }}
{{- if eq (include "radius.authz.tls.provider" .) "radius" }}
{{- if eq $mode "selfSigned" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
{{- end }}
{{- if ne $mode "issuerRef" }}
---
# Signs only the "<receiver>-spiffe" server certificates below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-ca{{ end }}
{{- end }}
{{- $trustDomain := include "radius.authz.spiffe.trustDomain" . }}
{{- range $receiver := include "radius.authz.certificates.receivers" . | fromJsonArray }}
---
# Server certificate for internal calls to {{ $receiver }}. Its only SAN is the SPIFFE ID of the
# {{ $receiver }} ServiceAccount, which callers verify. The pod mounts Secret {{ $receiver }}-spiffe
# read-only. cert-manager requests these certificates; the earlier receiver CertificateRequest
# grant is removed. Existing privileges (bicep-de's cluster-admin and UCP/RP Secret access)
# remain until the control-plane isolation work.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $receiver }}-spiffe
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $receiver }}
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ $receiver }}-spiffe
  # 24 hours, renewed at two-thirds of its lifetime.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  uris:
    - spiffe://{{ $trustDomain }}/ns/{{ $ns }}/sa/{{ $receiver }}
  issuerRef:
    {{- include "radius.authz.certificates.issuer" (dict "root" $ "plane" "internal") | fromJson | toYaml | nindent 4 }}
{{- end }}
{{- end }}
{{- if eq $mode "selfSigned" }}
---
# selfSigned keeps aggregation independent of the internal SPIFFE CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-apiserver-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-apiserver-ca
  secretName: radius-apiserver-ca
  secretTemplate:
    annotations:
      cert-manager.io/allow-direct-injection: "true"
  # 1 year, renewed at two-thirds of its lifetime, keeping the key like radius-ca.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
{{- end }}
{{- if ne $mode "issuerRef" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-apiserver-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-apiserver-ca{{ end }}
{{- end }}
{{- if and (ne $mode "selfSigned") (eq (include "radius.authz.tls.provider" .) "radius") }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "internal") | fromJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radius-mtls-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
data:
  ca.crt: {{ $source.bundle | toJson }}
{{- end }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "aggregation") | fromJson }}
{{- if and $source.bundle (ne $mode "selfSigned") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: radius-apiserver-trust
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    cert-manager.io/allow-direct-injection: "true"
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
    {{- if eq $mode "issuerRef" }}
    radius.io/issuer-ref: {{ $source.issuer | toJson | quote }}
    {{- end }}
type: Opaque
data:
  ca.crt: {{ $source.bundle | b64enc | quote }}
{{- end }}
{{- end }}
