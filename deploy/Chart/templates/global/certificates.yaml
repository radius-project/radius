{{- $lifecycle := include "radius.lifecycleSnapshot" . | mustFromJson }}
{{- include "radius.initialCertificateGuard" . }}
{{- if and $lifecycle (eq (include "radius.authz.mode" .) "off") }}
{{- fail "Authorization Off after a CA lifecycle requires a guarded lifecycle transition." }}
{{- end }}
{{- if ne (include "radius.authz.mode" .) "off" }}
{{- include "radius.authz.certificates.validate" . }}
{{- $certificates := .Values.global.rbac.certificates | default dict }}
{{- $mode := include "radius.authz.certificates.mode" . }}
{{- $ns := .Release.Namespace }}
{{- $planned := include "radius.lifecycleResourceNames" . | mustFromJson }}
{{- if and (eq $mode "selfSigned") (not (hasKey $planned "Issuer/radius-selfsigned-bootstrap")) }}
{{ include "radius.authz.certificates.bootstrapIssuer" . }}
{{- end }}
{{- if eq (include "radius.authz.tls.provider" .) "radius" }}
{{- if eq $mode "selfSigned" }}
---
{{ include "radius.authz.certificates.root" (dict "root" . "name" "radius-ca") }}
{{- end }}
{{- if and (ne $mode "issuerRef") (not (hasKey $planned "Issuer/radius-ca-issuer")) }}
---
# Signs only the csi-driver-spiffe server certificates; Radius's csi-driver-spiffe approver is the
# only approver allowed to approve its requests.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if $lifecycle }}{{ $lifecycle.internal.signingSecret | quote }}{{ else if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-ca{{ end }}
{{- end }}
{{- end }}
{{- if eq $mode "selfSigned" }}
---
{{ include "radius.authz.certificates.root" (dict "root" . "name" "radius-apiserver-ca") }}
{{- end }}
{{- if and (ne $mode "issuerRef") (not (hasKey $planned "Issuer/radius-apiserver-issuer")) }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-apiserver-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if $lifecycle }}{{ $lifecycle.aggregation.signingSecret | quote }}{{ else if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-apiserver-ca{{ end }}
{{- end }}
{{ include "radius.lifecycleResources" . }}
{{- if and (or $lifecycle (ne $mode "selfSigned")) (eq (include "radius.authz.tls.provider" .) "radius") }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "internal") | fromJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radius-mtls-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
    {{- if $source.bootstrapUID }}
    radius.io/certificate-bootstrap: {{ $source.bootstrapUID | quote }}
    {{- end }}
    {{- if $source.journalUID }}
    radius.io/trust-journal-uid: {{ $source.journalUID | quote }}
    radius.io/trust-revision: {{ $source.revision | quote }}
    {{- end }}
data:
  ca.crt: {{ $source.bundle | toJson }}
{{- end }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "aggregation") | fromJson }}
{{- if $source.bundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: radius-apiserver-trust
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    cert-manager.io/allow-direct-injection: "true"
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
    {{- if $source.bootstrapUID }}
    radius.io/certificate-bootstrap: {{ $source.bootstrapUID | quote }}
    {{- end }}
    {{- if $source.journalUID }}
    radius.io/trust-journal-uid: {{ $source.journalUID | quote }}
    radius.io/trust-revision: {{ $source.revision | quote }}
    {{- end }}
type: Opaque
data:
  ca.crt: {{ $source.bundle | b64enc | quote }}
{{- end }}
{{- end }}
