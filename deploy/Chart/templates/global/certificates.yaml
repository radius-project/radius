{{- if ne (include "radius.authz.mode" .) "off" }}
{{- include "radius.authz.certificates.validate" . }}
{{- $certificates := .Values.global.rbac.certificates | default dict }}
{{- $mode := include "radius.authz.certificates.mode" . }}
{{- $ns := .Release.Namespace }}
{{- if eq $mode "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
{{- end }}
{{- if eq (include "radius.authz.tls.provider" .) "radius" }}
{{- if eq $mode "selfSigned" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
{{- end }}
{{- if ne $mode "issuerRef" }}
---
# Signs only the csi-driver-spiffe server certificates; Radius's csi-driver-spiffe approver is the
# only approver allowed to approve its requests.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-ca{{ end }}
{{- end }}
{{- end }}
{{- if eq $mode "selfSigned" }}
---
# selfSigned keeps aggregation independent of the internal SPIFFE CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-apiserver-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-apiserver-ca
  secretName: radius-apiserver-ca
  # 1 year, renewed at two-thirds of its lifetime, keeping the key like radius-ca.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
{{- end }}
{{- if ne $mode "issuerRef" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-apiserver-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ if eq $mode "caSecret" }}{{ $certificates.caSecret | quote }}{{ else }}radius-apiserver-ca{{ end }}
{{- end }}
{{- if and (ne $mode "selfSigned") (eq (include "radius.authz.tls.provider" .) "radius") }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "internal") | fromJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radius-mtls-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
data:
  ca.crt: {{ $source.bundle | toJson }}
{{- end }}
{{- $source := include "radius.authz.certificates.publicSource" (dict "root" . "plane" "aggregation") | fromJson }}
{{- if $source.bundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: radius-apiserver-trust
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
  annotations:
    cert-manager.io/allow-direct-injection: "true"
    helm.sh/resource-policy: keep
    radius.io/certificate-mode: {{ $mode | quote }}
type: Opaque
data:
  ca.crt: {{ $source.bundle | b64enc | quote }}
{{- end }}
{{- end }}
