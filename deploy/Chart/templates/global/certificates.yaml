{{- include "radius.authz.validateSecretNames" . }}
{{- if ne (include "radius.authz.mode" .) "off" }}
{{- $certificates := ((.Values.global.rbac).certificates) | default dict }}
{{- $mode := "selfSigned" }}
{{- if hasKey $certificates "mode" }}
{{- $mode = toString $certificates.mode }}
{{- end }}
{{- /* Bring-your-own CA modes are not implemented yet; reject them rather than silently creating a Radius CA. */}}
{{- if has $mode (list "caSecret" "issuerRef") }}
{{- fail (printf "global.rbac.certificates.mode=%s is not supported yet. Use selfSigned." $mode) }}
{{- else if ne $mode "selfSigned" }}
{{- fail (printf "global.rbac.certificates.mode=%q is not valid. Use selfSigned." $mode) }}
{{- end }}
{{- $ns := .Release.Namespace }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
{{- if eq (include "radius.authz.tls.provider" .) "radius" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
# Signs only the "<receiver>-spiffe" server certificates below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: radius-ca
{{- $trustDomain := include "radius.authz.spiffe.trustDomain" . }}
{{- range $receiver := include "radius.authz.spiffe.receivers" . | fromJsonArray }}
---
# Server certificate for internal calls to {{ $receiver }}. Its only SAN is the SPIFFE ID of the
# {{ $receiver }} ServiceAccount, which callers verify. The pod mounts Secret {{ $receiver }}-spiffe
# read-only. cert-manager requests these certificates; the earlier receiver CertificateRequest
# grant is removed. Existing privileges (bicep-de's cluster-admin and UCP/RP Secret access)
# remain until the control-plane isolation work.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $receiver }}-spiffe
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $receiver }}
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ $receiver }}-spiffe
  # 24 hours, renewed at two-thirds of its lifetime.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  uris:
    - spiffe://{{ $trustDomain }}/ns/{{ $ns }}/sa/{{ $receiver }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-ca-issuer
{{- end }}
{{- end }}
---
# UCP's aggregated API certificate has its own CA, independent of global.rbac.certificates.mode.
# Only the Kubernetes API server trusts it (through the APIService caBundle); no Radius component
# mounts it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-apiserver-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-apiserver-ca
  secretName: radius-apiserver-ca
  # Lets cert-manager's cainjector copy ca.crt, this self-signed CA certificate, into UCP's APIService.
  secretTemplate:
    annotations:
      cert-manager.io/allow-direct-injection: "true"
  # 1 year, renewed at two-thirds of its lifetime, keeping the key like radius-ca.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-apiserver-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: radius-apiserver-ca
{{- end }}
