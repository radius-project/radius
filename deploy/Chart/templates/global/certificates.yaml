{{- if ne (include "radius.authz.mode" .) "off" }}
{{- $certificates := ((.Values.global.rbac).certificates) | default dict }}
{{- $mode := "selfSigned" }}
{{- if hasKey $certificates "mode" }}
{{- $mode = toString $certificates.mode }}
{{- end }}
{{- if has $mode (list "caSecret" "issuerRef") }}
{{- fail (printf "global.rbac.certificates.mode=%s is not supported yet. Use selfSigned." $mode) }}
{{- else if ne $mode "selfSigned" }}
{{- fail (printf "global.rbac.certificates.mode=%q is not valid. Use selfSigned." $mode) }}
{{- end }}
{{- $ns := .Release.Namespace }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
# Signs only the csi-driver-spiffe server certificates; Radius's csi-driver-spiffe approver is the
# only approver allowed to approve its requests.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: radius-ca
---
# UCP's aggregated API certificate has its own CA, independent of global.rbac.certificates.mode.
# Only the Kubernetes API server trusts it (through the APIService caBundle); no Radius component
# mounts it. cert-manager's default approver approves its requests; it must not approve requests
# for radius-ca-issuer, which only Radius's csi-driver-spiffe approver approves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-apiserver-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-apiserver-ca
  secretName: radius-apiserver-ca
  # 1 year, renewed at two-thirds of its lifetime, keeping the key like radius-ca.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-apiserver-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: radius-apiserver-ca
{{- end }}
