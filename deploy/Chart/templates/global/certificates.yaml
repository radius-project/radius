{{- $journalPresent := lookup "v1" "ConfigMap" .Release.Namespace "radius-ca-rotation" }}
{{- if and $journalPresent (eq (include "radius.authz.provider" .) "external") }}
{{- fail "external provider cannot use an existing CA rotation journal; managed rotation and provider transitions require separate supported workflows" }}
{{- end }}
{{- if and (eq (include "radius.authz.provider" .) "radius") (or $journalPresent (ne (include "radius.authz.mode" .) "off")) }}
{{- $objects := dict }}
{{- $provider := default "radius" ((.Values.global.rbac.mtls | default dict).provider) }}
{{- if ne $provider "external" }}
{{- range $component := list "ucp" "applications-rp" "dynamic-rp" "controller" "bicep-de" }}
{{- $_ := set $objects $component (lookup "cert-manager.io/v1" "Certificate" $.Release.Namespace (printf "%s-cert" $component)) }}
{{- end }}
{{- end }}
{{- $issuerObject := lookup "cert-manager.io/v1" "Issuer" .Release.Namespace "radius-ca-issuer" }}
{{- $caObject := lookup "cert-manager.io/v1" "Certificate" .Release.Namespace "radius-ca" }}
{{- $trustObject := lookup "v1" "ConfigMap" .Release.Namespace "radius-mtls-ca" }}
{{- $rotation := include "radius.rotationState" . | mustFromJson }}
{{- $certificates := ((.Values.global.rbac).certificates) | default dict }}
{{- $mode := "selfSigned" }}
{{- if hasKey $certificates "mode" }}
{{- $mode = toString $certificates.mode }}
{{- end }}
{{- if eq $mode "issuerRef" }}
{{- if $certificates.caSecret -}}{{- fail "issuerRef must not specify caSecret; its private key stays with the existing issuer." -}}{{- end }}
{{- include "radius.authz.issuerPolicy.validate" . }}
{{- else if not (has $mode (list "selfSigned" "caSecret")) }}
{{- fail (printf "global.rbac.certificates.mode=%q is not valid. Use selfSigned, caSecret or issuerRef." $mode) }}
{{- end }}
{{- if $rotation }}
{{- if ne $mode $rotation.plan.targetMode }}
{{- fail "Certificate mode differs from the completed CA rotation; use coordinated rotation rather than overriding its trust." }}
{{- end }}
{{- if and (eq $mode "caSecret") (or (ne $certificates.caSecret $rotation.plan.signingSecret) (ne (trim $certificates.caBundle) (trim (b64dec $rotation.newCA)))) }}
{{- fail "Certificate settings differ from the completed CA rotation; retry its retire phase to record final settings." }}
{{- end }}
{{- if eq $mode "issuerRef" }}
{{- $pinned := $rotation.plan.externalIssuer }}
{{- if or (not $pinned) (ne $certificates.issuerRef.group $pinned.group) (ne $certificates.issuerRef.kind $pinned.kind) (ne $certificates.issuerRef.name $pinned.name) (ne (trim $certificates.caBundle) (trim (b64dec $rotation.newCA))) (ne (toJson $certificates.requestPolicy) (toJson $pinned.requestPolicy)) }}
{{- fail "Issuer, public trust or policy references differ from the completed CA rotation; use a coordinated transaction." }}
{{- end }}
{{- $issuerNamespace := .Release.Namespace }}
{{- if eq $pinned.kind "ClusterIssuer" }}{{- $issuerNamespace = "" }}{{- end }}
{{- $liveIssuer := lookup "cert-manager.io/v1" $pinned.kind $issuerNamespace $pinned.name }}
{{- if or (ne (dig "metadata" "uid" "" $liveIssuer) $pinned.uid) (dig "metadata" "deletionTimestamp" "" $liveIssuer) (ne (sha256sum (toJson $liveIssuer.spec)) $pinned.specSHA256) }}
{{- fail "Completed CA rotation issuer identity or specification changed; recover its pinned transaction before rendering." }}
{{- end }}
{{- end }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $caSecret := "radius-ca" }}
{{- if eq $mode "caSecret" }}
{{- if not (kindIs "string" $certificates.caSecret) }}
{{- fail "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace." }}
{{- end }}
{{- $caSecret = $certificates.caSecret }}
{{- if or (gt (len $caSecret) 253) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$` $caSecret)) }}
{{- fail "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace." }}
{{- end }}
{{- if has $caSecret (list "radius-ca" "ucp-cert" "ucp-mtls" "applications-rp-mtls" "dynamic-rp-mtls" "controller-mtls" "bicep-de-mtls") }}
{{- fail "global.rbac.certificates.caSecret must not name a Radius-managed certificate Secret. Use a separate operator-owned signing Secret." }}
{{- end }}
{{- end }}
{{- if has $mode (list "caSecret" "issuerRef") }}
{{- if not (kindIs "string" $certificates.caBundle) }}
{{- fail "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain." }}
{{- end }}
{{- if not (regexMatch `^-----BEGIN CERTIFICATE-----\r?\n[A-Za-z0-9+/=\r\n]+-----END CERTIFICATE-----\s*$` (trim $certificates.caBundle)) }}
{{- fail "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain." }}
{{- end }}
{{- else if or $certificates.caSecret $certificates.caBundle }}
{{- fail "global.rbac.certificates.caSecret and caBundle require mode=caSecret." }}
{{- end }}
{{- $issuer := dict "group" "cert-manager.io" "kind" "Issuer" "name" "radius-ca-issuer" }}
{{- if eq $mode "issuerRef" }}{{- $issuer = $certificates.issuerRef }}{{- end }}
{{- if $rotation }}
{{- if eq $mode "issuerRef" }}
{{- $issuer = dict "group" $rotation.plan.externalIssuer.group "kind" $rotation.plan.externalIssuer.kind "name" $rotation.plan.externalIssuer.name }}
{{- else }}
{{- $issuer = dict "group" "cert-manager.io" "kind" "Issuer" "name" $rotation.plan.issuer }}
{{- end }}
{{- end }}
{{- if eq $mode "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  {{- include "radius.rotationMetadata" (dict "object" $caObject "state" $rotation) | nindent 2 }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: radius-mtls-ca
  namespace: {{ $ns }}
  {{- include "radius.rotationMetadata" (dict "object" $trustObject "state" $rotation) | nindent 2 }}
  labels:
    app.kubernetes.io/part-of: radius
data:
  ca.crt: |
{{ trim $certificates.caBundle | indent 4 }}
---
{{- end }}
{{- if ne $mode "issuerRef" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  {{- include "radius.rotationMetadata" (dict "object" $issuerObject "state" $rotation) | nindent 2 }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ $caSecret | quote }}
---
{{- end }}
{{- if ne $provider "external" }}
{{- range $i, $component := list "ucp" "applications-rp" "dynamic-rp" "controller" "bicep-de" }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $component }}-cert
  namespace: {{ $ns }}
  {{- include "radius.rotationMetadata" (dict "object" (index $objects $component) "state" $rotation) | nindent 2 }}
  labels:
    app.kubernetes.io/name: {{ $component }}
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ $component }}-mtls
  # 24 hours, renewed at two-thirds of its lifetime.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
    - client auth
  # One SAN for compatibility with future CA name constraints on <namespace>.svc.
  dnsNames:
    - {{ $component }}.{{ $ns }}.svc
  issuerRef:
    {{- toYaml $issuer | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
