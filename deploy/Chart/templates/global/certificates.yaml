{{- if ne (include "radius.authz.mode" .) "off" }}
{{- $certificates := ((.Values.global.rbac).certificates) | default dict }}
{{- $mode := "selfSigned" }}
{{- if hasKey $certificates "mode" }}
{{- $mode = toString $certificates.mode }}
{{- end }}
{{- if eq $mode "issuerRef" }}
{{- fail "global.rbac.certificates.mode=issuerRef requires verified certificate request policy protection: a running approver-policy controller, disabled default auto-approval, and an effective identity- and issuer-scoped policy. Install/upgrade preflight enforcement is not available yet; issuerRef remains disabled. Use selfSigned or caSecret." }}
{{- else if not (has $mode (list "selfSigned" "caSecret")) }}
{{- fail (printf "global.rbac.certificates.mode=%q is not valid. Use selfSigned or caSecret." $mode) }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $caSecret := "radius-ca" }}
{{- if eq $mode "caSecret" }}
{{- if not (kindIs "string" $certificates.caSecret) }}
{{- fail "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace." }}
{{- end }}
{{- $caSecret = $certificates.caSecret }}
{{- if or (gt (len $caSecret) 253) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$` $caSecret)) }}
{{- fail "global.rbac.certificates.caSecret must be the name of an existing operator-owned TLS Secret in the release namespace." }}
{{- end }}
{{- if has $caSecret (list "radius-ca" "ucp-cert" "ucp-mtls" "applications-rp-mtls" "dynamic-rp-mtls" "controller-mtls" "bicep-de-mtls") }}
{{- fail "global.rbac.certificates.caSecret must not name a Radius-managed certificate Secret. Use a separate operator-owned signing Secret." }}
{{- end }}
{{- if not (kindIs "string" $certificates.caBundle) }}
{{- fail "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain." }}
{{- end }}
{{- if not (regexMatch `^-----BEGIN CERTIFICATE-----\r?\n[A-Za-z0-9+/=\r\n]+-----END CERTIFICATE-----\s*$` (trim $certificates.caBundle)) }}
{{- fail "global.rbac.certificates.caBundle must contain exactly one public dedicated CA certificate in PEM format, not a private key or organization chain." }}
{{- end }}
{{- else if or $certificates.caSecret $certificates.caBundle }}
{{- fail "global.rbac.certificates.caSecret and caBundle require mode=caSecret." }}
{{- end }}
{{- if eq $mode "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-selfsigned-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radius-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  isCA: true
  commonName: radius-ca
  secretName: radius-ca
  # 1 year, renewed at two-thirds of its lifetime. Renewal keeps the CA key so certificates
  # already issued stay valid; replacing the key needs coordinated CA rotation.
  duration: 8760h
  renewBefore: 2920h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-selfsigned-bootstrap
---
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: radius-mtls-ca
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
data:
  ca.crt: |
{{ trim $certificates.caBundle | indent 4 }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: radius-ca-issuer
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: radius
spec:
  ca:
    secretName: {{ $caSecret | quote }}
{{- range $component := list "ucp" "applications-rp" "dynamic-rp" "controller" "bicep-de" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $component }}-cert
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $component }}
    app.kubernetes.io/part-of: radius
spec:
  secretName: {{ $component }}-mtls
  # 24 hours, renewed at two-thirds of its lifetime.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
    - client auth
  # One SAN for compatibility with future CA name constraints on <namespace>.svc.
  dnsNames:
    - {{ $component }}.{{ $ns }}.svc
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: radius-ca-issuer
{{- end }}
{{- end }}
