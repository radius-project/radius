# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: __publish-bicep-types

on:
  workflow_call:
    outputs:
      status:
        value: ${{ jobs.publish.outputs.status }}
      manifest_digest:
        value: ${{ jobs.publish.outputs.manifest_digest }}

permissions: {}

jobs:
  bundle:
    name: Capture Radius Bicep types
    if: >-
      github.repository == 'radius-project/radius' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id || steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest || steps.upload.outputs.artifact-digest }}
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000/tcp
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Select immutable run bundle
        id: select
        run: python .github/scripts/bicep-types.py select --directory "${RUNNER_TEMP}/bicep-source"
        env:
          GH_TOKEN: ${{ github.token }}
          BICEP_SOURCE_REF_PROTECTED: ${{ github.ref_protected }}

      - name: Setup Go for generation
        if: steps.select.outputs.reuse == 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js for generation
        if: steps.select.outputs.reuse == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned generation tools
        if: steps.select.outputs.reuse == 'false'
        run: make install-bicep install-oras install-yq

      - name: Generate types once
        if: steps.select.outputs.reuse == 'false'
        run: make generate-bicep-types VERSION=edge

      - name: Capture native Bicep OCI bundle
        if: steps.select.outputs.reuse == 'false'
        run: |
          python .github/scripts/bicep-types.py bundle \
            --source "${RUNNER_TEMP}/bicep-source/source.json" \
            --index hack/bicep-types-radius/generated/index.json \
            --registry "localhost:${REGISTRY_PORT}" \
            --directory "${RUNNER_TEMP}/bicep-bundle"
        env:
          REGISTRY_PORT: ${{ job.services.registry.ports['5000'] }}

      - name: Retain immutable bundle
        if: steps.select.outputs.reuse == 'false'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bicep-types-radius-${{ github.run_id }}
          path: ${{ runner.temp }}/bicep-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish Radius edge and mirror ACR
    needs: [bundle]
    if: >-
      github.repository == 'radius-project/radius' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: radius-bicep-types-main-publish
      cancel-in-progress: false
    environment: publish-bicep
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    outputs:
      status: ${{ steps.publish.outputs.status }}
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
    env:
      BICEP_SOURCE_REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned copy tool
        run: make install-oras

      - name: Validate bundle and stamp source manifest
        id: prepare
        run: |
          python .github/scripts/bicep-types.py prepare \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --directory "${RUNNER_TEMP}/bicep-publication"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}

      - name: Isolate registry credentials
        run: |
          mkdir -p "${RUNNER_TEMP}/bicep-registry-credentials"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/bicep-registry-credentials" >> "${GITHUB_ENV}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Azure for the compatibility mirror
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.0
        with:
          client-id: ${{ secrets.BICEPTYPES_CLIENT_ID }}
          tenant-id: ${{ secrets.BICEPTYPES_TENANT_ID }}
          subscription-id: ${{ secrets.BICEPTYPES_SUBSCRIPTION_ID }}

      - name: Login to the fixed compatibility registry
        run: az acr login --name biceptypes

      - name: Publish and verify the complete pair
        id: publish
        run: python .github/scripts/bicep-types.py publish --directory "${RUNNER_TEMP}/bicep-publication"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report publication status
        if: always() && steps.prepare.outcome == 'success'
        run: python .github/scripts/bicep-types.py report --directory "${RUNNER_TEMP}/bicep-publication"

      - name: Retain publication receipt
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bicep-types-radius-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bicep-publication/receipt.json
          if-no-files-found: error
          retention-days: 30
