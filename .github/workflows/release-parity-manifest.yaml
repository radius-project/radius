# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: release-parity-manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Radius release version without the v prefix
        required: true
        type: string

permissions: {}

jobs:
  collect:
    name: Collect release parity manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install inspection tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make install-helm install-jq install-oras install-yq

      - name: Collect manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PARITY_VERSION: ${{ inputs.version }}
        run: make release-parity-manifest

      - name: Summarize manifest
        env:
          RELEASE_PARITY_VERSION: ${{ inputs.version }}
        run: |
          manifest="dist/release-parity/v${RELEASE_PARITY_VERSION}.json"
          {
            echo "## Release parity manifest"
            echo
            echo "* Release: v${RELEASE_PARITY_VERSION}"
            echo "* CLI assets: $(jq '.cli.assets | length' "${manifest}")"
            echo "* Images: $(jq '.images | length' "${manifest}")"
            echo "* Downstream OCI artifacts: $(jq '.downstream.ociArtifacts | length' "${manifest}")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-parity-manifest-v${{ inputs.version }}
          path: dist/release-parity/v${{ inputs.version }}.json
          if-no-files-found: error
