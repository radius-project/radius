# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: release-parity-manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Radius release version without the v prefix
        required: true
        type: string

permissions: {}

jobs:
  collect:
    name: Collect release parity manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install inspection tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make install-helm install-jq install-oras install-yq

      - name: Resolve approved AWS source
        id: aws-pin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PARITY_VERSION: ${{ inputs.version }}
        with:
          retries: 5
          script: |
            const { execFileSync } = await import('node:child_process')
            const { tagCommit } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/coordinate-release.mjs`)
            const version = `v${process.env.RELEASE_PARITY_VERSION}`
            const sha = await tagCommit(github, context, version)
            let data
            try {
              ({ data } = await github.rest.repos.getContent({
                ...context.repo, ref: sha, path: `.github/release-plans/${version}.yaml`
              }))
            } catch (error) {
              if (error.status !== 404) throw error
              core.info('No committed release plan; using historical parity inspection.')
              return
            }
            const plan = JSON.parse(execFileSync('yq', ['-p=yaml', '-o=json', '.', '-'], {
              input: Buffer.from(data.content, 'base64'), encoding: 'utf8'
            }))
            if (!plan.siblingRepositories?.some(entry =>
              entry.name === 'bicep-types-aws' && Object.hasOwn(entry, 'radiusPin'))) return
            const { default: materializeTagPlan } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/aws-pin-receipt.mjs`)
            await materializeTagPlan({
              github, core, context: {
                repo: context.repo, ref: `refs/tags/${version}`, sha
              }
            })

      - name: Collect manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PARITY_VERSION: ${{ inputs.version }}
          RELEASE_PARITY_PLAN_FILE: ${{ steps.aws-pin.outputs.plan-file }}
        run: make release-parity-manifest

      - name: Summarize manifest
        env:
          RELEASE_PARITY_VERSION: ${{ inputs.version }}
        run: |
          manifest="dist/release-parity/v${RELEASE_PARITY_VERSION}.json"
          {
            echo "## Release parity manifest"
            echo
            echo "* Release: v${RELEASE_PARITY_VERSION}"
            echo "* CLI assets: $(jq '.cli.assets | length' "${manifest}")"
            echo "* Images: $(jq '.images | length' "${manifest}")"
            echo "* Downstream OCI artifacts: $(jq '.downstream.ociArtifacts | length' "${manifest}")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-parity-manifest-v${{ inputs.version }}
          path: dist/release-parity/v${{ inputs.version }}.json
          if-no-files-found: error
