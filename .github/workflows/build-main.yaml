# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: build-main

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: build-main-${{ github.ref }}
  queue: max

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/__changes.yml
    permissions:
      contents: read # Required for actions/checkout
      pull-requests: read # Required for change detection

  build-snapshot:
    needs: [changes]
    if: github.repository == 'radius-project/radius' && needs.changes.outputs.only_changed != 'true'
    uses: ./.github/workflows/__build-snapshot.yaml
    permissions:
      contents: read

  build-and-push-cli:
    needs: [changes, build-snapshot]
    if: github.repository == 'radius-project/radius' && needs.changes.outputs.only_changed != 'true'
    uses: ./.github/workflows/__build-cli.yaml
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout

  build-check:
    if: always()
    name: Build Check
    needs: [build-snapshot, build-and-push-cli, build-and-push-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check build matrix results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Snapshot, CLI, or image jobs failed or were cancelled"
          exit 1

      - name: Build matrix succeeded
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "All build matrix jobs completed successfully"
          exit 0

  build-and-push-images:
    needs: [changes, build-snapshot]
    if: github.repository == 'radius-project/radius' && needs.changes.outputs.only_changed != 'true'
    uses: ./.github/workflows/__build-images.yaml
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout

  build-and-push-helm-chart:
    if: github.repository == 'radius-project/radius' && github.ref == 'refs/heads/main' && needs.changes.outputs.only_changed != 'true' && needs.build-and-push-images.outputs.edge-current == 'true'
    needs: [build-and-push-images, changes]
    uses: ./.github/workflows/__build-helm-chart.yaml
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout

  build-and-push-bicep-types:
    needs: [changes]
    if: >-
      github.repository == 'radius-project/radius' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.result == 'success' && needs.changes.outputs.only_changed == 'false'
    uses: ./.github/workflows/__publish-bicep-types.yaml
    with:
      only_changed: ${{ needs.changes.outputs.only_changed }}
    secrets:
      BICEPTYPES_CLIENT_ID: ${{ secrets.BICEPTYPES_CLIENT_ID }}
      BICEPTYPES_TENANT_ID: ${{ secrets.BICEPTYPES_TENANT_ID }}
      BICEPTYPES_SUBSCRIPTION_ID: ${{ secrets.BICEPTYPES_SUBSCRIPTION_ID }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

  build-summary:
    if: always()
    name: Build Summary
    needs: [changes, build-check, build-and-push-images, build-and-push-bicep-types]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Bicep publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bicep-types.mjs`)
            await script({github, core, context})
        env:
          INPUT_OPERATION: summary
          CHANGES_RESULT: ${{ needs.changes.result }}
          ONLY_CHANGED: ${{ needs.changes.outputs.only_changed }}
          BICEP_PUBLISH_RESULT: ${{ needs.build-and-push-bicep-types.result }}
          BICEP_PUBLICATION_STATUS: ${{ needs.build-and-push-bicep-types.outputs.status }}

      - name: Check all build jobs
        run: |
          ./.github/scripts/build-summary.sh \
            "build-check:${BUILD_CHECK_RESULT}" \
            "build-and-push-images:${BUILD_AND_PUSH_IMAGES_RESULT}" \
            "build-and-push-bicep-types:${BUILD_AND_PUSH_BICEP_TYPES_RESULT}"
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_AND_PUSH_IMAGES_RESULT: ${{ needs.build-and-push-images.result }}
          BUILD_AND_PUSH_BICEP_TYPES_RESULT: ${{ needs.build-and-push-bicep-types.result }}
