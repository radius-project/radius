# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: build-main

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false # Do not interrupt an in-flight Bicep publish/mirror pair.

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/__changes.yml
    permissions:
      contents: read # Required for actions/checkout
      pull-requests: read # Required for change detection

  build-and-push-cli:
    needs: [changes]
    if: github.repository == 'radius-project/radius' && needs.changes.outputs.only_changed != 'true'
    uses: ./.github/workflows/__build-cli.yaml
    with:
      only_changed: ${{ needs.changes.outputs.only_changed }}
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout
      issues: read # Required for publishing test results
      checks: write # Required for publishing test results
      pull-requests: write # Required for publishing test results

  build-check:
    if: always()
    name: Build Check
    needs: [build-and-push-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check build matrix results
        if: ${{ needs.build-and-push-cli.result != 'success' && needs.build-and-push-cli.result != 'skipped' }}
        run: |
          echo "::error::Build and push CLI jobs failed or were cancelled"
          exit 1

      - name: Build matrix succeeded
        if: ${{ needs.build-and-push-cli.result == 'success' || needs.build-and-push-cli.result == 'skipped' }}
        run: |
          echo "All build matrix jobs completed successfully"
          exit 0

  build-and-push-images:
    needs: [changes]
    if: github.repository == 'radius-project/radius' && needs.changes.outputs.only_changed != 'true'
    uses: ./.github/workflows/__build-images.yaml
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout

  build-and-push-helm-chart:
    if: github.repository == 'radius-project/radius' && github.ref == 'refs/heads/main' && needs.changes.outputs.only_changed != 'true'
    needs: [build-and-push-images, changes]
    uses: ./.github/workflows/__build-helm-chart.yaml
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout

  bicep-publish-mode:
    name: Select Bicep publisher
    needs: [changes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Select the eligible publisher
        id: mode
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const eligible = context.repo.owner === "radius-project" &&
              context.repo.repo === "radius" && context.ref === "refs/heads/main" &&
              ["push", "workflow_dispatch"].includes(context.eventName);
            if (!eligible) {
              core.setOutput("mode", "skip");
              return;
            }
            if (process.env.CHANGES_RESULT !== "success" ||
                !["true", "false"].includes(process.env.ONLY_CHANGED)) {
              core.setFailed("Bicep publishing requires successful, explicit change detection");
              return;
            }
            if (process.env.ONLY_CHANGED === "true") {
              core.setOutput("mode", "skip");
              return;
            }
            const flag = process.env.PUBLISH_ENABLED;
            if (!["", "false", "true"].includes(flag)) {
              core.notice("Invalid BICEP_GHCR_PUBLISH_ENABLED value; direct publishing remains disabled");
            }
            core.setOutput("mode", flag === "true" ? "direct" : "legacy");
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ONLY_CHANGED: ${{ needs.changes.outputs.only_changed }}
          PUBLISH_ENABLED: ${{ vars.BICEP_GHCR_PUBLISH_ENABLED }}

  build-and-push-bicep-types:
    needs: [bicep-publish-mode]
    if: needs.bicep-publish-mode.outputs.mode == 'legacy'
    uses: ./.github/workflows/__build-bicep-types.yaml
    # The publisher bot credentials are read inside the called job, which is the
    # only job that carries the publish-bicep environment. Environment secrets
    # cannot be passed by name to a reusable workflow, so the whole secret set
    # is inherited and the called job resolves them from its environment.
    secrets: inherit
    permissions:
      contents: read # Required for actions/checkout

  publish-bicep-types-ghcr:
    needs: [bicep-publish-mode]
    if: needs.bicep-publish-mode.outputs.mode == 'direct' && github.ref_protected
    uses: ./.github/workflows/__publish-bicep-types.yaml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

  build-summary:
    if: always()
    name: Build Summary
    needs: [changes, build-check, build-and-push-images, bicep-publish-mode, build-and-push-bicep-types, publish-bicep-types-ghcr]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the selected Bicep publisher
        run: python3 .github/scripts/bicep-types.py summary
        env:
          BICEP_MODE: ${{ needs.bicep-publish-mode.outputs.mode }}
          BICEP_MODE_RESULT: ${{ needs.bicep-publish-mode.result }}
          BICEP_LEGACY_RESULT: ${{ needs.build-and-push-bicep-types.result }}
          BICEP_DIRECT_RESULT: ${{ needs.publish-bicep-types-ghcr.result }}
          BICEP_PUBLICATION_STATUS: ${{ needs.publish-bicep-types-ghcr.outputs.status }}

      - name: Check all build jobs
        run: |
          ./.github/scripts/build-summary.sh \
            "build-check:${BUILD_CHECK_RESULT}" \
            "build-and-push-images:${BUILD_AND_PUSH_IMAGES_RESULT}" \
            "build-and-push-bicep-types:${BUILD_AND_PUSH_BICEP_TYPES_RESULT}" \
            "publish-bicep-types-ghcr:${PUBLISH_BICEP_TYPES_GHCR_RESULT}"
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_AND_PUSH_IMAGES_RESULT: ${{ needs.build-and-push-images.result }}
          BUILD_AND_PUSH_BICEP_TYPES_RESULT: ${{ needs.build-and-push-bicep-types.result }}
          PUBLISH_BICEP_TYPES_GHCR_RESULT: ${{ needs.publish-bicep-types-ghcr.result }}
