# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: __release-controller
run-name: Release ${{ inputs.version }} from ${{ inputs.source-commit }}

on:
  workflow_call:
    inputs:
      source-pr-number:
        description: Generated release pull request number
        required: true
        type: string
      source-pr-commit:
        description: Squash commit of the generated release pull request
        required: true
        type: string
      version:
        description: Planned release version including the v prefix
        required: true
        type: string
      source-commit:
        description: Release commit, or metadata PR commit before frozen source resolution
        required: true
        type: string
      trigger:
        description: Controller entry path
        required: true
        type: string
    secrets:
      RADIUS_RELEASE_BOT_CLIENT_ID:
        required: true
      RADIUS_RELEASE_BOT_PRIVATE_KEY:
        required: true
      RADIUS_PUBLISHER_BOT_CLIENT_ID:
        required: true
      RADIUS_PUBLISHER_BOT_PRIVATE_KEY:
        required: true
      RELEASE_TEAMS_WEBHOOK:
        required: false

permissions: {}

# All entry workflows use this repository-wide key. queue:max allows up to 100
# pending attempts without canceling the active reconciliation.
concurrency:
  group: release-${{ inputs.version }}-${{ inputs.source-pr-commit }}
  queue: max

jobs:
  validate:
    name: Validate release plan and source
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read # Required to read the release environment protection
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      release-type: ${{ steps.plan.outputs.release-type }}
      release-branch: ${{ steps.plan.outputs.release-branch }}
      release-identifier: ${{ steps.plan.outputs.release-identifier }}
      de-image-tag: ${{ steps.plan.outputs.de-image-tag }}
      de-source-tag: ${{ steps.plan.outputs.de-source-tag }}
      de-source-commit: ${{ steps.de-tag.outputs.commit }}
      de-tag-state: ${{ steps.de-tag.outputs.state }}
      plan-artifact-id: ${{ steps.upload-plan.outputs.artifact-id }}
      recipes-commit: ${{ steps.plan.outputs.recipes-commit }}
      dashboard-commit: ${{ steps.plan.outputs.dashboard-commit }}
      bicep-types-aws-commit: ${{ steps.plan.outputs.bicep-types-aws-commit }}
      release-commit: ${{ steps.plan.outputs.release-commit }}
      product-commit: ${{ steps.plan.outputs.product-commit }}
      release-tree: ${{ steps.plan.outputs.release-tree }}
      frozen-source: ${{ steps.plan.outputs.frozen-source }}
      source-resolved: ${{ steps.plan.outputs.source-resolved }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the approved release pull request
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: dispatch
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source-commit }}
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resolve-release-controller.mjs`)
            await script({context, github, core})

      - name: Verify resolved pull request identity
        env:
          EXPECTED_PR: ${{ inputs.source-pr-number }}
          ACTUAL_PR: ${{ steps.source.outputs.source-pr-number }}
          EXPECTED_PR_COMMIT: ${{ inputs.source-pr-commit }}
          ACTUAL_PR_COMMIT: ${{ steps.source.outputs.source-pr-commit }}
        run: |
          [[ "${ACTUAL_PR}" == "${EXPECTED_PR}" ]] || {
            echo "Release PR changed from #${EXPECTED_PR} to #${ACTUAL_PR}." >&2
            exit 1
          }
          [[ "${ACTUAL_PR_COMMIT}" == "${EXPECTED_PR_COMMIT}" ]] || {
            echo "Release PR commit changed from ${EXPECTED_PR_COMMIT}." >&2
            exit 1
          }

      - name: Fetch release branch and planned commits
        env:
          SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
          RELEASE_COMMIT: ${{ inputs.source-commit }}
        run: |
          git fetch origin \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          for commit in "${SOURCE_PR_COMMIT}" "${RELEASE_COMMIT}"; do
            git cat-file -e "${commit}^{commit}" 2>/dev/null || \
              git fetch --no-tags origin "${commit}"
          done

      - name: Install release validation tools
        run: make install-yq install-jq

      - name: Read immutable release plan
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
        run: |
          plan_path=".github/release-plans/${VERSION}.yaml"
          git show "${SOURCE_PR_COMMIT}:${plan_path}" \
            > "${RUNNER_TEMP}/release-plan.yaml"

      - name: Bind plan to release commit
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
          RELEASE_COMMIT: ${{ inputs.source-commit }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          bash ./.github/scripts/validate-release-controller-plan.sh \
            --plan-file "${RUNNER_TEMP}/release-plan.yaml" \
            --version "${VERSION}" \
            --source-pr-commit "${SOURCE_PR_COMMIT}" \
            --release-commit "${RELEASE_COMMIT}" \
            --trigger "${TRIGGER}" \
            --output-dir "${RUNNER_TEMP}/release-controller"

      - name: Verify existing frozen source signature
        if: steps.plan.outputs.frozen-source == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: read
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
          INPUT_PRODUCT_COMMIT: ${{ steps.plan.outputs.product-commit }}
          INPUT_RELEASE_TREE: ${{ steps.plan.outputs.release-tree }}
          INPUT_RELEASE_COMMIT: ${{ steps.plan.outputs.release-commit }}
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-frozen-release-source.mjs`)
            await script({context, github, core})

      # A tag runs the tagged commit's workflows, so check them before any mutation.
      - name: Verify release commit runs the release build
        if: steps.plan.outputs.ready == 'true'
        env:
          RELEASE_COMMIT: >-
            ${{ steps.plan.outputs.source-resolved == 'false' &&
            steps.plan.outputs.product-commit || steps.plan.outputs.release-commit }}
        run: |
          bash ./.github/scripts/verify-release-build-contract.sh \
            "${RELEASE_COMMIT}"

      # The approve job below is the only human gate before mutation. An
      # environment without required reviewers lets that job pass immediately.
      - name: Verify release approval gate
        if: steps.plan.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_ENVIRONMENT: release
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/verify-release-environment.mjs`)
            await script({context, github, core})

      - name: Checkout planned recipes source
        if: steps.plan.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/recipes
          ref: ${{ steps.plan.outputs.recipes-commit }}
          path: controller-siblings/recipes
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout planned dashboard source
        if: steps.plan.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/dashboard
          ref: ${{ steps.plan.outputs.dashboard-commit }}
          path: controller-siblings/dashboard
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout planned bicep-types-aws source
        if: steps.plan.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/bicep-types-aws
          ref: ${{ steps.plan.outputs.bicep-types-aws-commit }}
          path: controller-siblings/bicep-types-aws
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight every release repository
        if: steps.plan.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release-branch }}
          SOURCE_COMMIT: >-
            ${{ steps.plan.outputs.source-resolved == 'false' &&
            steps.plan.outputs.product-commit || steps.plan.outputs.release-commit }}
          RECIPES_COMMIT: ${{ steps.plan.outputs.recipes-commit }}
          DASHBOARD_COMMIT: ${{ steps.plan.outputs.dashboard-commit }}
          BICEP_TYPES_AWS_COMMIT: >-
            ${{ steps.plan.outputs.bicep-types-aws-commit }}
          RELEASE_RECONCILE_CHECK_ONLY: "true"
        run: |
          script="${GITHUB_WORKSPACE}/.github/scripts/release-create-tag-and-branch.sh"
          bash "${script}" . "${VERSION}" "${RELEASE_BRANCH}" \
            "${SOURCE_COMMIT}"
          bash "${script}" controller-siblings/recipes \
            "${VERSION}" "${RELEASE_BRANCH}" "${RECIPES_COMMIT}"
          bash "${script}" controller-siblings/dashboard \
            "${VERSION}" "${RELEASE_BRANCH}" "${DASHBOARD_COMMIT}"
          bash "${script}" controller-siblings/bicep-types-aws \
            "${VERSION}" "${RELEASE_BRANCH}" \
            "${BICEP_TYPES_AWS_COMMIT}"

      # The Deployment Engine repository is private and belongs to azure-octo,
      # so neither GITHUB_TOKEN nor the release App can read its tags. The
      # publisher App installation covers it; validation only reads.
      - name: Create Deployment Engine read token
        if: steps.plan.outputs.ready == 'true'
        id: de-read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          owner: azure-octo
          repositories: deployment-engine
          permission-metadata: read
          permission-contents: read

      # A final ships the Deployment Engine commit that its last RC locked. The
      # RC tag in the Deployment Engine repository can move; the GitHub-verified
      # lock on the RC's Radius tag cannot.
      - name: Read release candidate Deployment Engine lock
        if: >-
          steps.plan.outputs.ready == 'true' &&
          steps.plan.outputs.release-type == 'final'
        id: rc-lock
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: release-candidate
          INPUT_VERSION: ${{ steps.plan.outputs.version }}
          INPUT_RELEASE_CANDIDATE: ${{ steps.plan.outputs.previous-version }}
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-release-controller-lock.mjs`)
            await script({context, github, core})

      # An existing tag is verified. An absent tag is planned at main for an
      # RC or patch, and for a final at the commit its last RC locked, which
      # the RC tag must still name. The publication job creates it at this
      # exact commit after approval.
      - name: Verify or plan Deployment Engine tag
        if: steps.plan.outputs.ready == 'true'
        id: de-tag
        env:
          GH_TOKEN: ${{ steps.de-read-token.outputs.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TYPE: ${{ steps.plan.outputs.release-type }}
          RELEASE_CANDIDATE: ${{ steps.plan.outputs.previous-version }}
          RC_DE_COMMIT: ${{ steps.rc-lock.outputs.de-source-commit }}
        run: |
          args=(--allow-absent main "${VERSION}")
          if [[ "${RELEASE_TYPE}" == "final" ]]; then
            args=(--allow-absent "${RELEASE_CANDIDATE}" "${VERSION}"
              "${RC_DE_COMMIT:?the release candidate lock has no commit}")
          fi
          bash ./.github/scripts/verify-deployment-engine-tag.sh "${args[@]}"

      # Approvers review these values before the approve job; later stages fail
      # instead of releasing a different source, sibling, or Deployment Engine
      # commit.
      - name: Summarize validated plan
        env:
          READY: ${{ steps.plan.outputs.ready }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.release-commit }}
          PRODUCT_COMMIT: ${{ steps.plan.outputs.product-commit }}
          RELEASE_TREE: ${{ steps.plan.outputs.release-tree }}
          SOURCE_RESOLVED: ${{ steps.plan.outputs.source-resolved }}
          METADATA_COMMIT: ${{ inputs.source-pr-commit }}
          SOURCE_PR: ${{ inputs.source-pr-number }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release-branch }}
          DE_COMMIT: ${{ steps.de-tag.outputs.commit }}
          DE_STATE: ${{ steps.de-tag.outputs.state }}
          DE_IMAGE_TAG: ${{ steps.plan.outputs.de-image-tag }}
          RECIPES_COMMIT: ${{ steps.plan.outputs.recipes-commit }}
          DASHBOARD_COMMIT: ${{ steps.plan.outputs.dashboard-commit }}
          BICEP_TYPES_AWS_COMMIT: >-
            ${{ steps.plan.outputs.bicep-types-aws-commit }}
        run: |
          {
            echo "## Release controller"
            echo
            echo "- Version: ${VERSION}"
            echo "- Product commit: ${PRODUCT_COMMIT}"
            echo "- Approved metadata commit: ${METADATA_COMMIT}"
            if [[ "${SOURCE_RESOLVED}" == true ]]; then
              echo "- Release commit: ${SOURCE_COMMIT}"
            else
              echo "- Release commit: App-signed after approval"
              echo "- Exact approved release tree: ${RELEASE_TREE}"
            fi
            echo "- Release pull request: #${SOURCE_PR}"
            if [[ "${READY}" == "true" ]]; then
              echo "- State: validated and ready to reconcile"
              echo "- Release branch: ${RELEASE_BRANCH}"
              if [[ "${DE_STATE}" == "absent" ]]; then
                echo "- Deployment Engine: create ${VERSION} at ${DE_COMMIT}" \
                  "after approval, image tag ${DE_IMAGE_TAG}"
              else
                echo "- Deployment Engine: ${VERSION} (${DE_STATE} tag) at" \
                  "${DE_COMMIT}, image tag ${DE_IMAGE_TAG}"
              fi
              echo "- recipes: ${RECIPES_COMMIT}"
              echo "- dashboard: ${DASHBOARD_COMMIT}"
              echo "- bicep-types-aws: ${BICEP_TYPES_AWS_COMMIT}"
            else
              echo "- State: waiting for the generated release backport"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload resolved release plan
        id: upload-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-plan-${{ inputs.version }}-${{ inputs.source-pr-commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-controller/release-plan.yaml
            ${{ runner.temp }}/release-controller/release-targets.json
          if-no-files-found: error
          retention-days: 90

  approve:
    name: Approve release reconciliation
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Record approval
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PRODUCT_COMMIT: ${{ needs.validate.outputs.product-commit }}
          METADATA_COMMIT: ${{ inputs.source-pr-commit }}
        run: echo "Approved ${VERSION}, product ${PRODUCT_COMMIT}, metadata ${METADATA_COMMIT}."

  reconcile-source:
    name: Resolve approved release commit
    needs: [validate, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      release-commit: ${{ steps.plan.outputs.release-commit }}
      release-identifier: ${{ steps.plan.outputs.release-identifier }}
      plan-artifact-id: ${{ steps.upload-plan.outputs.artifact-id }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release validation tools
        run: make install-yq install-jq

      - name: Create frozen source App token
        if: needs.validate.outputs.frozen-source == 'true'
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: radius
          permission-contents: write

      - name: Reconcile signed frozen release source
        if: needs.validate.outputs.frozen-source == 'true'
        id: frozen
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: create
          INPUT_APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
          INPUT_PRODUCT_COMMIT: ${{ needs.validate.outputs.product-commit }}
          INPUT_RELEASE_TREE: ${{ needs.validate.outputs.release-tree }}
          INPUT_RELEASE_COMMIT: ${{ needs.validate.outputs.release-commit }}
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-frozen-release-source.mjs`)
            await script({context, github, core})

      - name: Revalidate resolved source and immutable metadata
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_PR_COMMIT: ${{ inputs.source-pr-commit }}
          RELEASE_COMMIT: >-
            ${{ steps.frozen.outputs.release-commit ||
            needs.validate.outputs.release-commit }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          git fetch --no-tags origin \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          for commit in "${SOURCE_PR_COMMIT}" "${RELEASE_COMMIT}"; do
            git cat-file -e "${commit}^{commit}" 2>/dev/null || \
              git fetch --no-tags origin "${commit}"
          done
          git show "${SOURCE_PR_COMMIT}:.github/release-plans/${VERSION}.yaml" \
            > "${RUNNER_TEMP}/release-plan.yaml"
          bash ./.github/scripts/validate-release-controller-plan.sh \
            --plan-file "${RUNNER_TEMP}/release-plan.yaml" \
            --version "${VERSION}" --source-pr-commit "${SOURCE_PR_COMMIT}" \
            --release-commit "${RELEASE_COMMIT}" --trigger "${TRIGGER}" \
            --output-dir "${RUNNER_TEMP}/release-controller"
          [[ "$(<"${RUNNER_TEMP}/release-controller/source-resolved.txt")" == true ]] || {
            echo "The approved release source is still unresolved." >&2
            exit 1
          }
          bash ./.github/scripts/verify-release-build-contract.sh \
            "${RELEASE_COMMIT}"

      - name: Upload resolved release plan
        id: upload-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-release-plan-${{ inputs.version }}-${{ steps.plan.outputs.release-commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-controller/release-plan.yaml
            ${{ runner.temp }}/release-controller/release-targets.json
          if-no-files-found: error
          retention-days: 90

  publish-deployment-engine:
    name: Publish Deployment Engine
    needs: [validate, reconcile-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.verify-image.outputs.digest }}
      source-commit: ${{ steps.de-tag.outputs.commit }}
      run-url: ${{ steps.monitor-de-workflow.outputs.run_url }}
      run-state: ${{ steps.monitor-de-workflow.outputs.run_state }}
      lock-branch: >-
        ${{ steps.de-lock.outputs.branch || steps.lock-image.outputs.branch }}
    steps:
      - name: Checkout trusted publisher monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download approved release contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.reconcile-source.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/release-controller
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create Deployment Engine read token
        id: de-read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          owner: azure-octo
          repositories: deployment-engine
          permission-metadata: read
          permission-contents: read

      # Validation planned this commit for an absent tag, and the approval
      # above covers it. The pushed tag starts the Deployment Engine tag build,
      # which stages the image that this job adopts and locks. Only the
      # Radius Publisher App writes to the Deployment Engine repository.
      - name: Create Deployment Engine tag token
        if: needs.validate.outputs.de-tag-state == 'absent'
        id: de-write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          owner: azure-octo
          repositories: deployment-engine
          permission-metadata: read
          permission-contents: write

      - name: Checkout approved Deployment Engine commit
        if: needs.validate.outputs.de-tag-state == 'absent'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: azure-octo/deployment-engine
          ref: ${{ needs.validate.outputs.de-source-commit }}
          token: ${{ steps.de-write-token.outputs.token }}
          path: deployment-engine
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Deployment Engine git authentication
        if: needs.validate.outputs.de-tag-state == 'absent'
        env:
          GH_TOKEN: ${{ steps.de-write-token.outputs.token }}
        run: gh auth setup-git

      # The tag points at an existing, GitHub-verified main commit; the
      # controller never creates commits in the Deployment Engine repository.
      - name: Create approved Deployment Engine tag
        if: needs.validate.outputs.de-tag-state == 'absent'
        env:
          GH_TOKEN: ${{ steps.de-write-token.outputs.token }}
          APP_SLUG: ${{ steps.de-write-token.outputs.app-slug }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_DE_COMMIT: ${{ needs.validate.outputs.de-source-commit }}
          RELEASE_RECONCILE_TAG_ONLY: "true"
        run: |
          [[ "${APP_SLUG}" == "radius-publisher" ]] || {
            echo "The Deployment Engine token belongs to ${APP_SLUG}, not radius-publisher." >&2
            exit 1
          }
          ./.github/scripts/release-create-tag-and-branch.sh \
            deployment-engine "${VERSION}" "${APPROVED_DE_COMMIT}"

      - name: Reverify approved Deployment Engine tag
        id: de-tag
        env:
          GH_TOKEN: ${{ steps.de-read-token.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_DE_COMMIT: ${{ needs.validate.outputs.de-source-commit }}
        run: |
          [[ -n "${APPROVED_DE_COMMIT}" ]] || {
            echo "Validation did not record the Deployment Engine commit." >&2
            exit 1
          }
          bash ./.github/scripts/verify-deployment-engine-tag.sh \
            "${VERSION}" "${APPROVED_DE_COMMIT}"

      - name: Read Deployment Engine release lock
        id: de-lock
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: read
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_RELEASE_SOURCE_SHA: ${{ needs.reconcile-source.outputs.release-commit }}
          INPUT_DE_SIGNED_TAG: ${{ needs.validate.outputs.version }}
          INPUT_DE_SOURCE_SHA: ${{ steps.de-tag.outputs.commit }}
          INPUT_DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-release-controller-lock.mjs`)
            await script({context, github, core})

      # The tag build stages the full-version image a few minutes after the
      # tag push. Wait for it rather than copying a source image that may not
      # exist yet; after the wait, the correlated publisher copies it instead.
      # A resumed attempt waits too, because the tag that an interrupted
      # attempt pushed may still be building.
      - name: Wait for the Deployment Engine tag build
        if: steps.de-lock.outputs.exists != 'true'
        env:
          GORELEASER_PARITY_TARGETS: ${{ runner.temp }}/release-controller/release-targets.json
          DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DE_SOURCE_COMMIT: ${{ steps.de-tag.outputs.commit }}
        run: |
          state_file="${RUNNER_TEMP}/de-image-wait-state.txt"
          deadline=$((SECONDS + 900))
          while :; do
            env -u GITHUB_OUTPUT \
              bash ./.github/scripts/verify-deployment-engine-image.sh \
              --tag "${DE_IMAGE_TAG}" \
              --signed-tag "${RELEASE_VERSION}" \
              --source-commit "${DE_SOURCE_COMMIT}" \
              --output "${RUNNER_TEMP}/de-image-wait.json" \
              --allow-absent \
              --state-output "${state_file}"
            [[ "$(<"${state_file}")" == "absent" ]] || break
            if ((SECONDS >= deadline)); then
              echo "::notice::The tag build has not staged ${DE_IMAGE_TAG} yet; the publisher copies it from the source registry."
              break
            fi
            sleep 30
          done

      # A full-version tag from another source is a conflict, not permission
      # to dispatch a publisher that could overwrite an immutable artifact.
      - name: Inspect unlocked Deployment Engine image
        if: steps.de-lock.outputs.exists != 'true'
        id: existing-image
        env:
          GORELEASER_PARITY_TARGETS: ${{ runner.temp }}/release-controller/release-targets.json
          DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DE_SOURCE_COMMIT: ${{ steps.de-tag.outputs.commit }}
        run: |
          bash ./.github/scripts/verify-deployment-engine-image.sh \
            --tag "${DE_IMAGE_TAG}" \
            --signed-tag "${RELEASE_VERSION}" \
            --source-commit "${DE_SOURCE_COMMIT}" \
            --output "${RUNNER_TEMP}/de-image-before.json" \
            --allow-absent \
            --state-output "${RUNNER_TEMP}/de-image-state.txt"

      - name: Get App token for radius-publisher
        if: steps.de-lock.outputs.exists != 'true'
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          owner: azure-octo
          repositories: radius-publisher
          permission-metadata: read
          permission-actions: read
          permission-contents: write

      - name: Dispatch or monitor correlated DE publisher run
        if: steps.de-lock.outputs.exists != 'true'
        id: monitor-de-workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.publisher-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monitor-remote-workflow.mjs`)
            await script({context, github, core})
        env:
          INPUT_OWNER: azure-octo
          INPUT_REPO: radius-publisher
          INPUT_WORKFLOW_FILE: publish-deployment-engine.yml
          INPUT_EVENT_TYPE: deployment-engine
          INPUT_RELEASE_IDENTIFIER: ${{ needs.reconcile-source.outputs.release-identifier }}
          INPUT_REUSE_SUCCESSFUL: >-
            ${{ steps.existing-image.outputs.state == 'complete' &&
            'true' || 'false' }}
          INPUT_DISPATCH_IF_MISSING: >-
            ${{ steps.existing-image.outputs.state == 'complete' &&
            'false' || 'true' }}
          INPUT_CLIENT_PAYLOAD: |-
            {
              "source_repository": ${{ toJSON(github.repository) }},
              "source_sha": ${{ toJSON(needs.reconcile-source.outputs.release-commit) }},
              "src_image": "radiusdeploymentengine.azurecr.io/deployment-engine",
              "dest_image": "ghcr.io/radius-project/deployment-engine",
              "tag": ${{ toJSON(needs.validate.outputs.de-image-tag) }},
              "source_tag": ${{ toJSON(needs.validate.outputs.de-source-tag) }},
              "expected_revision": ${{ toJSON(steps.de-tag.outputs.commit) }},
              "expected_ref": ${{ toJSON(format('refs/tags/{0}', needs.validate.outputs.version)) }}
            }
          INPUT_MAX_WAIT_SECONDS: "720"
          INPUT_POLL_INTERVAL_SECONDS: "15"

      - name: Verify published Deployment Engine image
        id: verify-image
        env:
          GORELEASER_PARITY_TARGETS: ${{ runner.temp }}/release-controller/release-targets.json
          DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DE_SOURCE_COMMIT: ${{ steps.de-tag.outputs.commit }}
          LOCKED_DIGEST: >-
            ${{ steps.de-lock.outputs.digest ||
            steps.existing-image.outputs.digest }}
        run: |
          bash ./.github/scripts/verify-deployment-engine-image.sh \
            --tag "${DE_IMAGE_TAG}" \
            --signed-tag "${RELEASE_VERSION}" \
            --source-commit "${DE_SOURCE_COMMIT}" \
            --expected-digest "${LOCKED_DIGEST}" \
            --output "${RUNNER_TEMP}/de-image.json"

      - name: Get App token for release state
        if: steps.de-lock.outputs.exists != 'true'
        id: release-state-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: radius
          permission-contents: write

      - name: Lock Deployment Engine image digest
        if: steps.de-lock.outputs.exists != 'true'
        id: lock-image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: create
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_RELEASE_SOURCE_SHA: ${{ needs.reconcile-source.outputs.release-commit }}
          INPUT_DE_SIGNED_TAG: ${{ needs.validate.outputs.version }}
          INPUT_DE_SOURCE_SHA: ${{ steps.de-tag.outputs.commit }}
          INPUT_DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
          INPUT_DE_DIGEST: ${{ steps.verify-image.outputs.digest }}
        with:
          github-token: ${{ steps.release-state-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-release-controller-lock.mjs`)
            await script({context, github, core})

      - name: Show failed Deployment Engine publish logs
        if: failure() && steps.monitor-de-workflow.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          RUN_ID: ${{ steps.monitor-de-workflow.outputs.run_id }}
        run: |
          gh run view "${RUN_ID}" \
            --repo azure-octo/radius-publisher --log-failed || true

  reconcile-siblings:
    name: Reconcile sibling repositories
    needs: [validate, publish-deployment-engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted reconciliation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Get App token for sibling repositories
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            recipes
            dashboard
            bicep-types-aws
          permission-contents: write

      - name: Checkout planned recipes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/recipes
          ref: ${{ needs.validate.outputs.recipes-commit }}
          token: ${{ steps.release-token.outputs.token }}
          path: recipes
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout planned dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/dashboard
          ref: ${{ needs.validate.outputs.dashboard-commit }}
          token: ${{ steps.release-token.outputs.token }}
          path: dashboard
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout planned bicep-types-aws source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/bicep-types-aws
          ref: ${{ needs.validate.outputs.bicep-types-aws-commit }}
          token: ${{ steps.release-token.outputs.token }}
          path: bicep-types-aws
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git authentication
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: gh auth setup-git

      - name: Reconcile radius-project/recipes
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release-branch }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.recipes-commit }}
        run: |
          ./.github/scripts/release-create-tag-and-branch.sh \
            recipes "${VERSION}" "${RELEASE_BRANCH}" "${SOURCE_COMMIT}"

      - name: Reconcile radius-project/dashboard
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release-branch }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.dashboard-commit }}
        run: |
          ./.github/scripts/release-create-tag-and-branch.sh \
            dashboard "${VERSION}" "${RELEASE_BRANCH}" "${SOURCE_COMMIT}"

      - name: Reconcile radius-project/bicep-types-aws
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release-branch }}
          SOURCE_COMMIT: >-
            ${{ needs.validate.outputs.bicep-types-aws-commit }}
        run: |
          ./.github/scripts/release-create-tag-and-branch.sh \
            bicep-types-aws "${VERSION}" "${RELEASE_BRANCH}" \
            "${SOURCE_COMMIT}"

  create-radius-tag:
    name: Create Radius tag last
    needs: [validate, reconcile-source, publish-deployment-engine, reconcile-siblings]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted reconciliation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download approved release contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.reconcile-source.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/release-controller
          merge-multiple: true

      - name: Get App token for Radius tag creation
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: radius
          permission-contents: write

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Reverify Deployment Engine image digest
        env:
          GORELEASER_PARITY_TARGETS: ${{ runner.temp }}/release-controller/release-targets.json
          DE_IMAGE_TAG: ${{ needs.validate.outputs.de-image-tag }}
          DE_IMAGE_DIGEST: ${{ needs.publish-deployment-engine.outputs.digest }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DE_SOURCE_COMMIT: ${{ needs.publish-deployment-engine.outputs.source-commit }}
        run: |
          bash ./.github/scripts/verify-deployment-engine-image.sh \
            --tag "${DE_IMAGE_TAG}" \
            --signed-tag "${RELEASE_VERSION}" \
            --source-commit "${DE_SOURCE_COMMIT}" \
            --expected-digest "${DE_IMAGE_DIGEST}" \
            --output "${RUNNER_TEMP}/de-image-final.json"

      - name: Checkout planned Radius source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/radius
          ref: ${{ needs.reconcile-source.outputs.release-commit }}
          token: ${{ steps.release-token.outputs.token }}
          path: radius
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git authentication
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: gh auth setup-git

      - name: Reconcile Radius branch and tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release-branch }}
          SOURCE_COMMIT: ${{ needs.reconcile-source.outputs.release-commit }}
        run: |
          ./.github/scripts/release-create-tag-and-branch.sh \
            radius "${VERSION}" "${RELEASE_BRANCH}" "${SOURCE_COMMIT}"

      - name: Summarize Radius tag creation
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.reconcile-source.outputs.release-commit }}
        run: |
          {
            echo "## Radius tag created last"
            echo
            echo "- Tag: ${VERSION}"
            echo "- Commit: ${SOURCE_COMMIT}"
            echo "- Release build: build-release.yaml"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reconcile tag-build and publication run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_SOURCE_SHA: ${{ needs.reconcile-source.outputs.release-commit }}
        with:
          retries: 5
          script: |
            const { resumeReleasePublication } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-release-controller.mjs`)
            await resumeReleasePublication({ github, context, core })

  summary:
    name: Release controller summary
    needs:
      - validate
      - approve
      - reconcile-source
      - publish-deployment-engine
      - reconcile-siblings
      - create-radius-tag
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted summary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Report controller transition
        continue-on-error: true
        uses: ./.github/actions/release-status
        with:
          stage: prerequisites
          version: ${{ inputs.version }}
          source-sha: ${{ needs.reconcile-source.outputs.release-commit || inputs.source-commit }}
          results: ${{ toJSON(needs) }}
          webhook: ${{ secrets.RELEASE_TEAMS_WEBHOOK }}

      - name: Summarize release state and recovery
        env:
          VERSION: ${{ needs.validate.outputs.version || inputs.version }}
          SOURCE_COMMIT: ${{ needs.reconcile-source.outputs.release-commit || inputs.source-commit }}
          READY: ${{ needs.validate.outputs.ready }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          APPROVE_RESULT: ${{ needs.approve.result }}
          SOURCE_RESULT: ${{ needs.reconcile-source.result }}
          DE_RESULT: ${{ needs.publish-deployment-engine.result }}
          DE_RUN_URL: ${{ needs.publish-deployment-engine.outputs.run-url }}
          DE_RUN_STATE: ${{ needs.publish-deployment-engine.outputs.run-state }}
          DE_LOCK_BRANCH: >-
            ${{ needs.publish-deployment-engine.outputs.lock-branch }}
          SIBLINGS_RESULT: ${{ needs.reconcile-siblings.result }}
          RADIUS_RESULT: ${{ needs.create-radius-tag.result }}
        run: |
          {
            echo "## Release controller result"
            echo
            echo "- Version: ${VERSION}"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validate plan and preflight | ${VALIDATE_RESULT} |"
            echo "| Release approval | ${APPROVE_RESULT} |"
            echo "| Resolve release commit | ${SOURCE_RESULT} |"
            echo "| Deployment Engine | ${DE_RESULT} |"
            echo "| Sibling repositories | ${SIBLINGS_RESULT} |"
            echo "| Radius tag last | ${RADIUS_RESULT} |"
            if [[ -n "${DE_RUN_URL}" ]]; then
              echo
              echo "Deployment Engine publisher: ${DE_RUN_URL}"
            fi
            if [[ -n "${DE_LOCK_BRANCH}" ]]; then
              echo "Deployment Engine lock: ${DE_LOCK_BRANCH}"
            fi
            if [[ "${READY}" == "false" ]]; then
              echo
              echo "This release is waiting for its generated metadata backport."
            elif [[ "${DE_RUN_STATE}" == "unknown" ]]; then
              echo
              echo "The Deployment Engine dispatch outcome is unknown."
              echo "No second dispatch was sent after the uncertain response."
              echo "Inspect azure-octo/radius-publisher runs and the destination"
              echo "image before retrying; a new invocation can dispatch again."
              echo "Release identifier: ${VERSION}-${SOURCE_COMMIT}"
            elif [[ "${RADIUS_RESULT}" != "success" ]]; then
              echo
              echo "Completed stages are reconciled on resume. A conflicting"
              echo "tag, branch, plan, or digest must be corrected before retry."
              echo
              echo "Resume with:"
              echo '```bash'
              printf 'gh workflow run resume-release.yaml --ref main '
              printf -- '-f version=%q -f source-commit=%q\n' \
                "${VERSION}" "${SOURCE_COMMIT}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
