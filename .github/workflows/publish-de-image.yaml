# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish Deployment Engine Image

on:
  workflow_dispatch:
    inputs:
      src_image:
        description: Source image in ACR (e.g. radiusdeploymentengine.azurecr.io/deployment-engine)
        required: true
      dest_image:
        description: Destination image in GHCR (e.g. ghcr.io/radius-project/deployment-engine)
        required: true
      tag:
        description: Tag for the image (e.g. 1.0)
        required: true
  repository_dispatch:
    types: [deployment-engine.publish]
    # Expected client_payload:
    #   src_image: Source image in ACR (e.g. radiusdeploymentengine.azurecr.io/deployment-engine)
    #   dest_image: Destination image in GHCR (e.g. ghcr.io/radius-project/deployment-engine)
    #   tag: Tag for the image (e.g. 1.0)

permissions: {}

jobs:
  dispatch-publish:
    name: Dispatch DE image publish
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: publish-de-image
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture payload
        id: payload
        shell: bash
        env:
          SRC_IMAGE: ${{ github.event.client_payload.src_image || github.event.inputs.src_image }}
          DEST_IMAGE: ${{ github.event.client_payload.dest_image || github.event.inputs.dest_image }}
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
        run: |
          {
            echo "src_image=${SRC_IMAGE}"
            echo "dest_image=${DEST_IMAGE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Get App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: get-token
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          permission-metadata: read
          permission-actions: read
          permission-contents: write
          owner: azure-octo
          repositories: |
            radius-publisher

      - name: Dispatch or monitor correlated publisher run
        id: monitor-remote-workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monitor-remote-workflow.mjs`)
            await script({context, github, core})
        env:
          INPUT_OWNER: azure-octo
          INPUT_REPO: radius-publisher
          INPUT_WORKFLOW_FILE: publish-deployment-engine.yml
          INPUT_EVENT_TYPE: deployment-engine
          INPUT_RELEASE_IDENTIFIER: ${{ steps.payload.outputs.tag }}-${{ github.run_id }}
          # These values arrive from an external repository_dispatch, so emit
          # them with toJSON rather than interpolating them into JSON text.
          INPUT_CLIENT_PAYLOAD: |-
            {
              "source_repository": ${{ toJSON(github.repository) }},
              "src_image": ${{ toJSON(steps.payload.outputs.src_image) }},
              "dest_image": ${{ toJSON(steps.payload.outputs.dest_image) }},
              "tag": ${{ toJSON(steps.payload.outputs.tag) }}
            }
          INPUT_MAX_WAIT_SECONDS: "720"
          INPUT_POLL_INTERVAL_SECONDS: "15"

      - name: Show failed logs
        if: failure() && steps.monitor-remote-workflow.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          RUN_ID: ${{ steps.monitor-remote-workflow.outputs.run_id }}
        run: |
          gh run view "${RUN_ID}" --repo azure-octo/radius-publisher --log-failed || true
