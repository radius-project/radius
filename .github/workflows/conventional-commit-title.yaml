# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: conventional-commit-title

# pull_request_target runs the base branch's copy of this workflow, so a pull
# request cannot weaken this required check by editing it. No pull request code
# is checked out or executed here, so the token never sees untrusted input.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      # A required check is evaluated against the head commit, so the check has
      # to re-run when new commits arrive.
      - synchronize
  # A merge group has no pull request title, but the required check must still
  # report there or queued entries stall until the queue check timeout.
  merge_group:
    branches:
      - main

permissions: {}

concurrency:
  group: conventional-commit-title-${{ github.event.pull_request.number || github.sha }}
  # A canceled merge queue check fails the queued entry.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  validate-title:
    name: Validate pull request title
    # The title is validated on the pull request itself; in the merge queue this
    # job is skipped and its required check reports success.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # Required by wip to hold the check in a pending state
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          # A "[WIP]" title leaves the check pending instead of failing, which
          # blocks merge without nagging an unfinished pull request.
          wip: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
