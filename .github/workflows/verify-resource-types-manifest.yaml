# This workflow verifies that the resource type manifest files committed in
# deploy/manifest/built-in-providers/ match the per-namespace upstream
# revisions pinned in deploy/manifest/defaults.yaml (resourceTypes[].ref).
#
# It runs "make sync-resource-types", which first verifies every resource type
# and recipe pack uses a stable release when one exists, then re-fetches each
# pinned resource type ref, re-copies the manifest files, and checks for drift.
#
# - If there is no diff, the committed copies are in sync and the check passes.
# - If there is a diff, the committed copies have drifted from the pinned
#   refs and the check fails. The developer must run
#   "make sync-resource-types" locally and commit the updated files.
#
# This catches:
#   - An edge pin for a namespace or recipe pack that has a stable release
#   - A prerelease or mismatched release tag
#   - A resourceTypes[].ref bump in defaults.yaml without re-running "make sync-resource-types"
#   - Manual edits to copied manifest files that drift from upstream
#   - New entries in defaults.yaml without re-syncing
#
# recipePacks[] have no vendored copies to compare, but their stable-first pin
# policy, tag-to-SHA consistency, and runtime catalog consumers are tested.
#
# Similar in spirit to the "go mod tidy" check, ensuring generated/copied
# artifacts are consistent with their source.
---
name: Verify Resource Types Manifest

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      # Trigger when the default list and per-namespace pins, the copied
      # manifests, or the sync logic (Makefile, resource-types.mk, the sync
      # script) changes.
      - "deploy/manifest/defaults.yaml"
      - "deploy/manifest/built-in-providers/**"
      - "Makefile"
      - "build/resource-types.mk"
      - "build/scripts/sync-resource-types.sh"
      - "build/scripts/test-sync-resource-types.sh"
      - "build/scripts/verify-contrib-consumers.sh"
      - ".github/extension/**"
  # The merge_group event does not support path filters. This check is cheap
  # (sync + git diff), so it simply runs on every queued group rather than
  # adding change-detection. Scoped to main only so the release branch flow is
  # never affected.
  merge_group:
    branches:
      - main

permissions: {}

concurrency:
  group: verify-resource-types-manifest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify-resource-types-manifest:
    name: Verify resource type copies are in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yq
        run: make install-yq

      - name: Test stable-first pin selection
        run: make test-sync-resource-types

      - name: Verify contrib workflow consumers
        run: make verify-contrib-consumers

      # Re-run the copy step (without bumping the ref) to regenerate the
      # manifest files from the ref pinned in deploy/manifest/defaults.yaml.
      - name: Sync resource types from pinned ref
        run: make sync-resource-types

      # If the regenerated tree differs from what's committed, the PR has drift.
      # git status is required here because git diff ignores untracked files.
      - name: Check for drift
        run: |
          changes="$(git status --porcelain --untracked-files=all -- \
            deploy/manifest/built-in-providers/)"
          if [ -n "${changes}" ]; then
            echo ""
            echo "ERROR: Resource type manifest copies are out of sync with the pinned"
            echo "resource-types-contrib revisions (resourceTypes[].ref) in deploy/manifest/defaults.yaml."
            echo ""
            printf '%s\n' "${changes}"
            git diff -- deploy/manifest/built-in-providers/
            echo ""
            echo "Run 'make sync-resource-types' and commit the updated files."
            exit 1
          fi
          echo "Resource type manifest copies are in sync."
