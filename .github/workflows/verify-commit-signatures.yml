# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: verify-commit-signatures

on:
  # This workflow uses the trusted base commit and never executes PR-head code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: number

concurrency:
  group: verify-commit-signatures-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-commit-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout signature verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            .github/scripts/verify-commit-signatures.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify commit signatures
        id: verify
        run: |
          ./.github/scripts/verify-commit-signatures.sh > unverified-commits.json
          if ! jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[0-9a-f]{40}$"))
          ' unverified-commits.json > /dev/null; then
            echo "Signature verifier returned invalid commit data." >&2
            exit 1
          fi

          count="$(jq 'length' unverified-commits.json)"

          if [[ "${count}" == "0" ]]; then
            echo "All pull request commits have Verified signatures."
            echo "has_unverified=false" >> "${GITHUB_OUTPUT}"
          else
            printf 'Found %s commit(s) without Verified signatures:\n' "${count}"
            jq -r '.[] | "- \(.[0:7])"' unverified-commits.json
            echo "has_unverified=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare signature guidance
        if: steps.verify.outputs.has_unverified == 'true'
        run: |
          guide_path="docs/contributing/contributing-code"
          guide_path+="/contributing-code-first-commit"
          guide_path+="/first-commit-06-creating-a-pr/index.md"
          guide_url="${GITHUB_SERVER_URL}/radius-project/radius/blob/main"
          guide_url+="/${guide_path}#signing-your-commits"

          {
            echo "Thank you for contributing to Radius."
            echo
            echo "The following commits do not currently show a GitHub **Verified** signature:"
            echo
            jq -r \
              --arg origin "${GITHUB_SERVER_URL}" \
              --arg repo "${GITHUB_REPOSITORY}" \
              '.[] | "- [`\(.[:7])`](\($origin)/\($repo)/commit/\(.))"' \
              unverified-commits.json
            echo
            printf '%s%s%s\n' \
              "Please follow our [commit-signing guide](${guide_url}) to " \
              "configure GPG, SSH, or S/MIME signing. Then re-sign the affected " \
              "commits and force-push the rewritten branch with \`--force-with-lease\`."
            echo
            printf '%s%s\n' \
              "Cryptographic commit signing is separate from the DCO " \
              "\`Signed-off-by\` line; both are required."
          } > commit-signature-guidance.md

      - name: Post signature guidance
        if: steps.verify.outputs.has_unverified == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: commit-signature-verification
          number_force: ${{ github.event.pull_request.number || inputs.pr_number }}
          path: commit-signature-guidance.md
          skip_unchanged: true
