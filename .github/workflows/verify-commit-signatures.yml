# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: verify-commit-signatures

on:
  # This workflow uses the trusted base commit and never executes PR-head code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: number

concurrency:
  group: verify-commit-signatures-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-commit-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify commit signatures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER)
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              throw new Error('PR_NUMBER must be a positive integer')
            }

            const query = `
              query(
                $owner: String!
                $repo: String!
                $number: Int!
                $cursor: String
              ) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    commits(first: 100, after: $cursor) {
                      nodes {
                        commit {
                          oid
                          signature {
                            isValid
                            state
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `

            const unverified = []
            let cursor = null
            do {
              const result = await github.graphql(query, {
                ...context.repo,
                number: prNumber,
                cursor
              })
              const pullRequest = result.repository.pullRequest
              if (!pullRequest) {
                throw new Error(`Pull request #${prNumber} was not found`)
              }

              const commits = pullRequest.commits
              for (const { commit } of commits.nodes) {
                if (!/^[0-9a-f]{40}$/.test(commit.oid)) {
                  throw new Error('GitHub returned an invalid commit OID')
                }

                const signature = commit.signature
                if (!signature || !signature.isValid || signature.state !== 'VALID') {
                  unverified.push(commit.oid)
                }
              }

              if (
                commits.pageInfo.hasNextPage &&
                !commits.pageInfo.endCursor
              ) {
                throw new Error('GitHub returned an invalid pagination cursor')
              }
              cursor = commits.pageInfo.hasNextPage
                ? commits.pageInfo.endCursor
                : null
            } while (cursor)

            if (unverified.length === 0) {
              core.info(
                'All pull request commits have Verified signatures. ' +
                  'Existing guidance comments are retained.'
              )
              return
            }

            core.warning(
              `${unverified.length} commit(s) do not have Verified signatures.`
            )
            for (const oid of unverified) {
              core.info(`- ${oid.slice(0, 7)}`)
            }

            const marker =
              '<!-- Sticky Pull Request Commentcommit-signature-verification -->'
            const serverUrl =
              process.env.GITHUB_SERVER_URL || 'https://github.com'
            const guideUrl =
              `${serverUrl}/radius-project/radius/blob/main/` +
              'docs/contributing/contributing-code/' +
              'contributing-code-first-commit/' +
              'first-commit-06-creating-a-pr/index.md#signing-your-commits'
            const commitLines = unverified.map(
              oid =>
                `- [\`${oid.slice(0, 7)}\`](` +
                `${serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${oid})`
            )
            const body = [
              'Thank you for contributing to Radius.',
              '',
              'The following commits do not currently show a GitHub **Verified** signature:',
              '',
              ...commitLines,
              '',
              `Please follow our [commit-signing guide](${guideUrl}) to configure ` +
                'GPG, SSH, or S/MIME signing. Then re-sign the affected commits ' +
                'and force-push the rewritten branch with `--force-with-lease`.',
              '',
              'Cryptographic commit signing is separate from the DCO ' +
                '`Signed-off-by` line; both are required.',
              '',
              marker
            ].join('\n')

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: prNumber,
                per_page: 100
              }
            )
            const existing = comments.find(
              comment =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
            )

            if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body
              })
              core.info('Posted the signature guidance comment.')
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              })
              core.info('Updated the signature guidance comment.')
            } else {
              core.info('The signature guidance comment is already current.')
            }
