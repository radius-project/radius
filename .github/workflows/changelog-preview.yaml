# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: changelog-preview

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: changelog-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render unreleased changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find current channel boundary
        id: boundary
        shell: bash
        run: |
          latest_stable_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_stable_tag="$tag"
              break
            fi
          done < <(git tag --list "v*" --sort=-version:refname)

          if [[ -z "$latest_stable_tag" ]]; then
            echo "No stable Radius release tag was found." >&2
            exit 1
          fi

          base_commit="$(git merge-base "$latest_stable_tag" HEAD)"
          echo "range=${base_commit}..HEAD" >> "$GITHUB_OUTPUT"
          echo "Rendering changes since $latest_stable_tag branched at $base_commit."

      - name: Render unreleased changelog
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: --strip all --verbose ${{ steps.boundary.outputs.range }}
          github_token: ${{ github.token }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: changelog-preview.md

      - name: Add preview to workflow summary
        shell: bash
        run: |
          {
            echo "## Unreleased changelog preview"
            echo
            cat changelog-preview.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-preview-${{ github.sha }}
          path: changelog-preview.md
          if-no-files-found: error
          retention-days: 7
