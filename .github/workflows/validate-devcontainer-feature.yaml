# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Validate devcontainer-feature.json files
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "deploy/devcontainer-feature/**"
  #     - ".github/workflows/devcontainer-feature-test.yaml"
  #   branches:
  #     - main

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate devcontainer-feature.json files
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./deploy/devcontainer-feature/src
