# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: __build-helm-chart

on:
  workflow_call:

permissions: {}

jobs:
  build-and-push-helm-chart:
    name: Helm chart build
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # includes a bounded wait for sibling image publishers
    permissions:
      packages: write # Required for uploading the package
      contents: read # Required for actions/checkout
    env:
      ARTIFACT_DIR: ./dist/Charts
      HELM_PACKAGE_DIR: helm
      HELM_CHARTS_DIR: deploy/Chart
      OCI_REGISTRY: ghcr.io
      OCI_REPOSITORY: radius-project/helm-chart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm
        run: make install-helm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Run Helm linter
        run: helm lint "${HELM_CHARTS_DIR}"

      - name: Install image pinning tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: make install-jq install-yq install-oras

      - name: Setup Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate external image pinning
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pin external chart images
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=".github/release-plans/v${REL_VERSION}.yaml"
          lock="${RUNNER_TEMP}/deployment-engine-lock.json"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/release-state/deployment-engine.json?ref=automation/release-state-${REL_VERSION}" >"${lock}"
          jq -e --arg version "v${REL_VERSION}" --arg source "$(git rev-parse HEAD)" \
            '.version == $version and .releaseSourceCommit == $source and .deploymentEngine.signedTag == $version' "${lock}"
          bash ./.github/scripts/release-oci-artifacts.sh pin-image \
            --registry ghcr.io/radius-project --names deployment-engine \
            --version "${REL_VERSION}" --channel "$(jq -er '.deploymentEngine.imageTag' "${lock}")" \
            --source-sha "$(jq -er '.deploymentEngine.sourceCommit' "${lock}")" \
            --expected-digest "$(jq -er '.deploymentEngine.digest' "${lock}")"
          bash ./.github/scripts/release-oci-artifacts.sh pin-image \
            --registry ghcr.io/radius-project --names dashboard \
            --version "${REL_VERSION}" --channel "${REL_CHANNEL}" \
            --source-sha "$(yq -er '.siblingRepositories[] | select(.name == "dashboard") | .sourceCommit' "${plan}")"

      - name: Package Helm chart
        run: |
          mkdir -p "${ARTIFACT_DIR}/${HELM_PACKAGE_DIR}"
          helm package "${HELM_CHARTS_DIR}" --version "${CHART_VERSION}" --app-version "${REL_VERSION}" --destination "${ARTIFACT_DIR}/${HELM_PACKAGE_DIR}"

      - name: Push helm chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "${GH_TOKEN}" | helm registry login -u "${GH_ACTOR}" --password-stdin "${OCI_REGISTRY}"
          bash ./.github/scripts/publish-helm-chart.sh \
            --archive "${ARTIFACT_DIR}/${HELM_PACKAGE_DIR}/radius-${CHART_VERSION}.tgz" \
            --repository "oci://${OCI_REGISTRY}/${OCI_REPOSITORY}" \
            --name radius \
            --version "${CHART_VERSION}"
