# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: resume-release
run-name: Resume ${{ inputs.version }} from ${{ inputs.source-commit }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version including the v prefix
        required: true
        type: string
      source-commit:
        description: Exact commit that the Radius tag must reference
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'radius-project/radius'
    permissions:
      contents: write
    uses: ./.github/workflows/__dispatch-release-controller.yaml
    with:
      event-type: release-controller.resume
      version: ${{ inputs.version }}
      source-commit: ${{ inputs.source-commit }}
