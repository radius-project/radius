# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: PR Status Labels

# Only trusted base-branch code is executed with write permissions. The
# pull_request_review workflow is read-only; workflow_run relays its signal.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
      - edited
      - labeled
      - unlabeled
      - closed
      - enqueued
      - dequeued
  workflow_run:
    workflows: [PR Review Signal]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile (leave blank for all open PRs)
        required: false
        type: string

permissions: {}

concurrency:
  # Any all-PR run can update a PR-specific run's labels, so serialize every run.
  group: pr-status-labels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      (github.event_name != 'schedule' || github.repository == 'radius-project/radius') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request_review' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted label logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/pr-status-labels.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reconcile PR status labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-status-labels.mjs`
            )
            await run({ github, context, core })
