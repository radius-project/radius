# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: PR Required Labels

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  # Required so this check reports in the merge queue. There is no PR to
  # validate on a merge_group event, so the label check step is skipped and the
  # job reports success. Scoped to main only so the release branch flow is
  # never affected.
  merge_group:
    branches:
      - main

permissions: {}

jobs:
  pr-required-labels:
    # Run for all PRs so holds also apply to Dependabot. Merge groups have no
    # individual PR context; the required check still has to report.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted label configuration
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/scripts/pr-status-label-config.mjs
            .github/configs/pr-status-labels.yml
            .node-version
            package.json
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        if: github.event_name != 'merge_group'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install label configuration dependencies
        if: github.event_name != 'merge_group'
        run: corepack pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Reject merge holds and pending author responses
        if: github.event_name != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: loadLabels } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-status-label-config.mjs`
            )
            const { manual } = await loadLabels()
            const holds = Object.values(manual).filter((name) =>
              context.payload.pull_request.labels.some(
                (label) => label.name.toLowerCase() === name.toLowerCase()
              )
            )
            if (holds.length > 0) {
              core.setFailed(`Remove ${holds.join(" or ")} before merging.`)
            }

      - name: Run PR Required Labels
        if: github.event_name != 'merge_group' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          labels: |
            pr:standard
            pr:important
          add_comment: ${{ github.event.pull_request.head.repo.fork == false }}
          message: |
            This PR requires {{ errorString }} {{ count }} of the following labels: {{ provided }}.
            Currently applied labels: {{ applied }}.

            **Label descriptions:**
            - `pr:important` - Major features, breaking changes, deprecations, or other high-impact changes that need special attention during release and in release notes.
            - `pr:standard` - Ongoing maintenance, minor improvements, documentation updates, and routine development work.

            @${{ github.event.pull_request.user.login }}, please add the appropriate label to this PR before merging.
          exit_type: failure
