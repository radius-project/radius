# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: PR Required Labels

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  # Required so this check reports in the merge queue. There is no PR to
  # validate on a merge_group event, so the label check step is skipped and the
  # job reports success. Scoped to main only so the release branch flow is
  # never affected.
  merge_group:
    branches:
      - main

permissions: {}

jobs:
  pr-required-labels:
    # Run for all PRs so holds also apply to Dependabot. Merge groups have no
    # individual PR context; the required check still has to report.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this write-enabled job.
      # The repository requires actions, including organization actions, to be
      # pinned to a full commit SHA. The hold check reads only the event labels.
      - name: Reject merge holds and pending author responses
        if: github.event_name != 'merge_group'
        uses: radius-project/.github/.github/actions/pr-status-labels@03668d830f0e5b7a1ca8c610fe5859e149b989a5 # main
        with:
          mode: check-holds
          labels: ${{ vars.PR_STATUS_LABELS }}

      - name: Run PR Required Labels
        if: github.event_name != 'merge_group' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          labels: |
            pr:standard
            pr:important
          add_comment: ${{ github.event.pull_request.head.repo.fork == false }}
          message: |
            This PR requires {{ errorString }} {{ count }} of the following labels: {{ provided }}.
            Currently applied labels: {{ applied }}.

            **Label descriptions:**
            - `pr:important` - Major features, breaking changes, deprecations, or other high-impact changes that need special attention during release and in release notes.
            - `pr:standard` - Ongoing maintenance, minor improvements, documentation updates, and routine development work.

            @${{ github.event.pull_request.user.login }}, please add the appropriate label to this PR before merging.
          exit_type: failure
