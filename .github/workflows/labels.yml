# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: labels

# Repository label definitions are managed independently from PR lifecycle
# assignment. Keep other existing labels unchanged with skip-delete.
on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  pull_request:
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  label:
    types: [created, edited, deleted]

permissions: {}

concurrency:
  group: labels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout proposed labels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Preview label changes
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ github.token }}
          yaml-file: .github/labels.yml
          dry-run: true
          skip-delete: true

  sync:
    if: github.event_name == 'push' || github.event_name == 'label'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted labels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync PR labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ github.token }}
          yaml-file: .github/labels.yml
          skip-delete: true
