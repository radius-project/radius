# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*
  # Revalidate the combined changes when a PR is queued in the merge queue.
  # Scoped to main only so the release branch flow is never affected.
  merge_group:
    branches:
      - main

concurrency:
  # Cancel the previously triggered build for only PR build.
  group: lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/__changes.yml
    permissions:
      contents: read
      pull-requests: read

  # Preserve ordinary ignored-change skips. Release metadata keeps focused
  # validation, and failed classification must still fail the required status.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.only_changed != 'true' || needs.changes.outputs.release_metadata == 'true')
    timeout-minutes: 30
    env:
      GOPROXY: https://proxy.golang.org
      HELM_CHARTS_DIR: deploy/Chart
    permissions:
      contents: read
    steps:
      - name: Check change detection
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not succeed"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.outputs.only_changed != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Download Go modules
        if: needs.changes.outputs.only_changed != 'true'
        uses: ./.github/actions/go-mod-download

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install yq
        # Required by make generate to parse defaults.yaml.
        run: make install-yq

      - name: Setup Python
        if: needs.changes.outputs.only_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install release metadata tools
        if: needs.changes.outputs.only_changed == 'true'
        run: make install-jq install-git-cliff

      - name: Test release metadata
        if: needs.changes.outputs.only_changed == 'true'
        run: |
          make test-workflow-changes test-release-version-format \
            test-changelog-range test-changelog-config \
            test-prepare-release test-release-plan

      - name: Install helm
        if: needs.changes.outputs.only_changed != 'true'
        # Version pinned in build/tools.yaml (HELM_VERSION).
        run: make install-helm

      - name: Install golangci-lint
        if: needs.changes.outputs.only_changed != 'true'
        # Pinned version + checksums live in build/tools.yaml (GOLANGCI_LINT_VERSION).
        run: make install-golangci-lint

      - name: Install shellcheck
        if: needs.changes.outputs.only_changed != 'true'
        # Pinned version + checksums live in build/tools.yaml (SHELLCHECK_VERSION).
        run: make install-shellcheck

      # Run the independent, read-only linters concurrently. Each parallel step is
      # self-contained; the TypeSpec, Prettier, and deploy progress uploader
      # checks share a pnpm/corepack toolchain, so they are grouped into one step
      # to avoid racing on that shared install. The group has an implicit wait
      # that aggregates results: every linter runs and any failure fails this job
      # (a single status check).
      - parallel:
          - name: Go lint
            if: needs.changes.outputs.only_changed != 'true'
            run: make lint-go

          - name: Helm lint and unit tests
            if: needs.changes.outputs.only_changed != 'true'
            run: |
              helm lint "${HELM_CHARTS_DIR}"
              make test-helm

          - name: pnpm-based checks
            if: needs.changes.outputs.only_changed != 'true'
            run: |
              make tsp-format-check
              make format-check || { echo "Format check failed. Run 'make format-write' to fix the formatting issues."; exit 1; }

          - name: Shell lint
            if: needs.changes.outputs.only_changed != 'true'
            run: make lint-shell

      # The generated-code check mutates the working tree, so it runs
      # sequentially after the parallel linters rather than inside the group.
      - name: Run make generate
        if: needs.changes.outputs.only_changed != 'true'
        run: make generate

      - name: Check if generated code is up to date
        if: needs.changes.outputs.only_changed != 'true'
        continue-on-error: true
        id: gitdiff
        run: |
          git diff --exit-code

      - name: Check failures
        if: needs.changes.outputs.only_changed != 'true' && steps.gitdiff.outcome != 'success'
        run: |
          echo "Generated code is not up to date, run 'make generate' to update generated code."
          exit 1
