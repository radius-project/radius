# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: pr-status-labels-test

# This unprivileged workflow tests PR code, including code from forks.
on:
  pull_request:
    paths:
      - .github/scripts/pr-status-labels.mjs
      - .github/scripts/pr-status-labels.test.mjs
      - .github/workflows/pr-status-labels.yml
      - .github/workflows/pr-review-signal.yml
      - .github/workflows/pr-status-labels-test.yml
      - .github/labeler.yml

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test label transitions
        run: node --test .github/scripts/pr-status-labels.test.mjs
