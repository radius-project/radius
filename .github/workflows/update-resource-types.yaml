# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Update Resource Types

# Triggered via `repository_dispatch` (event type `resource-types-contrib-updated`)
# from radius-project/resource-types-contrib's notify-radius.yaml. A single event
# type carries both channels in its client_payload:
#   - channel "edge":    a push to contrib `main`; contrib_ref is the pushed
#                        commit SHA, used only for units with no stable release.
#   - channel "release": a published contrib release; contrib_ref is the release
#                        tag (a scope-prefixed tag affects one namespace or one
#                        recipe pack, a plain vX.Y.Z affects all namespaces).
# The payload lists exactly the affected units, each with its immutable ref:
#   { channel, contrib_repo, contrib_ref, namespaces: [ {namespace, ref}, ... ],
#     recipe_packs: [ {name, ref}, ... ], actor }
# `recipe_packs` is optional and covers the independent
# `recipe-pack/<pack>/vX.Y.Z` release series; at least one of the two arrays
# must be non-empty.
#
# This job opens (or refreshes) a PR that runs the atomic
# `make update-resource-types-and-recipe-packs` target with those pins. It
# selects a stable unit release when one exists, otherwise resolves the edge
# candidate to an immutable commit SHA, records it in
# deploy/manifest/defaults.yaml (`resourceTypes[]` / `recipePacks[]`), and
# re-copies the manifests under deploy/manifest/built-in-providers/. It then
# runs `make generate` and commits all resulting generated artifacts. The
# event's units advance, as do any consumed edge units whose first stable
# release is now available; entries Radius does not register are skipped.
#
# The bot branch is rebuilt from the current main on every dispatch. Pins that
# are still pending on its open PR are replayed as extra input to make, so
# updates stay cumulative without the branch ever having to be rebased.
#
# Merging the resulting PR triggers the existing `build-and-push-bicep-types`
# job in build.yaml, which dispatches to azure-octo/radius-publisher to
# republish `radius:latest` with the refreshed contrib types.
#
# See the design notes:
#   eng/design-notes/extensibility/2026-05-unified-bicep-extension-publishing.md
#   eng/design-notes/extensibility/2026-06-resource-types-sync-without-fake-go-module.md

on:
  repository_dispatch:
    types:
      - resource-types-contrib-updated

permissions: {}

concurrency:
  # Serialize every dispatch. The default single pending slot evicts an older
  # queued event when a newer one arrives, which can strand an affected unit on
  # an old pin when separate namespaces release close together.
  group: update-resource-types
  queue: max

env:
  PR_BRANCH: bot/update-resource-types
  CONTRIB_REPO: radius-project/resource-types-contrib

jobs:
  open-update-pr:
    name: Open update-resource-types PR
    if: github.repository == 'radius-project/radius'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Resolve dispatch payload
        # client_payload.namespaces and client_payload.recipe_packs are JSON
        # arrays of {name, ref} ({namespace, ref} is accepted for namespaces);
        # at least one must be non-empty. Every value is checked against an
        # allowlist before the arrays are forwarded as RESOURCE_TYPES_PINS /
        # RECIPE_PACKS_PINS, so make advances only the affected, registered
        # entries.
        id: contrib
        env:
          NAMESPACES_JSON: ${{ toJSON(github.event.client_payload.namespaces) }}
          RECIPE_PACKS_JSON: ${{ toJSON(github.event.client_payload.recipe_packs) }}
          CHANNEL: ${{ github.event.client_payload.channel }}
          CONTRIB_REF: ${{ github.event.client_payload.contrib_ref }}
          ACTOR: ${{ github.event.client_payload.actor }}
        run: |
          set -euo pipefail
          name_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          ref_re='^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$'

          # normalize <json> <label> validates an optional pin array and echoes
          # it as a compact [{name, ref}] array, or an empty array when the
          # payload omits it.
          normalize() {
            local json="${1:-null}" label="$2" name ref
            if [ -z "${json}" ] || [ "${json}" = "null" ]; then
              printf '[]'
              return 0
            fi
            if ! printf '%s' "${json}" | jq -e '
              type == "array" and
              all(.[]; type == "object" and
                ((.name // .namespace) | type == "string") and
                (.ref | type == "string"))
            ' > /dev/null; then
              echo "ERROR: client_payload.${label} must be an array of" \
                "{name, ref} objects." >&2
              exit 1
            fi
            while IFS=$'\t' read -r name ref; do
              if ! printf '%s' "${name}" | grep -Eq "${name_re}"; then
                echo "ERROR: invalid ${label} name '${name}'" >&2
                exit 1
              fi
              if ! printf '%s' "${ref}" | grep -Eq "${ref_re}"; then
                echo "ERROR: invalid ref '${ref}' for '${name}'" >&2
                exit 1
              fi
            done < <(
              printf '%s' "${json}" |
                jq -r '.[] | [(.name // .namespace), .ref] | @tsv'
            )
            printf '%s' "${json}" |
              jq -c '[.[] | {name: (.name // .namespace), ref}]'
          }

          ns_pins="$(normalize "${NAMESPACES_JSON:-null}" namespaces)"
          pack_pins="$(normalize "${RECIPE_PACKS_JSON:-null}" recipe_packs)"

          if [ "$(printf '%s' "${ns_pins}" | jq 'length')" -eq 0 ] &&
            [ "$(printf '%s' "${pack_pins}" | jq 'length')" -eq 0 ]; then
            echo "ERROR: repository_dispatch requires a non-empty namespaces" \
              "or recipe_packs array." >&2
            exit 1
          fi

          case "${CHANNEL:-}" in
            edge | release) ;;
            *)
              echo "ERROR: channel must be 'edge' or 'release'." >&2
              exit 1
              ;;
          esac

          affected="$(
            jq -rn --argjson ns "${ns_pins}" --argjson packs "${pack_pins}" '
              ($ns | map(.name)) +
              ($packs | map("recipe-pack/" + .name)) |
              join(", ")
            '
          )"
          {
            echo "pins<<PINS_EOF"
            printf '%s\n' "${ns_pins}"
            echo "PINS_EOF"
            echo "pack_pins<<PACK_PINS_EOF"
            printf '%s\n' "${pack_pins}"
            echo "PACK_PINS_EOF"
            echo "channel=${CHANNEL}"
            echo "ref=${CONTRIB_REF:-}"
            echo "actor=${ACTOR:-}"
            echo "affected=${affected}"
          } >> "${GITHUB_OUTPUT}"
          echo "Batch: channel=${CHANNEL} ref=${CONTRIB_REF:-}" \
            "affected=[${affected}]"

      - name: Generate App Token
        # Uses a GitHub App token instead of the default GITHUB_TOKEN so that
        # the bot can push the PR branch and the resulting PR triggers CI checks.
        # The default GITHUB_TOKEN cannot trigger workflows on pushes it creates.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RESOURCE_TYPES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESOURCE_TYPES_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            radius
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Git identity
        # Configure git author for the automated commit on the PR branch.
        run: |
          git config user.name "Radius CI Bot"
          git config user.email "radiuscoreteam@service.microsoft.com"

      - name: Install yq
        # Required by the resource type sync targets to parse defaults.yaml, and
        # by the branch preparation below.
        # install-yq appends its install dir to GITHUB_PATH, so yq is only on
        # PATH from the next step onwards.
        run: make install-yq

      - name: Prepare cumulative update branch
        # Rebuild the bot branch from the current main on every dispatch instead
        # of rebasing its previous commit. make update-resource-types
        # regenerates everything it writes, so the pin set is the only state
        # worth preserving: carrying the still-pending pins forward keeps
        # updates cumulative and can never conflict, whereas rebasing wedges the
        # branch as soon as main reshapes defaults.yaml.
        # Pins are only carried while the branch still has an open PR, so a
        # leftover already-merged branch cannot drag pins backwards.
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD_PINS: ${{ steps.contrib.outputs.pins }}
          PAYLOAD_PACK_PINS: ${{ steps.contrib.outputs.pack_pins }}
        run: |
          set -euo pipefail
          defaults=deploy/manifest/defaults.yaml

          git fetch origin main
          head_sha="$(
            git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}'
          )"

          # `gh pr list --head` matches a bare branch name only and silently
          # returns nothing for the `owner:branch` form, so the guard has to use
          # the REST filter, which scopes the lookup to this repo's branch and
          # cannot be satisfied by a fork branch of the same name.
          pr_query="repos/${GITHUB_REPOSITORY}/pulls?state=open"
          pr_query="${pr_query}&head=${GITHUB_REPOSITORY%%/*}:${PR_BRANCH}"

          pending='{}'
          open_prs=''
          if [ -n "${head_sha}" ]; then
            if ! open_prs="$(gh api "${pr_query}" --jq '.[].number')"; then
              echo "ERROR: failed to query the pending ${PR_BRANCH} pull request." >&2
              exit 1
            fi
          fi
          if [ -n "${head_sha}" ] && [ -n "${open_prs}" ]; then
            git fetch origin "${PR_BRANCH}"
            if git cat-file -e "FETCH_HEAD:${defaults}" 2> /dev/null; then
              pending="$(
                git show "FETCH_HEAD:${defaults}" | yq -o=json -I=0 '.'
              )"
              echo "Reading pending pins from ${PR_BRANCH}@${head_sha}."
            fi
          fi

          git checkout -B "${PR_BRANCH}" origin/main
          base="$(yq -o=json -I=0 '.' "${defaults}")"

          # carried <section> <legacy_section> <payload_json> echoes the branch
          # pins the payload does not already cover and main does not already
          # record with the same SHA *and* tag, as a [{name, ref}] array. The
          # tag has to be part of that comparison: a release can tag a commit
          # main is already pinned to, and comparing SHAs alone would discard
          # that tag-only pin. `sources`/`namespace` are the pre-rename
          # spellings of `resourceTypes`/`name`; accepting them keeps a branch
          # written against the older schema readable. An entry with a tag is
          # carried by tag so the tag survives re-resolution; a bare SHA is
          # re-pinned without a network round trip.
          carried() {
            jq -c --arg section "$1" --arg legacy "$2" \
              --argjson payload "$3" --argjson base "${base}" '
              [ (.[$section] // .[$legacy] // [])[]
                | {name: (.name // .namespace),
                   ref: (if (.tag // "") == "" then .ref else .tag end),
                   sha: .ref,
                   tag: (.tag // "")}
                | select(.name != null and .ref != null)
                | . as $e
                | select(($payload | any(.name == $e.name)) | not)
                | select(
                    (($base[$section] // [])
                      | any(.name == $e.name and .ref == $e.sha
                            and (.tag // "") == $e.tag)) | not
                  )
                | {name: .name, ref: .ref} ]
            ' <<< "${pending}"
          }

          carried_types="$(carried resourceTypes sources "${PAYLOAD_PINS}")"
          carried_packs="$(carried recipePacks '' "${PAYLOAD_PACK_PINS}")"
          pins="$(
            jq -cn --argjson a "${carried_types}" \
              --argjson b "${PAYLOAD_PINS}" '$a + $b'
          )"
          pack_pins="$(
            jq -cn --argjson a "${carried_packs}" \
              --argjson b "${PAYLOAD_PACK_PINS}" '$a + $b'
          )"
          carried_names="$(
            jq -rn --argjson a "${carried_types}" --argjson b "${carried_packs}" '
              ($a | map(.name)) + ($b | map("recipe-pack/" + .name)) |
              join(", ")
            '
          )"

          {
            echo "pins<<PINS_EOF"
            printf '%s\n' "${pins}"
            echo "PINS_EOF"
            echo "pack_pins<<PACK_PINS_EOF"
            printf '%s\n' "${pack_pins}"
            echo "PACK_PINS_EOF"
            echo "head_sha=${head_sha}"
            echo "carried=${carried_names}"
          } >> "${GITHUB_OUTPUT}"
          echo "Carried forward: [${carried_names}]"

      - name: Update resource types and recipe packs
        # Applies both payload sections before validating either one. This is
        # required for repository-wide releases, whose stable tag advances
        # namespaces and recipe packs together.
        env:
          RESOURCE_TYPES_PINS: ${{ steps.branch.outputs.pins }}
          RECIPE_PACKS_PINS: ${{ steps.branch.outputs.pack_pins }}
        run: |
          set -euo pipefail
          make update-resource-types-and-recipe-packs

      - name: Generate derived artifacts
        run: make generate

      - name: Detect changes
        # Uses git status --porcelain (not git diff --quiet) because
        # the update and generation targets may create new untracked files.
        # git diff only detects modifications to already-tracked files.
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No resource type or generated changes; nothing to do."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update PR branch
        # The branch was rebuilt from main, so the push always rewrites history.
        # Lease against the head read in "Prepare cumulative update branch" (an
        # empty value means the branch must not already exist) - a bare
        # --force-with-lease would lease against a remote-tracking ref this job
        # never creates, and would reject every push after the first.
        if: steps.changes.outputs.changed == 'true'
        env:
          CHANNEL: ${{ steps.contrib.outputs.channel }}
          AFFECTED: ${{ steps.contrib.outputs.affected }}
          CARRIED: ${{ steps.branch.outputs.carried }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          git add -A
          message="chore(resource-types): update from ${CONTRIB_REPO}"
          message+=" (${CHANNEL}: ${AFFECTED:-all})"
          if [ -n "${CARRIED}" ]; then
            message+=$'\n\n'"Carried forward: ${CARRIED}"
          fi
          git commit -m "${message}"
          git push --force-with-lease="refs/heads/${PR_BRANCH}:${HEAD_SHA}" \
            origin "HEAD:${PR_BRANCH}"

      - name: Open or update pull request
        # Creates a new PR if none exists for the bot branch, or updates the
        # existing one's title and body. Uses github-script because we need
        # conditional create-or-update logic that gh pr create doesn't support.
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANNEL: ${{ steps.contrib.outputs.channel }}
          AFFECTED: ${{ steps.contrib.outputs.affected }}
          CARRIED: ${{ steps.branch.outputs.carried }}
          CONTRIB_REF: ${{ steps.contrib.outputs.ref }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branch = process.env.PR_BRANCH;
            const channel = process.env.CHANNEL || "edge";
            const affected = process.env.AFFECTED || "";
            const carried = process.env.CARRIED || "";
            const contribRef = process.env.CONTRIB_REF || "";
            const title = "chore: refresh resource type manifests from resource-types-contrib";
            const body = [
              "Automated refresh of resource type manifests under `deploy/manifest/built-in-providers/`.",
              "",
              `Triggered by [\`${process.env.CONTRIB_REPO}\`](https://github.com/${process.env.CONTRIB_REPO}) on the \`${channel}\` channel at ref \`${contribRef}\`.`,
              affected ? `Affected: ${affected}.` : "",
              carried ? `Carried forward from the previous pending update: ${carried}.` : "",
              "",
              "Each affected entry is pinned to an immutable commit SHA in `deploy/manifest/defaults.yaml` (`resourceTypes[]` / `recipePacks[]`).",
              "",
              "Merging this PR will republish `br:biceptypes.azurecr.io/radius:latest` via the existing `build-and-push-bicep-types` job in `build.yaml`.",
            ].filter(Boolean).join("\n");

            const { owner, repo } = context.repo;
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: "open",
            });

            if (existing.length === 0) {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base: "main",
                body,
              });
              core.notice(`Opened PR #${pr.number}: ${pr.html_url}`);
            } else {
              const pr = existing[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.notice(`Refreshed existing PR #${pr.number}: ${pr.html_url}`);
            }
