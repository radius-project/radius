# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: __validate-build-images

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build container images without registry credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ghcr.io/radius-project/dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Parse release version
        run: python ./.github/scripts/get_release_version.py

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false

      - name: Build and save container images
        run: make docker-build docker-save-images
        env:
          DOCKER_TAG_VERSION: ${{ env.REL_VERSION }}
          DOCKER_CACHE_GHA: 1

      - name: Upload container image artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-images-${{ env.REL_VERSION }}
          path: ./dist/images/
          if-no-files-found: error
          retention-days: 1

      - name: Collect build metrics
        if: always()
        run: |
          make build-metrics
          cat dist/metrics/metrics.txt >> "$GITHUB_STEP_SUMMARY"
        env:
          DOCKER_TAG_VERSION: ${{ env.REL_VERSION }}

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metrics-${{ github.job }}
          path: dist/metrics/
