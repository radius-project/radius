# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: purge-old-images
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed test profile (protection cannot be disabled)
        type: choice
        options: [pr, functional, test-recipes, reviewed-tests]
        default: pr
      retention_days:
        description: Minimum age in days (at least 7)
        type: number
        default: 7
  schedule:
    - cron: 30 0,12 * * *
permissions: {}
jobs:
  plan:
    if: >-
      github.repository == 'radius-project/radius' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/__package-cleanup.yaml
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    with:
      mode: plan
      profile: ${{ inputs.profile }}
      retention_days: ${{ inputs.retention_days }}
    secrets:
      inventory_token: ${{ secrets.GH_RAD_CI_BOT_PAT || github.token }}
  scheduled_plan:
    if: github.repository == 'radius-project/radius' && github.event_name == 'schedule'
    uses: ./.github/workflows/__package-cleanup.yaml
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    with:
      mode: plan
    secrets:
      inventory_token: ${{ secrets.GH_RAD_CI_BOT_PAT || github.token }}
  create_issue_on_failure:
    name: Report scheduled cleanup plan failure
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [plan, scheduled_plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTION_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Package cleanup plan failed - Run ID: ${context.runId}`,
              labels: ['test-failure'],
              body: `The scheduled package inventory or plan failed. No deletion was requested. Review the artifacts and diagnostics: ${process.env.ACTION_LINK}`
            });
