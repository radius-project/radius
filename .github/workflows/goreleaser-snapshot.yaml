# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: goreleaser-snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/*
  merge_group:
    branches:
      - main

permissions: {}

concurrency:
  group: goreleaser-snapshot-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install comparison tools
        run: make install-jq install-yq

      - name: Install GoReleaser
        run: make install-goreleaser

      - name: Check configuration
        run: make goreleaser-check

      - name: Build and verify snapshot
        run: make goreleaser-snapshot

      - name: Upload snapshot metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-snapshot-${{ github.sha }}
          path: |
            dist/goreleaser/artifacts.json
            dist/goreleaser/metadata.json
            dist/goreleaser/*.sha256
          if-no-files-found: warn
          retention-days: 7
