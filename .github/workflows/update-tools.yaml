# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Update Tools

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-tools
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: >-
      github.repository == 'radius-project/radius' ||
      github.event_name == 'workflow_dispatch'
    name: Update
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PR_BRANCH: automation/update-tools
      PR_TITLE: "chore(tools): bump versions"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Check and update tool metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL_UPDATE_PR_BODY_OUTPUT: ${{ runner.temp }}/tool-update-pr-body.md
        run: make update-tools

      - name: Create App token
        if: github.repository == 'radius-project/radius'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPENDABOT_MANAGER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MANAGER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            radius
          permission-contents: write
          permission-pull-requests: write

      - name: Get bot details
        if: github.repository == 'radius-project/radius'
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      - name: Commit updates and create or update pull request
        id: create-pr
        if: github.repository == 'radius-project/radius'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          base: main
          commit-message: ${{ env.PR_TITLE }}
          # Used for the local DCO trailer. The API-created commit itself is
          # authored and signed by the App because sign-commits is enabled.
          committer: ${{ steps.bot-details.outputs.name-email }}
          signoff: true
          sign-commits: true
          title: ${{ env.PR_TITLE }}
          body-path: ${{ runner.temp }}/tool-update-pr-body.md

      - name: Require verified pull request commits
        if: >-
          steps.create-pr.outputs.pull-request-number != '' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "The tool-update pull request contains an unverified commit." >&2
          exit 1

      - name: Report fork limitation
        if: github.repository != 'radius-project/radius'
        run: |
          echo "PR creation is skipped outside radius-project/radius because"
          echo "the Dependabot-manager App secrets are unavailable to forks."
