# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: prepare-release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        required: true
        type: choice
        options:
          - rc
          - final
          - patch
      channel:
        description: Release channel in X.Y format
        required: true
        type: string
      product-commit:
        description: Optional full main SHA for a first RC; existing cutoffs cannot change
        required: false
        type: string
      backport-pr-numbers:
        description: Optional comma-separated merged main PRs to include
        required: false
        type: string

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.release-type }} for ${{ inputs.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    steps:
      - name: Checkout main with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release branches
        run: |
          git fetch origin \
            '+refs/heads/release/*:refs/remotes/origin/release/*'

      - name: Install release tools
        run: make install-yq install-jq install-git-cliff

      - name: Create release App token
        if: github.repository == 'radius-project/radius'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: radius
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Get release bot details
        if: github.repository == 'radius-project/radius'
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      # The Deployment Engine repository is private and belongs to azure-octo,
      # so neither GITHUB_TOKEN nor the release App can read its tags. The
      # publisher App is the cross-organization identity; its installation
      # must include deployment-engine with Contents read.
      - name: Create Deployment Engine read token
        if: github.repository == 'radius-project/radius'
        id: de-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_PUBLISHER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          owner: azure-octo
          repositories: deployment-engine
          permission-metadata: read
          permission-contents: read

      - name: Validate release prerequisites
        id: preflight
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT_COMMIT: ${{ inputs.product-commit }}
        run: |
          output_dir="${RUNNER_TEMP}/release-preflight"
          source_options=()
          if [[ -n "${PRODUCT_COMMIT}" ]]; then
            source_options+=(--product-commit "${PRODUCT_COMMIT}")
          fi
          bash ./.github/scripts/prepare-release.sh \
            --release-type "${RELEASE_TYPE}" \
            --channel "${CHANNEL}" \
            --output-dir "${output_dir}" \
            "${source_options[@]}" \
            --version-only
          version="$(<"${output_dir}/version.txt")"
          branch="$(<"${output_dir}/pr-branch.txt")"

          # A final promotes the channel's last release candidate.
          release_candidate=""
          if [[ "${RELEASE_TYPE}" == "final" ]]; then
            release_candidate="$(CHANNEL="${CHANNEL}" yq -r \
              '.supported[] | select(.channel == strenv(CHANNEL)) | .version' \
              versions.yaml)"
          fi

          existing="$(
            gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
              --head "${branch}" --base main \
              --json number,url,headRefOid,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)] | .[0] // empty'
          )"
          if [[ -n "${existing}" ]]; then
            existing_state=true
            existing_number="$(jq -r .number <<< "${existing}")"
            existing_url="$(jq -r .url <<< "${existing}")"
            existing_head="$(jq -r .headRefOid <<< "${existing}")"
          else
            set +e
            git ls-remote --exit-code origin "refs/heads/${branch}" \
              >/dev/null
            branch_status=$?
            set -e
            case "${branch_status}" in
              2) ;;
              0)
                echo "Branch ${branch} exists without an open PR." >&2
                exit 1
                ;;
              *)
                echo "Could not query branch ${branch}." >&2
                exit "${branch_status}"
                ;;
            esac
            existing_state=false
            existing_number=""
            existing_url=""
            existing_head=""
          fi

          reuse_frozen_plan=false
          migrate_frozen_plan=false
          if [[ "${existing_state}" == true &&
            "${version}" == "v${CHANNEL}.0-rc.1" ]]; then
            reuse_frozen_plan=true
            plan="${RUNNER_TEMP}/existing-release-plan.yaml"
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/.github/release-plans/${version}.yaml?ref=${existing_head}" \
              --jq .content | tr -d '\n' | base64 --decode > "${plan}"
            if [[ "$(yq -r '.source.productRef' "${plan}")" == HEAD ]]; then
              migrate_frozen_plan=true
            fi
            source_options+=(--existing-plan "${plan}")
          fi
          bash ./.github/scripts/prepare-release.sh \
            --release-type "${RELEASE_TYPE}" --channel "${CHANNEL}" \
            --output-dir "${output_dir}" "${source_options[@]}" \
            --version-only
          # A tag runs the frozen product's build tooling, not main's tooling.
          product_commit="$(<"${output_dir}/product-commit.txt")"
          bash ./.github/scripts/verify-release-build-contract.sh \
            "${product_commit}"

          {
            echo "existing=${existing_state}"
            echo "existing-number=${existing_number}"
            echo "existing-url=${existing_url}"
            echo "existing-head=${existing_head}"
            echo "version=${version}"
            echo "branch=${branch}"
            echo "release-candidate=${release_candidate}"
            echo "reuse-frozen-plan=${reuse_frozen_plan}"
            echo "migrate-frozen-plan=${migrate_frozen_plan}"
            echo "product-commit=${product_commit}"
          } >> "${GITHUB_OUTPUT}"

      # A final ships the Deployment Engine commit that its last RC locked. The
      # RC tag in the Deployment Engine repository can move; the GitHub-verified
      # lock on the RC's Radius tag cannot.
      - name: Read release candidate Deployment Engine lock
        if: inputs.release-type == 'final'
        id: rc-lock
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: release-candidate
          INPUT_VERSION: ${{ steps.preflight.outputs.version }}
          INPUT_RELEASE_CANDIDATE: ${{ steps.preflight.outputs.release-candidate }}
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-release-controller-lock.mjs`)
            await script({context, github, core})

      # The controller creates an absent Deployment Engine tag after approval:
      # at main for an RC or patch, and for a final at the commit its last RC
      # locked. Check that plan, or an existing tag, before the pull request.
      - name: Verify or plan Deployment Engine tag
        env:
          GH_TOKEN: ${{ steps.de-token.outputs.token || github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          RELEASE_CANDIDATE: ${{ steps.preflight.outputs.release-candidate }}
          RC_DE_COMMIT: ${{ steps.rc-lock.outputs.de-source-commit }}
        run: |
          args=(--allow-absent main "${VERSION}")
          if [[ "${RELEASE_TYPE}" == "final" ]]; then
            args=(--allow-absent "${RELEASE_CANDIDATE}" "${VERSION}"
              "${RC_DE_COMMIT:?the release candidate lock has no commit}")
          fi
          bash ./.github/scripts/verify-deployment-engine-tag.sh "${args[@]}"

      - name: Read curated notes from existing release pull request
        if: >-
          steps.preflight.outputs.existing == 'true' &&
          inputs.release-type != 'patch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}
          HEAD_SHA: ${{ steps.preflight.outputs.existing-head }}
        run: |
          output="${RUNNER_TEMP}/existing-release-notes.md"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/docs/release-notes/${VERSION}.md?ref=${HEAD_SHA}" \
            --jq .content | tr -d '\n' | base64 --decode > "${output}"

      - name: Collect selected backports
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CHANNEL: ${{ inputs.channel }}
          EXPLICIT_PRS: ${{ inputs.backport-pr-numbers }}
        run: |
          bash ./.github/scripts/collect-release-backports.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --channel "${CHANNEL}" \
            --explicit-prs "${EXPLICIT_PRS}" \
            --output "${RUNNER_TEMP}/release-backports.json"

      - name: Capture sibling repository commits
        env:
          CHANNEL: ${{ inputs.channel }}
          REUSE_FROZEN_PLAN: ${{ steps.preflight.outputs.reuse-frozen-plan }}
        run: |
          if [[ "${REUSE_FROZEN_PLAN}" == true ]]; then
            yq -o=json '.siblingRepositories' \
              "${RUNNER_TEMP}/existing-release-plan.yaml" \
              > "${RUNNER_TEMP}/release-siblings.json"
          else
            bash ./.github/scripts/capture-release-sibling-commits.sh \
              --channel "${CHANNEL}" \
              --output "${RUNNER_TEMP}/release-siblings.json"
          fi

      - name: Request incomplete explicit backports
        if: >-
          github.repository == 'radius-project/radius' &&
          inputs.backport-pr-numbers != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BACKPORT_PRS: ${{ inputs.backport-pr-numbers }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          release_branch="refs/remotes/origin/release/${CHANNEL}"
          git show-ref --verify --quiet "${release_branch}" || {
            echo "Explicit backports require release/${CHANNEL} to exist." >&2
            exit 1
          }

          label="backport release/${CHANNEL}"
          gh label create "${label}" --repo "${GITHUB_REPOSITORY}" \
            --color 5319E7 --description "Backport to release/${CHANNEL}" \
            --force
          IFS=',' read -r -a pull_requests <<< "${BACKPORT_PRS}"
          for pull_request in "${pull_requests[@]}"; do
            pull_request="${pull_request//[[:space:]]/}"
            gh pr edit "${pull_request}" --repo "${GITHUB_REPOSITORY}" \
              --add-label "${label}"
          done

      - name: Prepare release changes and plan
        id: prepare
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          CHANNEL: ${{ inputs.channel }}
          PREFLIGHT_VERSION: ${{ steps.preflight.outputs.version }}
          PRODUCT_COMMIT: ${{ inputs.product-commit }}
          REUSE_FROZEN_PLAN: ${{ steps.preflight.outputs.reuse-frozen-plan }}
        run: |
          output_dir="${RUNNER_TEMP}/release-preparation"
          source_options=()
          if [[ -n "${PRODUCT_COMMIT}" ]]; then
            source_options+=(--product-commit "${PRODUCT_COMMIT}")
          fi
          if [[ "${REUSE_FROZEN_PLAN}" == true ]]; then
            source_options+=(--existing-plan "${RUNNER_TEMP}/existing-release-plan.yaml")
          fi
          bash ./.github/scripts/prepare-release.sh \
            --release-type "${RELEASE_TYPE}" \
            --channel "${CHANNEL}" \
            --backports-file "${RUNNER_TEMP}/release-backports.json" \
            --sibling-repositories-file \
              "${RUNNER_TEMP}/release-siblings.json" \
            "${source_options[@]}" \
            --output-dir "${output_dir}"

          version="$(<"${output_dir}/version.txt")"
          requires_backport="$(<"${output_dir}/requires-backport.txt")"
          backport_label=""
          if [[ "${requires_backport}" == "true" ]]; then
            backport_label="backport release/${CHANNEL}"
          fi
          {
            echo "version=${version}"
            echo "title=$(<"${output_dir}/pr-title.txt")"
            echo "branch=$(<"${output_dir}/pr-branch.txt")"
            echo "backport-label=${backport_label}"
          } >> "${GITHUB_OUTPUT}"

          [[ "${version}" == "${PREFLIGHT_VERSION}" ]] || {
            echo "Release state changed after preflight." >&2
            exit 1
          }
          yq -o=json '.' "${output_dir}/release-plan.yaml" >"${output_dir}/plan.json"

      - name: Require validated RC coordination before a final
        if: inputs.release-type == 'final'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MODE: check-rc
          INPUT_PLAN_FILE: ${{ runner.temp }}/release-preparation/plan.json
        with:
          retries: 5
          script: |
            const { default: coordinate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/coordinate-release.mjs`)
            await coordinate({ github, context, core })

      - name: Preserve curated release note sections
        if: >-
          steps.preflight.outputs.existing == 'true' &&
          inputs.release-type != 'patch'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          bash ./.github/scripts/preserve-release-note-sections.sh \
            "docs/release-notes/${VERSION}.md" \
            "${RUNNER_TEMP}/existing-release-notes.md"

      - name: Reject concurrent preparation pull request edits
        if: steps.preflight.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.preflight.outputs.existing-number }}
          EXPECTED_HEAD: ${{ steps.preflight.outputs.existing-head }}
        run: |
          actual="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json headRefOid --jq .headRefOid)"
          [[ "${actual}" == "${EXPECTED_HEAD}" ]] || {
            echo "Release PR changed during preparation; rerun to retain its latest curation." >&2
            exit 1
          }
      - name: Ensure generated backport label exists
        if: >-
          github.repository == 'radius-project/radius' &&
          steps.prepare.outputs.backport-label != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LABEL: ${{ steps.prepare.outputs.backport-label }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          gh label create "${LABEL}" --repo "${GITHUB_REPOSITORY}" \
            --color 5319E7 --description "Backport to release/${CHANNEL}" \
            --force

      - name: Require renewed review of migrated first RC
        if: >-
          github.repository == 'radius-project/radius' &&
          steps.preflight.outputs.migrate-frozen-plan == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.preflight.outputs.existing-number }}
        run: |
          is_draft="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" == false ]]; then
            gh pr ready "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --undo
          fi

      - name: Create or update release pull request
        if: >-
          github.repository == 'radius-project/radius' &&
          steps.preflight.outputs.reuse-frozen-plan != 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.prepare.outputs.branch }}
          base: main
          commit-message: ${{ steps.prepare.outputs.title }}
          committer: ${{ steps.bot-details.outputs.name-email }}
          signoff: true
          sign-commits: true
          title: ${{ steps.prepare.outputs.title }}
          body-path: ${{ runner.temp }}/release-preparation/release-pr-body.md
          labels: ${{ steps.prepare.outputs.backport-label }}
          draft: true
          delete-branch: true
          add-paths: |
            .github/release-plans/*.yaml
            versions.yaml
            CHANGELOG.md
            docs/release-notes/*.md

      - name: Update frozen preparation without replacing PM commits
        if: >-
          github.repository == 'radius-project/radius' &&
          steps.preflight.outputs.reuse-frozen-plan == 'true'
        id: update-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_VERSION: ${{ steps.prepare.outputs.version }}
          INPUT_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INPUT_HEAD_SHA: ${{ steps.preflight.outputs.existing-head }}
          INPUT_PR_NUMBER: ${{ steps.preflight.outputs.existing-number }}
          INPUT_OUTPUT_DIR: ${{ runner.temp }}/release-preparation
          INPUT_WORKSPACE: ${{ github.workspace }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { updateFrozenPreparation } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/reconcile-frozen-release-source.mjs`)
            await updateFrozenPreparation({context, github, core})

      - name: Verify release pull request commit signature
        if: >-
          steps.create-pr.outputs.pull-request-operation == 'created' ||
          steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          COMMITS_VERIFIED: >-
            ${{ steps.create-pr.outputs.pull-request-commits-verified }}
        run: |
          [[ "${COMMITS_VERIFIED}" == "true" ]] || {
            echo "The release App did not create a verified commit." >&2
            exit 1
          }

      - name: Upload release plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan-${{ steps.prepare.outputs.version }}
          path: |
            ${{ runner.temp }}/release-preparation/release-plan.yaml
            ${{ runner.temp }}/release-preparation/changelog-section.md
            ${{ runner.temp }}/release-backports.json
            ${{ runner.temp }}/release-siblings.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize preparation
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          PR_URL: ${{ steps.update-pr.outputs.pull-request-url || steps.create-pr.outputs.pull-request-url }}
          PRODUCT_COMMIT: ${{ steps.preflight.outputs.product-commit }}
        run: |
          {
            echo "## Prepared ${VERSION}"
            echo
            echo "Product cutoff: ${PRODUCT_COMMIT}"
            if [[ -n "${PR_URL}" ]]; then
              echo "Release pull request: ${PR_URL}"
            else
              echo "PR creation was skipped outside radius-project/radius."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
