# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: Install Flux CLI and Source Controller
description: Installs Flux CLI and Source Controller.
inputs:
  version:
    description: Flux version to install
    required: false
    default: 2.6.4
runs:
  using: composite
  steps:
    - name: Install Flux CLI
      uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
      with:
        version: ${{ inputs.version }}

    - name: Install Flux Source Controller
      shell: bash
      run: |
        .github/actions/install-flux/install-flux.sh "${INPUT_VERSION}"
      env:
        INPUT_VERSION: ${{ inputs.version }}
