# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: Create a KinD cluster
description: |
  Create a KinD cluster.
inputs:
  secure:
    description: Whether the KinD cluster should be created with a secure local registry configuration
    required: false
    default: "false"
  temp-cert-dir:
    description: The temporary directory where the certificates are stored
    required: false
    default: ""
  with-local-registry:
    description: Whether the KinD cluster should be created with a local registry configuration
    required: false
    default: "false"
  registry-name:
    description: The name of the local registry
    required: true
    default: radius-registry
  registry-server:
    description: The server name for the local registry
    required: true
    default: localhost
  registry-port:
    description: The port for the local registry
    required: true
    default: "5000"
runs:
  using: composite
  steps:
    - name: Install KinD
      # Installs the version pinned in build/tools.yaml (KIND_VERSION) and adds the
      # install dir to the job PATH, so the cluster-create steps below find kind.
      shell: bash
      run: make install-kind

    - name: Create a KinD cluster without a local registry
      if: ${{ inputs.with-local-registry == 'false' }}
      shell: bash
      run: |
        # https://kind.sigs.k8s.io/docs/user/local-registry/
        # Create the cluster with necessary configurations
        # to expose 30080 port for the local Git server
        cat <<EOF | kind create cluster --config=-
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
        EOF

    - name: Create a KinD cluster with an insecure local registry
      if: ${{ inputs.with-local-registry == 'true' && inputs.secure == 'false' }}
      shell: bash
      run: |
        # Create the cluster with necessary configurations
        # to expose 30080 port for the local Git server
        cat <<EOF | kind create cluster --config=-
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
        containerdConfigPatches:
        - |-
          [plugins."io.containerd.grpc.v1.cri".registry]
            config_path = "/etc/containerd/certs.d"
        EOF

        REGISTRY_DIR="/etc/containerd/certs.d/localhost:${INPUT_REGISTRY_PORT}"
        for node in $(kind get nodes); do
          docker exec "${node}" mkdir -p "${REGISTRY_DIR}"
          cat <<EOF | docker exec -i "${node}" cp /dev/stdin "${REGISTRY_DIR}/hosts.toml"
        [host."http://${INPUT_REGISTRY_NAME}:5000"]
        EOF
        done

        if [ "$(docker inspect -f='{{json .NetworkSettings.Networks.kind}}' "${INPUT_REGISTRY_NAME}")" = 'null' ]; then
          docker network connect "kind" "${INPUT_REGISTRY_NAME}"
        fi

        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: local-registry-hosting
          namespace: kube-public
        data:
          localRegistryHosting.v1: |
            host: "localhost:${INPUT_REGISTRY_PORT}"
            help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
        EOF

        # Reference: https://kind.sigs.k8s.io/docs/user/local-registry/
      env:
        INPUT_REGISTRY_PORT: ${{ inputs.registry-port }}
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}

    - name: Create a KinD cluster with a secure local registry
      if: ${{ inputs.with-local-registry == 'true' && inputs.secure == 'true' }}
      shell: bash
      run: |
        # Create the cluster with necessary configurations for the secure local registry
        # and to expose 30080 port for the local Git server
        cat <<EOF | kind create cluster --config=-
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraMounts:
            - containerPath: "/etc/containerd/certs.d/${INPUT_REGISTRY_NAME}"
              hostPath: "${INPUT_TEMP_CERT_DIR}/certs/${INPUT_REGISTRY_SERVER}"
          extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
        containerdConfigPatches:
        - |-
          [plugins."io.containerd.grpc.v1.cri".registry]
            config_path = "/etc/containerd/certs.d"
        EOF

        # Create the directory for the certificates and add the certificate to the system trust store
        LOCALHOST_DIR="/etc/containerd/certs.d/${INPUT_REGISTRY_SERVER}:${INPUT_REGISTRY_PORT}"
        RADIUS_DIR="/etc/containerd/certs.d/${INPUT_REGISTRY_NAME}:${INPUT_REGISTRY_PORT}"

        for node in $(kind get nodes); do
          docker exec "${node}" mkdir -p "${LOCALHOST_DIR}"
          cat <<EOF | docker exec -i "${node}" cp /dev/stdin "${LOCALHOST_DIR}/hosts.toml"
        [host."http://${INPUT_REGISTRY_NAME}:${INPUT_REGISTRY_PORT}"]
          capabilities = ["pull", "resolve", "push"]
          skip_verify = true
        EOF

          docker exec "${node}" mkdir -p "${RADIUS_DIR}"
          cat <<EOF | docker exec -i "${node}" cp /dev/stdin "${RADIUS_DIR}/hosts.toml"
        [host."http://${INPUT_REGISTRY_NAME}:${INPUT_REGISTRY_PORT}"]
          capabilities = ["pull", "resolve", "push"]
          skip_verify = true
        EOF

          docker exec "${node}" systemctl restart containerd
        done

        # Connect the registry to the KinD network
        if [ "$(docker inspect -f='{{json .NetworkSettings.Networks.kind}}' "${INPUT_REGISTRY_NAME}")" = 'null' ]; then
          docker network connect "kind" "${INPUT_REGISTRY_NAME}"
        fi

        # Document the local registry
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: local-registry-hosting
          namespace: kube-public
        data:
          localRegistryHosting.v1: |
            host: "${INPUT_REGISTRY_NAME}:${INPUT_REGISTRY_PORT}"
            help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
        EOF
      env:
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
        INPUT_TEMP_CERT_DIR: ${{ inputs.temp-cert-dir }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry-server }}
        INPUT_REGISTRY_PORT: ${{ inputs.registry-port }}

    - name: Resolve the secure registry from cluster workloads
      if: ${{ inputs.with-local-registry == 'true' && inputs.secure == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Docker's network alias is visible to nodes, but not to pod DNS.
        registry_ip="$(docker inspect --format '{{.NetworkSettings.Networks.kind.IPAddress}}' "${INPUT_REGISTRY_NAME}")"
        if [[ -z "${registry_ip}" ]]; then
          echo "::error::Secure registry is not connected to the Kind network"
          exit 1
        fi
        kubectl -n kube-system get configmap coredns -o json |
          jq --arg host "${INPUT_REGISTRY_NAME}" --arg ip "${registry_ip}" \
            '.data.Corefile = "\($host):53 {\n    hosts {\n        \($ip) \($host)\n    }\n}\n" + .data.Corefile' |
          kubectl apply -f -
        kubectl -n kube-system rollout restart deployment/coredns
        kubectl -n kube-system rollout status deployment/coredns --timeout=90s
      env:
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
