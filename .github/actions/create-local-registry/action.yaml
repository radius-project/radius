# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: Create a local registry
description: |
  This action creates a local registry for the images to be pushed to.
  It uses the `docker` CLI to create a registry container and then starts it.
  The registry is then available at `localhost:5000` by default.
inputs:
  secure:
    description: Whether the registry should be secure or not
    required: false
    default: "false"
  registry-name:
    description: The name of the local registry
    required: false
    default: radius-registry
  registry-server:
    description: The server name for the local registry
    required: false
    default: localhost
  registry-port:
    description: The port for the local registry
    required: false
    default: "5000"
outputs:
  temp-cert-dir:
    description: The temporary directory where the certificates are stored
    value: ${{ steps.create-temp-cert-dir.outputs.TEMP_CERT_DIR }}
runs:
  using: composite
  steps:
    - name: Create temporary directory for certificates
      if: ${{ inputs.secure == 'true' }}
      shell: bash
      id: create-temp-cert-dir
      run: |
        # Create a temporary directory to store the certificates
        temp_cert_dir=$(mktemp -d 2>/dev/null || mktemp -d -t 'temp_cert_dir')
        echo "TEMP_CERT_DIR=$temp_cert_dir" >> $GITHUB_OUTPUT

    - name: Create certificates for local registry
      if: ${{ inputs.secure == 'true' }}
      shell: bash
      run: |
        create_openssl_cfg() {
          CFG=$(
            cat <<EOF
        [req]
        distinguished_name = subject
        x509_extensions    = x509_ext
        prompt             = no

        [subject]
        CN = localhost

        [x509_ext]
        basicConstraints        = critical, CA:TRUE
        subjectKeyIdentifier    = hash
        authorityKeyIdentifier  = keyid:always, issuer:always
        keyUsage                = critical, cRLSign, digitalSignature, keyCertSign
        nsComment               = "OpenSSL Generated Certificate"
        subjectAltName          = @alt_names

        [alt_names]
        DNS.1 = ${INPUT_REGISTRY_NAME}
        DNS.2 = ${INPUT_REGISTRY_SERVER}
        EOF
          )
          echo "$CFG"
        }

        TEMP_CERT_DIR="${STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR}"

        pushd "${TEMP_CERT_DIR}"
        # Create the directory for the certificates
        mkdir -p "certs/${INPUT_REGISTRY_SERVER}"

        echo "==== Generate the openssl config"
        create_openssl_cfg >req.cnf

        echo "==== Create the self signed certificate certificate and client key files"
        openssl req -x509 \
          -nodes \
          -days 365 \
          -newkey rsa:4096 \
          -keyout "certs/${INPUT_REGISTRY_SERVER}/client.key" \
          -out "certs/${INPUT_REGISTRY_SERVER}/client.crt" \
          -config req.cnf \
          -sha256
      env:
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry-server }}
        STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR: ${{ steps.create-temp-cert-dir.outputs.TEMP_CERT_DIR }}

    - name: Add the certificate to the system trust store
      if: ${{ inputs.secure == 'true' }}
      shell: bash
      run: |
        TEMP_CERT_DIR="${STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR}"
        sudo apt install ca-certificates
        sudo cp "${TEMP_CERT_DIR}/certs/${INPUT_REGISTRY_SERVER}/client.crt" "/usr/local/share/ca-certificates/${INPUT_REGISTRY_SERVER}.crt"
        sudo cp "${TEMP_CERT_DIR}/certs/${INPUT_REGISTRY_SERVER}/client.crt" "/usr/local/share/ca-certificates/${INPUT_REGISTRY_NAME}.crt"
        sudo update-ca-certificates
      env:
        STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR: ${{ steps.create-temp-cert-dir.outputs.TEMP_CERT_DIR }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry-server }}
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}

    - name: Add registry name to /etc/hosts
      shell: bash
      run: |
        echo "127.0.0.1 ${INPUT_REGISTRY_NAME}" | sudo tee -a /etc/hosts
      env:
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}

    - name: Create secure Docker registry
      if: ${{ inputs.secure == 'true' }}
      shell: bash
      run: |
        TEMP_CERT_DIR="${STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR}"
        echo "==== Create secure Docker registry"
        docker run -d \
          -p "${INPUT_REGISTRY_PORT}:5000" \
          --restart=always \
          --name "${INPUT_REGISTRY_NAME}" \
          -v "${TEMP_CERT_DIR}/certs/${INPUT_REGISTRY_SERVER}:/certs" \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/client.crt \
          -e REGISTRY_HTTP_TLS_KEY=/certs/client.key \
          registry:2
      env:
        STEPS_CREATE_TEMP_CERT_DIR_OUTPUTS_TEMP_CERT_DIR: ${{ steps.create-temp-cert-dir.outputs.TEMP_CERT_DIR }}
        INPUT_REGISTRY_PORT: ${{ inputs.registry-port }}
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry-server }}

    - name: Create insecure Docker registry
      if: ${{ inputs.secure == 'false' }}
      shell: bash
      run: |
        echo "==== Create insecure Docker registry"
        docker run -d \
          -p "${INPUT_REGISTRY_PORT}:5000" \
          --restart=always \
          --name "${INPUT_REGISTRY_NAME}" \
          registry:2
      env:
        INPUT_REGISTRY_PORT: ${{ inputs.registry-port }}
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
