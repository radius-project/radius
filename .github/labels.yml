# Radius-specific labels. The shared PR lifecycle and hold labels come from
# labels/pr-status.yml in radius-project/.github; .github/workflows/labels.yml
# merges both catalogs. Other repository labels are preserved.
---
- name: pr:standard
  color: 86a16a
  description: Ongoing maintenance, minor improvements, documentation updates, and routine development work
- name: pr:important
  color: 86a16a
  description: High-impact changes needing special attention during release and in release notes
