# Provider-agnostic deploy-status publisher shared by run-rad-commands-aws.yml
# and run-rad-commands-azure.yml. Captures the deployed app graph from the live
# control plane and publishes it as a workflow artifact so the canvas "Deployed"
# graph view has a producer for deploy-graph.json.
#
# Workflow artifacts (rather than a GHCR OCI artifact) are the transport because
# they are readable over the REST API while the run is still in progress, which
# is what lets the canvas show deployment state as it happens:
#   GET /repos/{o}/{r}/actions/runs/{run_id}/artifacts   - during the run
#   GET /repos/{o}/{r}/actions/artifacts?name=<name>     - newest-first, later
# They also need no extra registry, no packages:write permission, and no
# registry/tag derivation duplicated between this action and the canvas reader.
name: Radius - Publish deploy status
description: Generate deploy-graph.json and publish deploy status files as a workflow artifact.

inputs:
  environment:
    description: Radius environment name.
    required: true
  app-file:
    description: Application bicep file used for deploy.
    required: true

outputs:
  artifact-name:
    description: Name of the published deploy status artifact, empty when nothing was published.
    value: ${{ steps.generate.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Generate deployed graph and status files
      id: generate
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        APP_FILE: ${{ inputs.app-file }}
      run: |
        set -euo pipefail

        RESULT_FILE=/tmp/radius-output/rad-commands-result.json
        # A deterministic directory, not `mktemp -d`, because the upload step below
        # is a separate composite step that needs to reference this path.
        # RUNNER_TEMP is always set by the Actions runner; the fallback only makes
        # the step runnable outside one, which is what lets it be unit tested.
        STATUS_DIR="${RUNNER_TEMP:-/tmp}/radius-deploy-status"
        rm -rf "$STATUS_DIR"
        mkdir -p "$STATUS_DIR"

        # Emit step outputs exactly once, immediately before exiting, rather than
        # writing defaults up front and overwriting them later. Duplicate keys in
        # $GITHUB_OUTPUT would leave which value wins as an implementation detail,
        # and getting it wrong fails silently: the upload step would be skipped on
        # a good deploy, or run with an empty artifact name.
        emit_outputs() {
          {
            echo "artifact-name=${1}"
            echo "status-dir=${STATUS_DIR}"
            echo "published=${2}"
          } >> "$GITHUB_OUTPUT"
        }

        # Escape workflow-command metacharacters before interpolating a value into
        # a ::warning::/::error:: annotation: '%' is the escape character and CR/LF
        # terminate the command, so an unescaped value can corrupt or truncate the
        # annotation. Same treatment as deploy-parameters.sh in run-rad-commands.
        escape_workflow_command() {
          local escaped="$1"
          escaped=${escaped//'%'/'%25'}
          escaped=${escaped//$'\r'/'%0D'}
          escaped=${escaped//$'\n'/'%0A'}
          printf '%s' "$escaped"
        }

        # Resolve the app name from the app bicep file first (same pattern used
        # elsewhere in the run-rad-commands action), with a fallback to `rad app
        # list` when the file doesn't contain a simple literal name.
        APP_NAME=$(grep -oP "name:\s*'\K[^']+" "$APP_FILE" 2>/dev/null | head -1 || true)
        APP_NAME_FROM_LITERAL=1
        if [ -z "$APP_NAME" ]; then
          APP_NAME_FROM_LITERAL=0
          APP_NAME=$(rad app list -o json 2>/dev/null | jq -r '.[0].name // .items[0].name // empty' || true)
        fi

        if [ -z "$APP_NAME" ]; then
          echo "::warning::Could not determine application name; skipping deployed graph publish."
          emit_outputs "" false
          exit 0
        fi

        echo "Generating deployed graph for app '$APP_NAME' in environment '$ENVIRONMENT'..."
        # Keep stderr out of STATUS_DIR: that directory is uploaded wholesale as the
        # artifact, so anything written there becomes part of the published payload.
        GRAPH_STDERR=$(mktemp)
        if ! rad app graph --application "$APP_NAME" --preview --include-icons --output json > "$STATUS_DIR/deploy-graph.json" 2> "$GRAPH_STDERR"; then
          echo "::warning::Failed to generate deployed graph; skipping publish."
          cat "$GRAPH_STDERR" || true
          emit_outputs "" false
          exit 0
        fi

        # Write sibling status files the canvas reads with deploy-graph.json.
        # These are distinct signals and must carry distinct content. An earlier
        # version copied rad-commands-result.json into all of them, which published
        # identical files that told the reader nothing about what actually happened.
        NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        OUTCOME="unknown"
        EXIT_CODE="0"
        if [ -f "$RESULT_FILE" ]; then
          OUTCOME=$(jq -r '.outcome // "unknown"' "$RESULT_FILE" 2>/dev/null || echo "unknown")
          EXIT_CODE=$(jq -r '.exitCode // 0' "$RESULT_FILE" 2>/dev/null || echo "0")
        fi

        # Run-level state, using the vocabulary the canvas expects. This step runs
        # after `rad deploy` has already returned, so the state is terminal
        # whenever the result file is readable.
        #
        # "unknown" is the sentinel for a missing or unreadable result file, and is
        # the one case where we genuinely do not know the outcome - report it as
        # neutral rather than claiming a failure the deploy may not have had. That
        # makes `in_progress` reachable today, on a run that has already finished:
        # it means "no verdict", not "still running". Real
        # non-success outcomes from run-rad-commands (command_failed,
        # disallowed_command) must still map to failed, or a broken deploy would be
        # reported as merely unfinished.
        case "$OUTCOME" in
          succeeded|success) RUN_STATE="succeeded" ;;
          unknown)           RUN_STATE="in_progress" ;;
          *)                 RUN_STATE="failed" ;;
        esac

        # deploy-progress.json - per-resource status, the signal that paints the
        # graph. Schema is the contract agreed with the canvas reader; see
        # docs/design in radius-project/ai-extensions. Both the raw
        # provisioningState and a normalized status are emitted: the producer owns
        # the mapping because it knows the Radius version, and the consumer can
        # still recover if that mapping goes stale. Unknown states normalize to
        # in_progress, never failed, so a new Radius state cannot paint a node red.
        #
        # `rad resource list -o json` marshals []generated.GenericResource directly
        # (pkg/cli/cmd/resource/list/list.go), so the payload is a bare array with
        # no object wrapper - iterate it with `.[]?` and nothing else.
        RESOURCES_JSON="[]"
        if RAW_RESOURCES=$(rad resource list -a "$APP_NAME" -o json 2>/dev/null); then
          RESOURCES_JSON=$(printf '%s' "$RAW_RESOURCES" | jq -c '
            [ .[]? | {
                id: (.id // ""),
                name: (.name // ""),
                type: (.type // ""),
                provisioningState: (.properties.provisioningState // ""),
                status: (
                  (.properties.provisioningState // "") as $s
                  | if   $s == "Succeeded" then "success"
                    elif $s == "Failed" or $s == "Canceled" or $s == "Cancelled" then "failed"
                    else "in_progress"
                    end
                ),
                message: (.properties.status.message // "")
              } ]' 2>/dev/null) || RESOURCES_JSON="[]"
        fi
        [ -n "$RESOURCES_JSON" ] || RESOURCES_JSON="[]"

        jq -n \
          --argjson resources "$RESOURCES_JSON" \
          --arg application "$APP_NAME" \
          --arg environment "$ENVIRONMENT" \
          --argjson runId "${GITHUB_RUN_ID:-0}" \
          --arg updatedAt "$NOW_UTC" \
          --arg state "$RUN_STATE" \
          '{
            schemaVersion: 1,
            application: $application,
            environment: $environment,
            runId: $runId,
            sequence: 1,
            updatedAt: $updatedAt,
            state: $state,
            resources: $resources
          }' > "$STATUS_DIR/deploy-progress.json"

        # deploy-activity.log - the rad command result envelope (outcome/exit code).
        # Optional for the canvas; kept because it is useful when debugging a run.
        if [ -f "$RESULT_FILE" ]; then
          cp "$RESULT_FILE" "$STATUS_DIR/deploy-activity.log"
        else
          printf '{"warning":"rad-commands-result.json not found"}\n' > "$STATUS_DIR/deploy-activity.log"
        fi

        # deploy-controlplane.log - control-plane health at publish time.
        {
          echo "# rad version"
          rad version 2>&1 || true
          echo ""
          echo "# rad env list"
          rad env list -o json 2>&1 || true
        } > "$STATUS_DIR/deploy-controlplane.log" 2>&1 || true

        printf 'state=%s\nexitCode=%s\napplication=%s\nenvironment=%s\nupdatedAt=%s\nsha=%s\n' \
          "$OUTCOME" "$EXIT_CODE" "$APP_NAME" "$ENVIRONMENT" "$NOW_UTC" "$GITHUB_SHA" \
          > "$STATUS_DIR/deploy-state.txt"

        # Derive the artifact name the canvas will look up. Sanitize under LC_ALL=C
        # so the [^a-z0-9._-] class is evaluated bytewise: in the runner's UTF-8
        # locale GNU sed leaves multi-byte characters (the "é" in "café", or "™")
        # intact, and those are not valid in a GitHub artifact name. Bytewise
        # sanitization also keeps this in step with the canvas reader's own
        # derivation, so both sides agree on the name for the same app.
        BASE_NAME=$(printf '%s-%s' "$ENVIRONMENT" "$APP_NAME" | LC_ALL=C tr '[:upper:]' '[:lower:]' | LC_ALL=C sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' | LC_ALL=C cut -c1-80)
        if [ -z "$BASE_NAME" ]; then
          BASE_NAME="deploy-status"
        fi
        ARTIFACT_NAME="radius-deploy-status-${BASE_NAME}"

        # The canvas derives this same name from the app bicep's first
        # single-quoted `name:` literal and has no `rad app list` fallback, so a
        # name resolved that way publishes under a name it will never request.
        # Say so explicitly instead of leaving an empty Deployed tab to debug.
        if [ "$APP_NAME_FROM_LITERAL" -eq 0 ]; then
          echo "::warning::Application name '$(escape_workflow_command "$APP_NAME")' came from 'rad app list', not a literal name in $(escape_workflow_command "$APP_FILE"). Publishing as '$(escape_workflow_command "$ARTIFACT_NAME")', but the canvas derives the name from the bicep literal and will not find this artifact. Set a literal name in the app bicep."
        fi

        emit_outputs "$ARTIFACT_NAME" true

        echo "Deploy status files ready in '$STATUS_DIR'; publishing as artifact '$ARTIFACT_NAME'."
    # Publishing status is best-effort reporting, not part of the deployment
    # itself: every failure path in the step above warns and exits 0 so a
    # reporting problem never fails an otherwise successful deploy. Skipping the
    # upload when nothing was generated keeps that property here.
    - name: Upload deploy status artifact
      if: steps.generate.outputs.published == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.generate.outputs.artifact-name }}
        path: ${{ steps.generate.outputs.status-dir }}
        # The canvas reads the newest artifact with this name, so retention bounds
        # how long the Deployed tab keeps working after a deploy.
        retention-days: 30
        if-no-files-found: warn
        overwrite: true
