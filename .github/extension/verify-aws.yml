name: Radius - Verify Credentials
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        default: '{{ENV}}'

permissions:
  id-token: write
  contents: read
  # Mirrors the run-rad-commands deploy workflow so the GHCR push-permission
  # check below tests the same token capability the deploy will rely on.
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          aws sts get-caller-identity
          echo "✅ AWS OIDC login successful"

      - name: Verify EKS Access
        run: |
          aws eks update-kubeconfig --name "${{ vars.AWS_EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          kubectl cluster-info
          echo "✅ EKS cluster accessible"

      - name: Verify GHCR package push permission
        uses: radius-project/radius/.github/extension/actions/verify-ghcr-push@{{RADIUS_REF}}
        with:
          state-registry: ${{ vars.RADIUS_STATE_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Credentials Verified" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Provider: aws" >> $GITHUB_STEP_SUMMARY
          echo "GHCR package push: ${GHCR_PUSH_CHECK:-unknown}" >> $GITHUB_STEP_SUMMARY
