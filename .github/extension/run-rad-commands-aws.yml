# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
# This workflow is auto-generated by Radius to run rad commands against an AWS
# environment. It is a reusable (workflow_call) workflow invoked by the unified
# run-rad-commands.yml dispatcher; it is not dispatched directly. It creates an
# ephemeral k3d cluster for the Radius control plane, connects to the user's EKS
# cluster, restores persisted state, runs the requested rad commands (deploying by
# default), then persists state again and tears the cluster down. The provider-
# agnostic phases are shared composite actions in radius-project/radius; only the
# AWS-specific steps live here. This is the run-rad-commands action in the
# two-action Repo Radius model (the other being verify-cloud-auth).
name: Radius - Run rad Commands (AWS)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name'
        type: string
        required: true
      image:
        description: 'Container image passed only when the application template declares the image parameter'
        type: string
        required: false
        default: ''
      rad_commands:
        description: 'rad CLI command string, or JSON array of command strings (rad prefix omitted; split on whitespace, so arguments with spaces are not supported). Overrides the default deploy.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  packages: write

env:
  ENVIRONMENT: ${{ inputs.environment }}
  APP_FILE: '{{APP_FILE}}'
  APP_IMAGE: ${{ inputs.image || github.sha || 'latest' }}
  # Target-cluster architecture-aware container image builds. Rendered by the
  # Radius extension: TARGET_CLUSTER_ARCH_MODE -> ${{ vars.RADIUS_BUILD_ARCH_MODE
  # || 'detect' }} and TARGET_CLUSTER_ARCH_FALLBACK_PLATFORMS ->
  # ${{ vars.RADIUS_BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}. When a
  # template does not opt in, the unsubstituted placeholder disables the feature
  # and the containerImages recipe's default platforms apply (existing behavior).
  TARGET_CLUSTER_ARCH_MODE: "{{TARGET_CLUSTER_ARCH_MODE}}"
  TARGET_CLUSTER_ARCH_FALLBACK_PLATFORMS: "{{TARGET_CLUSTER_ARCH_FALLBACK_PLATFORMS}}"

jobs:
  deploy:
    name: Deploy with Radius
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    # OCI-backed Radius control-plane state, provisioned per-environment by the
    # deploy tooling (canvas extension) as environment variables. Set at job
    # level (not workflow level) so environment-scoped vars.* resolve, and so the
    # shared restore-state (rad startup) and teardown (rad shutdown) actions —
    # plus the deploy/app-graph commands — inherit them and can open the state
    # archive. Without these, rad startup fails with "OCI archive repository is
    # not configured; set RADIUS_STATE_REGISTRY or RADIUS_GRAPH_REGISTRY".
    env:
      RADIUS_STATE_BACKEND: ${{ vars.RADIUS_STATE_BACKEND }}
      RADIUS_STATE_REGISTRY: ${{ vars.RADIUS_STATE_REGISTRY }}
      RADIUS_STATE_ARCHIVE: ${{ vars.RADIUS_STATE_ARCHIVE }}
      RADIUS_GRAPH_REGISTRY: ${{ vars.RADIUS_GRAPH_REGISTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to GHCR for the state archive
        # The OCI-backed Radius state archive authenticates to GHCR using the
        # runner's Docker credential store (~/.docker/config.json). rad startup
        # (restore-state) and rad shutdown (teardown) open that archive, so the
        # runner must be logged in BEFORE those steps run -- otherwise the pull
        # is anonymous and GHCR rejects the private radius-state package with a
        # 401. docker login persists for the whole job, covering teardown too.
        # GITHUB_TOKEN has packages: write (set at job level) for repo-linked
        # packages; a PAT can be supplied instead for other-owner packages.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get target cluster kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "RADIUS_TARGET_KUBECONFIG=$HOME/.kube/target-cluster" >> "$GITHUB_ENV"

      - name: Connect to EKS cluster
        if: ${{ vars.AWS_EKS_CLUSTER_NAME != '' }}
        run: |
          CLUSTER="${{ vars.AWS_EKS_CLUSTER_NAME }}"
          REGION="${{ vars.AWS_REGION }}"
          ROLE_ARN="${{ vars.AWS_ROLE_ARN }}"
          TARGET="$RADIUS_TARGET_KUBECONFIG"

          # Ensure the IAM role has access to the EKS cluster. These calls are
          # idempotent by intent: a ResourceInUseException means the entry/policy is
          # already present, which is fine to ignore. Any other failure (auth,
          # permissions, throttling) is surfaced with its stderr and fails the step
          # rather than being masked behind an "already exists" message.
          echo "Ensuring EKS access entry for $ROLE_ARN..."
          if ! err=$(aws eks create-access-entry \
            --cluster-name "$CLUSTER" \
            --principal-arn "$ROLE_ARN" \
            --type STANDARD \
            --region "$REGION" 2>&1); then
            if printf '%s' "$err" | grep -q 'ResourceInUseException'; then
              echo "Access entry already exists"
            else
              printf '%s\n' "$err" >&2
              exit 1
            fi
          fi
          if ! err=$(aws eks associate-access-policy \
            --cluster-name "$CLUSTER" \
            --principal-arn "$ROLE_ARN" \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
            --access-scope type=cluster \
            --region "$REGION" 2>&1); then
            if printf '%s' "$err" | grep -q 'ResourceInUseException'; then
              echo "Access policy already associated"
            else
              printf '%s\n' "$err" >&2
              exit 1
            fi
          fi

          # Build a static kubeconfig with a bearer token instead of exec-based auth.
          # The exec-based config requires aws CLI inside the container, which Radius
          # images don't have.
          ENDPOINT=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" --query 'cluster.endpoint' --output text)
          CA_DATA=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" --query 'cluster.certificateAuthority.data' --output text)
          TOKEN=$(aws eks get-token --cluster-name "$CLUSTER" --region "$REGION" --output json | jq -r '.status.token')
          printf 'apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: %s\n    server: %s\n  name: eks\ncontexts:\n- context:\n    cluster: eks\n    user: eks-user\n  name: eks\ncurrent-context: eks\nkind: Config\nusers:\n- name: eks-user\n  user:\n    token: %s\n' "$CA_DATA" "$ENDPOINT" "$TOKEN" > "$TARGET"
          echo "EKS kubeconfig saved with static token"
          kubectl --kubeconfig "$TARGET" cluster-info || echo "WARNING: Could not connect to EKS cluster"

      - name: Set up control plane
        uses: radius-project/radius/.github/extension/actions/setup-control-plane@{{RADIUS_REF}}

      - name: Load Radius contrib catalog
        uses: radius-project/radius/.github/extension/actions/load-contrib-catalog@{{RADIUS_REF}}

      - name: Project cloud OIDC tokens into Radius pods
        run: |
          # Mint GitHub OIDC tokens and mount them where Radius expects them.
          # GitHub Actions is already a trusted OIDC issuer for both AWS and Azure
          # (via the CloudFormation template / AAD federated credential), so no
          # custom issuer setup is needed.

          if [ -n "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Projecting AWS OIDC token..."
            AWS_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
            kubectl create secret generic aws-oidc-token -n radius-system \
              --from-literal=token="$AWS_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Mount the projected token at the fixed paths Radius reads from. The
          # cloud identity selectors (AWS role ARN, Azure client/tenant id) are NOT
          # set as SDK-native env vars here -- they come from the UCP credential
          # registered later via `rad credential register`. We only project the raw
          # token file that the credential needs for the federated token exchange.

          # AWS IRSA: the UCP AWS proxy (ucp) and the Terraform AWS provider
          # (dynamic-rp) both read the token from the hard-coded path
          # /var/run/secrets/eks.amazonaws.com/serviceaccount/token.
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ]; then
            AWS_PATCH='[
              {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"aws-oidc-token","secret":{"secretName":"aws-oidc-token"}}},
              {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"aws-oidc-token","mountPath":"/var/run/secrets/eks.amazonaws.com/serviceaccount","readOnly":true}}
            ]'
            for deploy in applications-rp dynamic-rp ucp; do
              kubectl patch deployment $deploy -n radius-system --type=json -p="$AWS_PATCH" 2>/dev/null || true
            done
          fi

          # Wait for any patched deployments to roll out.
          for deploy in applications-rp dynamic-rp bicep-de ucp; do
            kubectl rollout status deployment/$deploy -n radius-system --timeout=300s || true
          done
          echo "✅ Cloud OIDC tokens projected into Radius pods."

      - name: Refresh external deployment target credentials
        run: |
          TARGET_KUBECONFIG="$RADIUS_TARGET_KUBECONFIG"

          if [ ! -f "$TARGET_KUBECONFIG" ]; then
            echo "No target kubeconfig found, resources will deploy to k3d cluster"
            exit 0
          fi

          # Refresh the EKS token right before deploy (EKS tokens are short-lived
          # and the one minted earlier may have expired during install).
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ -n "${{ vars.AWS_EKS_CLUSTER_NAME }}" ]; then
            echo "Generating fresh EKS token..."
            CLUSTER="${{ vars.AWS_EKS_CLUSTER_NAME }}"
            REGION="${{ vars.AWS_REGION }}"
            ENDPOINT=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" --query 'cluster.endpoint' --output text)
            CA_DATA=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGION" --query 'cluster.certificateAuthority.data' --output text)
            TOKEN=$(aws eks get-token --cluster-name "$CLUSTER" --region "$REGION" --output json | jq -r '.status.token')
            printf 'apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: %s\n    server: %s\n  name: eks\ncontexts:\n- context:\n    cluster: eks\n    user: eks-user\n  name: eks\ncurrent-context: eks\nkind: Config\nusers:\n- name: eks-user\n  user:\n    token: %s\n' "$CA_DATA" "$ENDPOINT" "$TOKEN" > "$TARGET_KUBECONFIG"
          fi

          # Update the secret the chart mounted at install with the refreshed
          # kubeconfig, then restart the recipe-executing pods so they re-read it.
          # The chart owns the volume mount and RADIUS_TARGET_KUBECONFIG env var via
          # global.targetCluster.enabled, so no manual deployment patching is needed.
          # All three pods honor RADIUS_TARGET_KUBECONFIG natively: applications-rp
          # (direct-rendered resources) and dynamic-rp (Terraform kubernetes provider)
          # via the cluster access resolver, and bicep-de (Bicep 'extension kubernetes'
          # provider). The Terraform state backend deliberately stays on the
          # control-plane cluster, so no backend override is needed here.
          kubectl create secret generic target-kubeconfig --namespace radius-system \
            --from-file=kubeconfig="$TARGET_KUBECONFIG" --dry-run=client -o yaml | kubectl apply -f -
          for deploy in applications-rp dynamic-rp bicep-de; do
            kubectl rollout restart deployment/$deploy -n radius-system
          done

          echo "Waiting for rollouts..."
          kubectl rollout status deployment/applications-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/dynamic-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/bicep-de -n radius-system --timeout=300s
          echo "External deployment target configured."

      - name: Restore Radius state
        uses: radius-project/radius/.github/extension/actions/restore-state@{{RADIUS_REF}}
        with:
          namespace: ${{ vars.KUBERNETES_NAMESPACE || 'default' }}

      - name: Register cloud credentials with Radius
        run: |
          # Register the cloud identity with Radius using its UCP credential model.
          # Radius stores only the identity selector (AWS role ARN / Azure client +
          # tenant id); the short-lived token is read at runtime from the GitHub
          # OIDC token file projected into the pods in the earlier step. This keeps
          # the credential visible to `rad credential show`, rotatable, and usable
          # by both the Bicep and Terraform code paths.
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Registering AWS IRSA credential..."
            rad credential register aws irsa --iam-role "${{ vars.AWS_ROLE_ARN }}"
          fi
          echo "✅ Cloud credentials registered with Radius."

      - name: Create Radius environment and recipe pack
        run: |
          # load-contrib-catalog exports the catalog and generic accessors from
          # the same Radius ref as this generated workflow.
          source "$RADIUS_CONTRIB_CATALOG_HELPER"
          NAMESPACE="${{ vars.KUBERNETES_NAMESPACE || 'default' }}"

          # Registry and credentials for the Radius.Compute/containerImages recipe.
          # The recipe builds images with the in-pod BuildKit and pushes them to
          # $BUILD_REGISTRY, authenticating with the Kubernetes Secret named
          # $REGISTRY_SECRET_NAME. That Secret is created on the target cluster by
          # the app's Radius.Security/secrets resource during `rad deploy` (fed by
          # the registryUsername/registryPassword parameters conditionally injected
          # by the run-rad-commands action when the app declares them). Only the secret
          # NAME is wired here via the recipe pack's registrySecretName.
          # $BUILD_REGISTRY is ghcr.io/<owner>/<repo> so images land under the
          # repository's package namespace; it must be lowercase.
          BUILD_REGISTRY=$(echo "${{ vars.RADIUS_BUILD_REGISTRY || format('ghcr.io/{0}', github.repository) }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_SECRET_NAME="radius-ghcr-registry-creds"

          # Resolve every Recipe source from deploy/manifest/defaults.yaml.
          CONTAINERIMAGES_SOURCE="$(radius_contrib_kube_recipe_source Radius.Compute/containerImages containerimages)"
          CONTAINERS_SOURCE="$(radius_contrib_resource_git_source Radius.Compute/containers recipes/kubernetes/terraform)"
          PERSISTENTVOLUMES_SOURCE="$(radius_contrib_resource_git_source Radius.Compute/persistentVolumes recipes/kubernetes/terraform)"
          ROUTES_SOURCE="$(radius_contrib_resource_git_source Radius.Compute/routes recipes/kubernetes/terraform)"
          POSTGRESQL_SOURCE="$(radius_contrib_resource_git_source Radius.Data/postgreSqlDatabases recipes/kubernetes/terraform)"
          MYSQL_SOURCE="$(radius_contrib_resource_git_source Radius.Data/mySqlDatabases recipes/aws/terraform)"
          SECRETS_SOURCE="$(radius_contrib_resource_git_source Radius.Security/secrets recipes/kubernetes/terraform)"

          # Select the provider-specific recipe pack. Both provider packs share the
          # Bicep containerImages recipe and the Kubernetes compute/data recipes,
          # and differ only in the mySQL database recipe and cloud provider config.
          PACK_NAME="aws-terraform"
          MYSQL_RECIPE=$(cat <<EOF
          'Radius.Data/mySqlDatabases': {
            kind: 'terraform'
            source: '$MYSQL_SOURCE'
            parameters: {
              vpcId: '${{ vars.RADIUS_VPC_ID }}'
              subnetIds: '${{ vars.RADIUS_SUBNET_IDS }}'
            }
          }
          EOF
          )
          CLOUD_PROVIDER=$(cat <<EOF
          aws: {
            accountId: '${{ vars.AWS_ACCOUNT_ID }}'
            region: '${{ vars.AWS_REGION }}'
          }
          EOF
          )
          echo "Selected recipe pack: $PACK_NAME"

          # Generate a Bicep file that defines a recipe pack bundling every
          # recipe and a Radius.Core/environments resource that references it.
          # Write it next to the app file so `rad deploy` resolves the repo's own
          # bicepconfig.json (which declares the `radius` extension). bicep resolves
          # the config nearest the .bicep file, so writing to $APP_DIR (e.g. .radius/)
          # picks up .radius/bicepconfig.json instead of the workspace root.
          APP_DIR=$(dirname "$APP_FILE")
          ENV_BICEP="$APP_DIR/radius-env.bicep"
          # Ensure the destination directory exists before writing. The checkout
          # branch may not contain the app's directory (e.g. .radius/), in which
          # case the redirect below would fail with "No such file or directory".
          mkdir -p "$APP_DIR"
          cat > "$ENV_BICEP" <<EOF
          extension radius

          resource recipePack 'Radius.Core/recipePacks@2025-08-01-preview' = {
            name: '$PACK_NAME'
            properties: {
              recipes: {
                'Radius.Compute/containerImages': {
                  kind: 'bicep'
                  source: '$CONTAINERIMAGES_SOURCE'
                  parameters: {
                    registry: '$BUILD_REGISTRY'
                    registrySecretName: '$REGISTRY_SECRET_NAME'
                  }
                }
                'Radius.Compute/containers': {
                  kind: 'terraform'
                  source: '$CONTAINERS_SOURCE'
                }
                'Radius.Compute/persistentVolumes': {
                  kind: 'terraform'
                  source: '$PERSISTENTVOLUMES_SOURCE'
                }
                'Radius.Compute/routes': {
                  kind: 'terraform'
                  source: '$ROUTES_SOURCE'
                }
                'Radius.Data/postgreSqlDatabases': {
                  kind: 'terraform'
                  source: '$POSTGRESQL_SOURCE'
                }
                'Radius.Security/secrets': {
                  kind: 'terraform'
                  source: '$SECRETS_SOURCE'
                }
          $MYSQL_RECIPE
              }
            }
          }

          resource env 'Radius.Core/environments@2025-08-01-preview' = {
            name: '$ENVIRONMENT'
            properties: {
              recipePacks: [
                recipePack.id
              ]
              providers: {
                kubernetes: {
                  namespace: '$NAMESPACE'
                }
          $CLOUD_PROVIDER
              }
            }
          }
          EOF

          echo "Generated radius-env.bicep:"
          cat "$ENV_BICEP"
          echo ""
          echo "Deploying Radius.Core/environments and recipe pack..."
          rad deploy "$ENV_BICEP"
          echo "✅ Environment '$ENVIRONMENT' created with recipe pack."

      - name: Apply custom recipe packs
        uses: radius-project/radius/.github/extension/actions/apply-custom-recipe-packs@{{RADIUS_REF}}
        with:
          environment: ${{ inputs.environment }}
          app-file: ${{ env.APP_FILE }}

      - name: Prepare live deployment progress
        uses: radius-project/radius/.github/extension/actions/deploy-progress/artifact-uploader@{{RADIUS_REF}}

      # Resolve and validate the deploy timeout before it reaches `timeout-minutes`
      # below. The runner applies a step timeout only when it evaluates to a value
      # greater than zero, and an expression that fails to evaluate is recorded as
      # an error but still leaves the step unbounded. So `0`, a negative number, or
      # a malformed value would silently restore the very behavior this timeout
      # exists to prevent. Reject those loudly instead. The upper bound is a
      # ceiling, not a guarantee: the setup steps before this one draw on the same
      # 360-minute job budget, so a value near the ceiling can still leave the job
      # out of time for the teardown that persists Radius state.
      - name: Resolve deploy timeout
        id: deploy-timeout
        env:
          REQUESTED: ${{ vars.RADIUS_DEPLOY_TIMEOUT_MINUTES }}
        run: |
          set -euo pipefail
          requested="${REQUESTED:-30}"
          if [[ ! "$requested" =~ ^[0-9]{1,4}$ ]]; then
            echo "ERROR: RADIUS_DEPLOY_TIMEOUT_MINUTES must be a whole number of minutes, got '${requested}'." >&2
            exit 1
          fi
          # Normalize to base 10 so a value like `030` is not read as octal and does
          # not reach fromJSON, which rejects leading zeros.
          minutes=$((10#$requested))
          if (( minutes < 1 || minutes > 330 )); then
            echo "ERROR: RADIUS_DEPLOY_TIMEOUT_MINUTES must be between 1 and 330, got '${requested}'." >&2
            exit 1
          fi
          echo "minutes=${minutes}" >> "$GITHUB_OUTPUT"
          echo "Bounding the deploy step at ${minutes} minute(s)."

      # Bound the deploy phase so a pathologically slow build (for example an
      # emulated cross-architecture container build) fails in minutes instead of
      # burning the job's 360-minute default. The bound is on this step and not
      # on the job: a job-level timeout cancels the job, which skips the
      # `!cancelled()` publish step below, and would fold the setup steps into
      # the same budget. A failed step keeps publish and teardown running
      # normally on the job's remaining budget.
      - name: Run rad commands
        timeout-minutes: ${{ fromJSON(steps.deploy-timeout.outputs.minutes) }}
        uses: radius-project/radius/.github/extension/actions/run-rad-commands@{{RADIUS_REF}}
        with:
          environment: ${{ inputs.environment }}
          app-file: ${{ env.APP_FILE }}
          app-image: ${{ env.APP_IMAGE }}
          namespace: ${{ vars.KUBERNETES_NAMESPACE || 'default' }}
          rad-commands: ${{ inputs.rad_commands || vars.RADIUS_RAD_COMMANDS }}
          deploy-params: ${{ secrets.RADIUS_DEPLOY_PARAMS }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-arch-mode: ${{ env.TARGET_CLUSTER_ARCH_MODE }}
          build-fallback-platforms: ${{ env.TARGET_CLUSTER_ARCH_FALLBACK_PLATFORMS }}

      # Publish status on failure too: an empty Deployed tab is least helpful
      # exactly when a deploy failed and the user is trying to see which
      # resource broke. `!cancelled()` covers success and failure but skips
      # cancellation, where the control plane is already being torn down.
      - name: Publish deployed graph and status
        if: ${{ !cancelled() }}
        uses: radius-project/radius/.github/extension/actions/publish-deploy-status@{{RADIUS_REF}}
        with:
          environment: ${{ inputs.environment }}
          app-file: ${{ env.APP_FILE }}

      - name: Teardown
        if: always()
        uses: radius-project/radius/.github/extension/actions/teardown@{{RADIUS_REF}}
