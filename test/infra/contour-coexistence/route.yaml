apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radius-route
  namespace: ingress-probe
spec:
  parentRefs:
    - name: radius
      namespace: radius-system
      sectionName: http
  hostnames:
    - radius.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
