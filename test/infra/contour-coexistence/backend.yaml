apiVersion: v1
kind: Namespace
metadata:
  name: ingress-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: ingress-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      hostname: coexistence-backend
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: ingress-probe
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-route
  namespace: ingress-probe
spec:
  ingressClassName: traefik
  rules:
    - host: traefik.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
